    @keyframes shake {
      0%, 100% { transform: translateX(0); }

    .animate-shake {

    @keyframes iosSheetEnter {

    @keyframes iosSheetExit {
      0% { transform: translateY(0); }
      100% { transform: translateY(100%); }
    }
    @keyframes iosBackdropFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes iosBackdropFadeOut {

    .animate-ios-sheet {

      will-change: transform;
    }
    .animate-ios-sheet-exit {
      animation: iosSheetExit 0.26s cubic-bezier(0.32, 0.72, 0, 1) forwards;

      animation: iosSpringPopOut 0.18s cubic-bezier(0.32, 0.72, 0, 1) forwards;

    /* Tab View Transition */

      100% { transform: translateY(0); opacity: 1; }

    .animate-ios-tab-view {
      animation: iosTabFade 0.25s cubic-bezier(0.32, 0.72, 0, 1) forwards;
      will-change: transform, opacity;
    }

    /* iOS Tactile Haptic Press */
    .ios-btn-tap, .ios-touch-item, .ios-card-tap {
      transition: transform 0.15s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.15s ease;
      will-change: transform;

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // =========================================================================
    // 1. DATA LAYER (LOCAL STORAGE SERVICE & LEDGER UTILITIES)
    // =========================================================================
    const STORAGE_KEYS = {
      PIN: 'voralet_pin',
      NAME: 'voralet_name',
      USERNAME: 'voralet_username',
      ACCOUNTS: 'voralet_accounts',
      TRANSACTIONS: 'voralet_transactions',
      SAVINGS_GOALS: 'voralet_savings_goals',
      HIDE_BALANCE: 'voralet_hide_balance',
      THEME: 'voralet_theme',
      AVATAR: 'voralet_avatar'
    };

    const StorageService = {
      getPin: () => {
        try {
          return localStorage.getItem(STORAGE_KEYS.PIN);
        } catch (e) {
          console.error('Storage error getting PIN', e);
          return null;
        }
      },
      setPin: (pin) => {
        try {
          localStorage.setItem(STORAGE_KEYS.PIN, pin);
        } catch (e) {
          console.error('Storage error setting PIN', e);
        }
      },
      getName: () => {
        try {
          return localStorage.getItem(STORAGE_KEYS.NAME) || '';
        } catch (e) {
          return '';
        }
      },
      setName: (name) => {
        try {
          localStorage.setItem(STORAGE_KEYS.NAME, name);
        } catch (e) {
          console.error('Storage error setting Name', e);
        }
      },
      getUsername: () => {
        try {
          return localStorage.getItem(STORAGE_KEYS.USERNAME) || '';
        } catch (e) {
          return '';
        }
      },
      setUsername: (username) => {
        try {
          const clean = (username || '').toLowerCase().replace(/[^a-z0-9_]/g, '');
          localStorage.setItem(STORAGE_KEYS.USERNAME, clean);
        } catch (e) {
          console.error('Storage error setting Username', e);
        }
      },
      getAccounts: () => {
        try {
          const data = localStorage.getItem(STORAGE_KEYS.ACCOUNTS);
          return data ? JSON.parse(data) : [];
        } catch (e) {
          console.error('Storage error getting Accounts', e);
          return [];
        }
      },
      setAccounts: (accounts) => {
        try {
          localStorage.setItem(STORAGE_KEYS.ACCOUNTS, JSON.stringify(accounts));
        } catch (e) {
          console.error('Storage error saving Accounts', e);
        }
      },
      getTransactions: () => {
        try {
          const data = localStorage.getItem(STORAGE_KEYS.TRANSACTIONS);
          return data ? JSON.parse(data) : [];
        } catch (e) {
          console.error('Storage error getting Transactions', e);
          return [];
        }
      },
      setTransactions: (transactions) => {
        try {
          localStorage.setItem(STORAGE_KEYS.TRANSACTIONS, JSON.stringify(transactions));
        } catch (e) {
          console.error('Storage error saving Transactions', e);
        }
      },
      getSavingsGoals: () => {
        try {
          const data = localStorage.getItem(STORAGE_KEYS.SAVINGS_GOALS);
          return data ? JSON.parse(data) : [];
        } catch (e) {
          console.error('Storage error getting Savings Goals', e);
          return [];
        }
      },
      setSavingsGoals: (goals) => {
        try {
          localStorage.setItem(STORAGE_KEYS.SAVINGS_GOALS, JSON.stringify(goals));
        } catch (e) {
          console.error('Storage error saving Savings Goals', e);
        }
      },
      getHideBalance: () => {
        try {
          return localStorage.getItem(STORAGE_KEYS.HIDE_BALANCE) === 'true';
        } catch (e) {
          return false;
        }
      },
      setHideBalance: (val) => {
        try {
          localStorage.setItem(STORAGE_KEYS.HIDE_BALANCE, val ? 'true' : 'false');
        } catch (e) {}
      },
      getTheme: () => {
        try {
          return localStorage.getItem(STORAGE_KEYS.THEME) || 'light';
        } catch (e) {
          return 'light';
        }
      },
      setTheme: (theme) => {
        try {
          localStorage.setItem(STORAGE_KEYS.THEME, theme);
        } catch (e) {}
      },
      getAvatar: () => {
        try {
          return localStorage.getItem(STORAGE_KEYS.AVATAR) || '';
        } catch (e) {
          return '';
        }
      },
      setAvatar: (avatar) => {
        try {
          if (avatar) {
            localStorage.setItem(STORAGE_KEYS.AVATAR, avatar);
          } else {
            localStorage.removeItem(STORAGE_KEYS.AVATAR);
          }
        } catch (e) {
          console.error('Storage error saving Avatar', e);
        }
      },
      clearAll: () => {
        try {
          localStorage.removeItem(STORAGE_KEYS.PIN);
          localStorage.removeItem(STORAGE_KEYS.NAME);
          localStorage.removeItem(STORAGE_KEYS.USERNAME);
          localStorage.removeItem(STORAGE_KEYS.ACCOUNTS);
          localStorage.removeItem(STORAGE_KEYS.TRANSACTIONS);
          localStorage.removeItem(STORAGE_KEYS.SAVINGS_GOALS);
          localStorage.removeItem(STORAGE_KEYS.HIDE_BALANCE);
          localStorage.removeItem(STORAGE_KEYS.THEME);
          localStorage.removeItem(STORAGE_KEYS.AVATAR);
        } catch (e) {
          console.error('Storage error clearing all', e);
        }
      }
    };

    // Client-side image compression: Scales down image (max 200x200px) and converts to Base64
    const compressImage = (file, callback, onError) => {
      if (!file || !file.type.startsWith('image/')) {
        if (onError) onError('File harus berupa gambar');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const maxDim = 200;
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              }
            } else {
              if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            callback(dataUrl);
          } catch (err) {
            console.error('Canvas compression error', err);
            if (onError) onError('Gagal memproses gambar');
          }
        };
        img.onerror = () => {
          if (onError) onError('Gagal memuat gambar');
        };
        img.src = e.target.result;
      };
      reader.onerror = () => {
        if (onError) onError('Gagal membaca file gambar');
      };
      reader.readAsDataURL(file);
    };

    // Reusable Avatar Component (Photo with Fallback to Initials)
    const Avatar = ({ avatar, name, size = "w-8 h-8", textSize = "text-xs", className = "" }) => {
      if (avatar) {
        return (
          <img
            src={avatar}
            alt={name || "Foto Profil"}
            className={`${size} rounded-full object-cover border border-slate-200 dark:border-slate-700 shrink-0 ${className}`}
          />
        );
      }
      const initial = (name ? name.trim().charAt(0) : 'V').toUpperCase();
      return (
        <div
          className={`${size} rounded-full bg-brand text-white flex items-center justify-center font-bold ${textSize} shrink-0 ${className}`}
        >
          {initial}
        </div>
      );
    };

    // LEDGER SYSTEM: Single Source of Truth for Balances
    // Current Account Balance = Initial Deposit + Total Income - Total Expense
    const Ledger = {
      getAccountBalance: (accountId, accounts, transactions) => {
        if (!accountId) return 0;
        const safeAccounts = Array.isArray(accounts) ? accounts : [];
        const safeTx = Array.isArray(transactions) ? transactions : [];
        const acc = safeAccounts.find(a => a && a.id === accountId);
        if (!acc) return 0;
        const initial = Number(acc.initialBalance) || 0;
        const sumTx = safeTx
          .filter(t => t && t.accountId === accountId)
          .reduce((sum, t) => {
            const amt = Number(t.amount) || 0;
            return t.type === 'INCOME' ? sum + amt : sum - amt;
          }, 0);
        return initial + sumTx;
      },
      getTotalBalance: (accounts, transactions) => {
        const safeAccounts = Array.isArray(accounts) ? accounts : [];
        const safeTx = Array.isArray(transactions) ? transactions : [];
        return safeAccounts.reduce((total, acc) => {
          if (!acc) return total;
          return total + Ledger.getAccountBalance(acc.id, safeAccounts, safeTx);
        }, 0);
      },
      getSummaryTotals: (transactions, filterAccountId = null) => {
        const safeTx = Array.isArray(transactions) ? transactions : [];
        const filtered = filterAccountId
          ? safeTx.filter(t => t && t.accountId === filterAccountId)
          : safeTx;
        let income = 0;
        let expense = 0;
        for (const t of filtered) {
          if (!t) continue;
          const amt = Number(t.amount) || 0;
          if (t.type === 'INCOME') income += amt;
          else if (t.type === 'EXPENSE') expense += amt;
        }
        return { income, expense, net: income - expense };
      }
    };

    // Currency Formatting Helpers
    const formatIDR = (amount) => {
      const num = Number(amount) || 0;
      return 'Rp ' + new Intl.NumberFormat('id-ID').format(num);
    };

    const parseRawNumber = (str) => {
      if (typeof str === 'number') return str;
      if (!str) return 0;
      const clean = str.toString().replace(/\D/g, '');
      return clean ? parseInt(clean, 10) : 0;
    };

    const formatDateID = (dateStr) => {
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('id-ID', {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        });
      } catch (e) {
        return dateStr;
      }
    };

    // Category Configuration with Clean SVG Stroke Line Icons
    const CATEGORIES = [
      { id: 'makan', label: 'Makan & Minum', icon: 'food', type: 'EXPENSE' },
      { id: 'transport', label: 'Transportasi', icon: 'transport', type: 'EXPENSE' },
      { id: 'belanja', label: 'Belanja', icon: 'shopping', type: 'EXPENSE' },
      { id: 'tagihan', label: 'Tagihan & Utilitas', icon: 'bill', type: 'EXPENSE' },
      { id: 'hiburan', label: 'Hiburan', icon: 'entertainment', type: 'EXPENSE' },
      { id: 'kesehatan', label: 'Kesehatan', icon: 'health', type: 'EXPENSE' },
      { id: 'gaji', label: 'Gaji & Honor', icon: 'salary', type: 'INCOME' },
      { id: 'bonus', label: 'Bonus & Hadiah', icon: 'gift', type: 'INCOME' },
      { id: 'investasi', label: 'Hasil Investasi', icon: 'investment', type: 'INCOME' },
      { id: 'lainnya', label: 'Lainnya', icon: 'tag', type: 'ALL' }
    ];

    // =========================================================================
    // 2. ICON COMPONENT (Flat Clean Line SVGs - Crisp Vector Lines)
    // =========================================================================
    const Icon = ({ name, className = "w-5 h-5", strokeWidth = 2 }) => {
      switch (name) {
        case 'x':
        case 'X':
        case 'close':
        case 'Close':
        case 'dismiss':
        case 'Dismiss':
        case 'cancel':
        case 'times':
          return (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          );
        case 'wallet':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={strokeWidth}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
            </svg>
          );
        case 'bank':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={strokeWidth}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M3 21h18M3 10h18M5 10v11M9 10v11M15 10v11M19 10v11M12 3l9 7H3l9-7z" />
            </svg>
          );
        case 'cash':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={strokeWidth}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
          );
        case 'smartphone':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={strokeWidth}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
          );
        case 'arrow-up-right':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={strokeWidth}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M7 17L17 7M17 7H7M17 7V17" />
            </svg>
          );
        case 'arrow-down-left':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={strokeWidth}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M17 7L7 17M7 17H17M7 17V7" />
            </svg>
          );
        case 'eye':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={strokeWidth}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          );
        case 'eye-off':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={strokeWidth}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            </svg>
          );
        case 'lock':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={strokeWidth}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          );
        case 'settings':

    const SplashScreen = ({ onFinish }) => {
      const [isFadingOut, setIsFadingOut] = useState(false);

      useEffect(() => {
        // Hold for 1.2s then begin cross-fade exit (400ms duration)
        const timerHold = setTimeout(() => {
          setIsFadingOut(true);
        }, 1200);

        const timerDone = setTimeout(() => {
          onFinish();
        }, 1600);

        return () => {
          clearTimeout(timerHold);
          clearTimeout(timerDone);
        };
      }, [onFinish]);

      return (
        <div
          className={`fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-white dark:bg-slate-900 transition-opacity duration-400 ease-out select-none ${
            isFadingOut ? 'opacity-0 pointer-events-none' : 'opacity-100'
          }`}
          style={{ willChange: 'opacity' }}
        >
          <div className="flex flex-col items-center animate-ios-splash-logo text-center px-4">
            <div className="w-20 h-20 rounded-2xl bg-brand flex items-center justify-center text-white shadow-lg shadow-sky-500/20 mb-4">

    const PinDots = ({ count = 6, filled = 0, isError = false }) => {

          {Array.from({ length: count }).map((_, idx) => (
            <div
              key={idx}
              className={`w-3.5 h-3.5 rounded-full transition-all duration-150 ${
                idx < filled
                  ? isError
                    ? 'bg-red-500 scale-110'
                    : 'bg-brand scale-110'
                  : 'bg-slate-200 dark:bg-slate-700'
              }`}
            />
          ))}
        </div>
      );

    const Keypad = ({ onKeyPress, onBackspace }) => {
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'back'];

      return (
        <div className="grid grid-cols-3 gap-3 w-full max-w-xs mx-auto mt-2">
          {keys.map((k, i) => {
            if (k === '') {
              return <div key={i} className="h-14" />;
            }
            if (k === 'back') {
              return (
                <button
                  key={i}
                  type="button"
                  onClick={onBackspace}
                  className="h-14 rounded-xl flex items-center justify-center text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 active:bg-slate-200 dark:active:bg-slate-700 transition-colors ios-keypad-btn"

            return (
              <button
                key={i}
                type="button"
                onClick={() => onKeyPress(k)}
                className="h-14 rounded-xl flex items-center justify-center text-xl font-semibold text-slate-800 dark:text-white bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 active:bg-slate-100 dark:active:bg-slate-600 transition-colors shadow-sm ios-keypad-btn"
              >
                {k}
              </button>
            );
          })}
        </div>
      );

    // Modal: Lupa PIN / Reset PIN Security Verification
    const ForgotPinModal = ({ storedUsername, storedName, onClose, onResetPin }) => {
      const [step, setStep] = useState(1); // 1: Verify Username, 2: Set New PIN
      const [inputUsername, setInputUsername] = useState('');
      const [verifyError, setVerifyError] = useState('');
      const [newPin, setNewPin] = useState('');
      const [confirmPin, setConfirmPin] = useState('');
      const [pinError, setPinError] = useState('');
      const [isClosing, setIsClosing] = useState(false);

      const handleClose = () => {
        setIsClosing(true);
        setTimeout(() => {
          setIsClosing(false);
          onClose();
        }, 200);
      };

      const handleVerifyUsername = (e) => {
        e.preventDefault();
        const trimmedInput = inputUsername.trim().toLowerCase().replace(/^@/, '');
        const targetUsername = (storedUsername || '').trim().toLowerCase();
        const targetName = (storedName || '').trim().toLowerCase();

        if (!trimmedInput) {
          setVerifyError('Harap masukkan username terdaftar');
          return;
        }

        // Verify against username (or fallback to name if username wasn't set in older data)
        const isMatch = targetUsername 
          ? (trimmedInput === targetUsername)
          : (trimmedInput === targetName);

        if (isMatch) {
          setVerifyError('');
          setStep(2);
        } else {
          setVerifyError('Username tidak cocok dengan brankas akun Voralet.');
        }
      };

      const handleSaveNewPin = (e) => {
        e.preventDefault();
        if (newPin.length !== 6 || !/^\d{6}$/.test(newPin)) {
          setPinError('PIN harus berupa 6 angka');
          return;
        }
        if (newPin !== confirmPin) {
          setPinError('Konfirmasi PIN tidak cocok');
          return;
        }
        onResetPin(newPin);
      };

      return (
        <div
          className={`fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4 ${
            isClosing ? 'animate-ios-backdrop-exit' : 'animate-ios-backdrop'
          }`}
          onClick={(e) => {
            if (e.target === e.currentTarget) handleClose();
          }}
        >
          <div
            className={`bg-white dark:bg-slate-800 rounded-2xl p-5 max-w-sm w-full shadow-xl border border-slate-200 dark:border-slate-700 ${
              isClosing ? 'animate-ios-pop-exit' : 'animate-ios-pop'
            }`}
          >
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-lg bg-brand-soft dark:bg-slate-700 text-brand flex items-center justify-center">
                  <Icon name="lock" className="w-4 h-4" />
                </div>
                <h3 className="text-sm font-bold text-slate-900 dark:text-white">
                  {step === 1 ? 'Verifikasi Lupa PIN' : 'Buat PIN Baru'}
                </h3>
              </div>
              <button
                type="button"
                onClick={handleClose}
                className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors ios-btn-tap"
                aria-label="Tutup"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>

            {step === 1 ? (
              <form onSubmit={handleVerifyUsername} className="space-y-4">
                <p className="text-xs text-slate-500 dark:text-slate-400">
                  Untuk keamanan offline, verifikasi <strong>Username (@id)</strong> brankas kamu. Data keuangan tetap aman dan tidak akan terhapus.
                </p>
                <div>
                  <label className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 block mb-1">
                    Username Akun (@id)
                  </label>
                  <div className="relative">
                    <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs font-mono font-bold">@</span>
                    <input
                      type="text"
                      value={inputUsername}
                      onChange={(e) => {
                        setInputUsername(e.target.value);
                        setVerifyError('');
                      }}
                      placeholder="username_kamu"
                      className="w-full pl-8 pr-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white text-xs font-mono focus:outline-none focus:border-brand"
                      autoFocus
                    />
                  </div>
                  {verifyError && (
                    <p className="text-[11px] text-rose-500 font-semibold mt-1">{verifyError}</p>
                  )}
                </div>
                <div className="flex gap-2 pt-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="flex-1 py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold rounded-xl hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors"
                  >
                    Batal
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2.5 bg-brand text-white text-xs font-semibold rounded-xl hover:bg-brand-hover transition-colors"
                  >
                    Verifikasi
                  </button>
                </div>
              </form>
            ) : (
              <form onSubmit={handleSaveNewPin} className="space-y-4">
                <p className="text-xs text-slate-500 dark:text-slate-400">
                  Identitas terverifikasi! Masukkan 6-digit PIN baru untuk brankas Voralet kamu.
                </p>
                <div>
                  <label className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 block mb-1">
                    6-Digit PIN Baru
                  </label>
                  <input
                    type="password"
                    maxLength={6}
                    inputMode="numeric"

    // Screen: Returning User PIN Keypad
    const ReturningUserPinScreen = ({ storedPin, userName, username, avatar, theme, onToggleTheme, onUnlock, onResetPin }) => {

        if (pin.length < 6) {
          const next = pin + digit;
          setPin(next);
          setError(false);

          if (next.length === 6) {
            if (next === storedPin) {
              setTimeout(() => {
                onUnlock();

              setError(true);
              setTimeout(() => {
                setPin('');

    // Screen: Onboarding Flow (Create PIN -> Confirm PIN -> Identity [Name & Username] -> First Wallet)

      const handleFinishOnboarding = (e) => {

          {step === 2 && (
            <>
              <div className="pt-8 text-center">

                  <Icon name="wallet" className="w-4 h-4" />
                  <span>Voralet</span>
                </div>
                <div className="w-12 h-12 rounded-xl bg-brand-soft dark:bg-slate-800 border border-brand-light dark:border-slate-700 flex items-center justify-center mx-auto mb-3 text-brand">
                  <Icon name="lock" className="w-6 h-6" />
                </div>
                <span className="text-[10px] font-bold uppercase tracking-wider text-brand bg-brand-light px-2.5 py-1 rounded-full">

                <PinDots count={6} filled={confirmPin.length} isError={error} />
                {error && (
                  <p className="text-xs font-semibold text-red-500">PIN tidak cocok. Silakan ulangi konfirmasi.</p>

                <button
                  type="button"
                  onClick={() => {
                    setNewPin('');
                    setConfirmPin('');

                  <span>Voralet</span>

                <div>
                  <span className="text-[10px] font-bold uppercase tracking-wider text-brand bg-brand-light px-2.5 py-1 rounded-full">

                  >

                </div>
              </form>
            </div>

        </div>
      );

    // =========================================================================
    // 5. TRANSACTION MODAL (ADD EXPENSE / INCOME)
    // =========================================================================
    const TransactionModal = ({ isOpen, onClose, initialType = 'EXPENSE', accounts, onAddTransaction }) => {
      const [type, setType] = useState(initialType);
      const [amountStr, setAmountStr] = useState('');
      const [accountId, setAccountId] = useState(accounts[0]?.id || '');
      const [category, setCategory] = useState(CATEGORIES[0].id);
      const [date, setDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [notes, setNotes] = useState('');
      const [error, setError] = useState('');
      const [isClosing, setIsClosing] = useState(false);

      const handleClose = () => {
        setIsClosing(true);
        setTimeout(() => {
          setIsClosing(false);
          onClose();
        }, 260);
      };

      useEffect(() => {
        setType(initialType);
        if (accounts.length > 0 && !accounts.some(a => a.id === accountId)) {
          setAccountId(accounts[0].id);
        }
      }, [initialType, accounts]);

      if (!isOpen) return null;

      const filteredCategories = CATEGORIES.filter(c => c.type === 'ALL' || c.type === type);

      const handleQuickAdd = (value) => {
        const current = parseRawNumber(amountStr);
        const next = current + value;
        setAmountStr(next.toString());
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const rawAmount = parseRawNumber(amountStr);
        if (rawAmount <= 0) {
          setError('Jumlah nominal harus lebih besar dari 0');
          return;
        }
        if (!accountId) {
          setError('Pilih dompet/akun tujuan terlebih dahulu');
          return;
        }

        const newTx = {
          id: 'tx_' + Date.now(),
          accountId,
          type,
          amount: rawAmount,
          category,
          date,
          notes: notes.trim(),
          createdAt: new Date().toISOString()
        };

        onAddTransaction(newTx);
        handleClose();
      };

      return (
        <div
          className={`fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/60 p-0 sm:p-4 ${
            isClosing ? 'animate-ios-backdrop-exit' : 'animate-ios-backdrop'
          }`}
          onClick={(e) => {
            if (e.target === e.currentTarget) handleClose();
          }}
        >
          <div
            className={`w-full max-w-md bg-white dark:bg-slate-800 rounded-t-2xl sm:rounded-2xl max-h-[92vh] flex flex-col shadow-xl border border-slate-200 dark:border-slate-700 overflow-hidden transition-colors ${
              isClosing ? 'animate-ios-sheet-exit' : 'animate-ios-sheet'
            }`}
          >
            {/* Modal Header with Crisp Vector Close Icon */}
            <div className="px-5 py-4 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between">
              <h2 className="text-base font-bold text-slate-900 dark:text-white">Catat Transaksi</h2>
              <button
                type="button"
                onClick={handleClose}
                className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors ios-btn-tap"
                aria-label="Tutup"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>

            {/* Scrollable Form Body */}
            <form onSubmit={handleSubmit} className="overflow-y-auto p-5 space-y-4 no-scrollbar">
              {/* Type Switcher */}

                      : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'

    // =========================================================================

      const [type, setType] = useState('Bank');

      const safeAccounts = Array.isArray(accounts) ? accounts.filter(Boolean) : [];
      const safeTransactions = Array.isArray(transactions) ? transactions.filter(Boolean) : [];

      useEffect(() => {
        if (!isOpen) {
          setIsAdding(false);
          setEditingAcc(null);
          setName('');
          setInitialBalance('');
          setType('Bank');
        }
      }, [isOpen]);

      if (!isOpen) return null;

      const handleSaveNew = (e) => {
        e.preventDefault();
        const trimmed = (name || '').trim();
        if (!trimmed) return;
        const bal = parseRawNumber(initialBalance);

        if (editingAcc && editingAcc.id) {
          if (typeof onEditAccount === 'function') {
            onEditAccount(editingAcc.id, {
              name: trimmed,
              type: type || 'Bank',
              initialBalance: bal

          setEditingAcc(null);
        } else {

            id: 'acc_' + Date.now(),
            name: trimmed,

        setInitialBalance('');
        setType('Bank');
        setIsAdding(false);

        setIsClosing(true);
        setTimeout(() => {
          setIsClosing(false);
          onClose();

        setEditingAcc(acc);
        setName(acc.name || '');

      return (
        <div
          className={`fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/60 p-0 sm:p-4 ${

            <div className="px-5 py-4 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between">

                <h2 className="text-base font-bold text-slate-900 dark:text-white">Kelola Dompet & Akun</h2>
                <p className="text-xs text-slate-500 dark:text-slate-400">Saldo dihitung otomatis dari deposit & mutasi</p>
              </div>
              <button
                type="button"
                onClick={handleClose}
                className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors ios-btn-tap"
                aria-label="Tutup"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>

                    <button

                        setEditingAcc(null);

                        setInitialBalance('');

                      className="px-3 py-1.5 bg-brand-light dark:bg-slate-700 text-brand dark:text-sky-300 text-xs font-semibold rounded-lg hover:bg-sky-100 dark:hover:bg-slate-600 transition-colors flex items-center gap-1"

                        return (
                          <div
                            key={acc.id}
                            className="p-3.5 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-between"
                          >
                            <div className="flex items-center gap-3">
                              <div className="w-9 h-9 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-brand">
                                <Icon
                                  name={acc.type === 'Bank' ? 'bank' : acc.type === 'Cash' ? 'cash' : 'smartphone'}

                              </div>
                              <div>
                                <h4 className="text-xs font-bold text-slate-900 dark:text-white leading-snug">{acc.name}</h4>
                                <span className="text-[11px] text-slate-500 dark:text-slate-400">{acc.type} • Saldo: {formatIDR(bal)}</span>
                              </div>

                            <div className="flex items-center gap-1">
                              <button
                                type="button"
                                onClick={() => startEdit(acc)}
                                className="p-1.5 text-slate-500 hover:text-brand hover:bg-brand-light dark:hover:bg-slate-700 rounded-lg transition-colors"
                                title="Edit Akun"
                              >
                                <Icon name="edit" className="w-4 h-4" />
                              </button>
                              <button
                                type="button"
                                onClick={() => onDeleteAccount && onDeleteAccount(acc.id)}
                                className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/50 rounded-lg transition-colors"
                                title="Hapus Akun"

                      <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-0.5">Buat akun pertama kamu untuk mulai mencatat.</p>
                    </div>
                  )}

              ) : (
                <form onSubmit={handleSaveNew} className="space-y-3 bg-slate-50 dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-xs font-bold text-slate-800 dark:text-white">
                      {editingAcc ? 'Edit Akun' : 'Tambah Akun Baru'}
                    </span>
                    <button
                      type="button"
                      onClick={() => {
                        setIsAdding(false);
                        setEditingAcc(null);
                      }}
                      className="text-xs text-slate-500 hover:underline"

                      Batal
                    </button>
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Nama Akun / Dompet</label>

                      type="text"

                      onChange={(e) => setName(e.target.value)}
                      placeholder="Contoh: Rekening BCA / Tabungan"
                      className="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg text-xs text-slate-900 dark:text-white focus:outline-none focus:border-brand"

                        const num = parseRawNumber(e.target.value);
                        setInitialBalance(num ? num.toString() : '');

                      placeholder="Rp 0"
                      className="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg text-xs font-semibold text-slate-900 dark:text-white focus:outline-none focus:border-brand"

                  <button
                    type="submit"
                    className="w-full py-2.5 bg-brand hover:bg-brand-hover text-white text-xs font-semibold rounded-lg transition-colors mt-2"

                    {editingAcc ? 'Perbarui Akun' : 'Simpan Akun Baru'}

            </div>
          </div>
        </div>
      );

    // =========================================================================
    // 7. SETTINGS & DATA CONTROL PANEL MODAL
    // =========================================================================
    const SettingsModal = ({
      isOpen,
      onClose,
      currentPin,
      userName,
      username,
      avatar,
      onUpdateProfile,
      onUpdateAvatar,
      theme,
      onToggleTheme,
      onUpdatePin,
      onExportData,
      onImportData,
      onResetAll
    }) => {
      const [isChangingPin, setIsChangingPin] = useState(false);
      const [oldPin, setOldPin] = useState('');
      const [newPin, setNewPin] = useState('');
      const [confirmNewPin, setConfirmNewPin] = useState('');
      const [pinMsg, setPinMsg] = useState({ text: '', isError: false });

      // Profile Edit State
      const [isEditingProfile, setIsEditingProfile] = useState(false);
      const [editName, setEditName] = useState(userName || '');
      const [editUsername, setEditUsername] = useState(username || '');
      const [profileMsg, setProfileMsg] = useState('');

      const [showResetConfirm, setShowResetConfirm] = useState(false);
      const [resetConfirmInput, setResetConfirmInput] = useState('');
      const fileInputRef = useRef(null);

      useEffect(() => {
        setEditName(userName || '');
        setEditUsername(username || '');
      }, [userName, username]);

      const [isClosing, setIsClosing] = useState(false);

      const handleClose = () => {
        setIsClosing(true);
        setTimeout(() => {
          setIsClosing(false);
          onClose();
        }, 260);
      };

      if (!isOpen) return null;

      const handleSaveProfile = (e) => {
        e.preventDefault();
        const trimmed = editName.trim();
        const cleanUser = editUsername.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
        if (!trimmed || !cleanUser) {
          setProfileMsg('Nama dan username tidak boleh kosong');
          return;
        }
        onUpdateProfile(trimmed, cleanUser);
        setProfileMsg('Profil berhasil disimpan');
        setTimeout(() => {
          setIsEditingProfile(false);
          setProfileMsg('');
        }, 800);
      };

      const handleChangePinSubmit = (e) => {
        e.preventDefault();
        if (oldPin !== currentPin) {
          setPinMsg({ text: 'PIN lama tidak sesuai', isError: true });
          return;
        }
        if (newPin.length !== 6) {
          setPinMsg({ text: 'PIN baru harus 6 digit angka', isError: true });
          return;
        }
        if (newPin !== confirmNewPin) {
          setPinMsg({ text: 'Konfirmasi PIN baru tidak cocok', isError: true });
          return;
        }
        onUpdatePin(newPin);
        setPinMsg({ text: 'PIN berhasil diperbarui!', isError: false });
        setTimeout(() => {
          setIsChangingPin(false);
          setOldPin('');
          setNewPin('');
          setConfirmNewPin('');
          setPinMsg({ text: '', isError: false });
        }, 1200);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (!parsed || !Array.isArray(parsed.accounts) || !Array.isArray(parsed.transactions)) {
              alert('Format file cadangan Voralet tidak valid.');
              return;
            }
            onImportData(parsed);
          } catch (err) {
            alert('Gagal membaca file backup: pastikan format JSON benar.');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div
          className={`fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/60 p-0 sm:p-4 ${
            isClosing ? 'animate-ios-backdrop-exit' : 'animate-ios-backdrop'
          }`}
          onClick={(e) => {
            if (e.target === e.currentTarget) handleClose();
          }}
        >
          <div
            className={`w-full max-w-md bg-white dark:bg-slate-800 rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col shadow-xl border border-slate-200 dark:border-slate-700 overflow-hidden transition-colors ${
              isClosing ? 'animate-ios-sheet-exit' : 'animate-ios-sheet'
            }`}
          >
            {/* Modal Header with Crisp Vector Close Icon */}
            <div className="px-5 py-4 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between">
              <div>
                <h2 className="text-base font-bold text-slate-900 dark:text-white">Pengaturan & Data</h2>
                <p className="text-xs text-slate-500 dark:text-slate-400">Privasi lokal & manajemen brankas Voralet</p>
              </div>
              <button
                type="button"
                onClick={handleClose}
                className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors ios-btn-tap"
                aria-label="Tutup"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>

            <div className="p-5 overflow-y-auto space-y-4 no-scrollbar">
              {/* Profile & Avatar Box */}
              <div className="p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl space-y-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="relative">
                      <Avatar avatar={avatar} name={userName} size="w-14 h-14" textSize="text-lg" />
                      <label
                        htmlFor="settings-avatar-upload"
                        className="absolute -bottom-1 -right-1 w-6 h-6 bg-brand text-white rounded-full flex items-center justify-center cursor-pointer shadow hover:bg-brand-hover transition-colors"
                        title="Ubah Foto Profil"
                      >
                        <Icon name="camera" className="w-3.5 h-3.5" />
                      </label>
                      <input

                        onChange={(e) => {

                      {avatar && (
                        <button

                          onClick={() => onUpdateAvatar('')}

                  <button

                {isEditingProfile && (

                        maxLength={30}

                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 dark:text-slate-400 mb-1">
                        Username Unik (@id)
                      </label>
                      <div className="relative">
                        <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 font-mono text-xs">@</span>
                        <input
                          type="text"
                          maxLength={20}
                          value={editUsername}
                          onChange={(e) => setEditUsername(e.target.value.toLowerCase().replace(/[^a-z0-9_]/g, ''))}

                    <div className="flex gap-2 pt-1">
                      <button

                        onClick={() => setIsEditingProfile(false)}

                      >
                        Batal

                      <button
                        type="submit"
                        className="flex-1 py-1.5 bg-brand text-white text-xs font-semibold rounded-lg hover:bg-brand-hover ios-btn-tap"
                      >
                        Simpan Identitas
                      </button>
                    </div>
                  </form>
                )}
              </div>

              {/* Appearance / Flat Dark Mode Toggle */}
              <div className="p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-amber-500 dark:text-sky-400">
                    <Icon name={theme === 'dark' ? 'moon' : 'sun'} className="w-4 h-4" />
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-slate-900 dark:text-white">Tema Tampilan</h4>

                      theme === 'light'

                    <Icon name="sun" className="w-3.5 h-3.5" />
                    <span>Terang</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => onToggleTheme('dark')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all ${
                      theme === 'dark'
                        ? 'bg-slate-700 text-sky-400 shadow-sm'
                        : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'

                  >
                    <Icon name="moon" className="w-3.5 h-3.5" />
                    <span>Gelap</span>
                  </button>
                </div>
              </div>

              {/* Security Status Box */}
              <div className="p-3.5 bg-brand-soft dark:bg-slate-900 border border-brand-light dark:border-slate-700 rounded-xl flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-brand-light dark:bg-slate-800 flex items-center justify-center text-brand dark:text-sky-400 shrink-0">
                  <Icon name="shield-check" className="w-5 h-5" />
                </div>
                <div>
                  <h4 className="text-xs font-bold text-slate-900 dark:text-white">Privasi Offline 100%</h4>
                  <p className="text-[11px] text-slate-500 dark:text-slate-400 leading-snug">
                    Data keuangan tersimpan aman di peramban ini tanpa dikirim ke server.
                  </p>
