              <button
                type="button"
                onClick={() => onOpenTransactionModal('EXPENSE')}
                className="py-3 px-4 bg-white border border-rose-200 hover:border-rose-400 active:bg-rose-50 text-rose-700 rounded-xl font-semibold text-xs flex items-center justify-center gap-2 shadow-sm transition-all"
              >
                <div className="w-5 h-5 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center">
                  <Icon name="arrow-up-right" className="w-3 h-3" />
                </div>
                <span>[-] Catat Pengeluaran</span>
              </button>

              <button
                type="button"
                onClick={() => onOpenTransactionModal('INCOME')}
                className="py-3 px-4 bg-brand hover:bg-brand-hover active:bg-brand-dark text-white rounded-xl font-semibold text-xs flex items-center justify-center gap-2 shadow-sm transition-all"
              >
                <div className="w-5 h-5 rounded-full bg-white/20 text-white flex items-center justify-center">
                  <Icon name="arrow-down-left" className="w-3 h-3" />
                </div>
                <span>[+] Catat Pemasukan</span>
              </button>
            </div>

            {/* Accounts Carousel / Grid (Blu Pocket Style) */}
            <div>
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-bold uppercase tracking-wider text-slate-500">
                  Kantong & Dompet ({accounts.length})
                </span>
                <button
                  type="button"
                  onClick={onOpenAccountsModal}
                  className="text-xs font-semibold text-brand hover:underline flex items-center gap-0.5"
                >
                  <Icon name="plus" className="w-3.5 h-3.5" />
                  <span>Kelola Akun</span>
                </button>
              </div>

              {accounts.length === 0 ? (
                <div className="p-4 bg-white border border-dashed border-slate-300 rounded-xl text-center">
                  <p className="text-xs font-medium text-slate-600">Belum ada akun, buat akun pertama kamu</p>
                  <button
                    type="button"
                    onClick={onOpenAccountsModal}
                    className="mt-2 text-xs font-semibold text-brand hover:underline"
                  >
                    + Tambah Akun
                  </button>
                </div>
              ) : (
                <div className="flex gap-2.5 overflow-x-auto pb-1 no-scrollbar">
                  {/* "Semua Akun" Pill */}
                  <button
                    type="button"
                    onClick={() => setSelectedAccountId(null)}
                    className={`min-w-[120px] p-3 rounded-xl border text-left flex flex-col justify-between transition-all shrink-0 ${
                      selectedAccountId === null
                        ? 'bg-brand text-white border-brand shadow-sm'
                        : 'bg-white border-slate-200 text-slate-700 hover:border-slate-300'
                    }`}
                  >
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] font-bold uppercase tracking-wider opacity-80">Semua</span>
                      <Icon name="wallet" className="w-4 h-4 opacity-80" />
                    </div>
                    <div>
                      <span className="text-xs font-bold block truncate">Total Dompet</span>
                      <span className="text-[11px] font-medium opacity-90">
                        {isBalanceHidden ? '••••••' : formatIDR(totalBalance)}
                      </span>
                    </div>
                  </button>

                  {/* Individual Wallet Pockets */}
                  {accounts.map(acc => {
                    const isSelected = selectedAccountId === acc.id;
                    const bal = Ledger.getAccountBalance(acc.id, accounts, transactions);
                    return (
                      <button
                        key={acc.id}
                        type="button"
                        onClick={() => setSelectedAccountId(isSelected ? null : acc.id)}
                        className={`min-w-[130px] p-3 rounded-xl border text-left flex flex-col justify-between transition-all shrink-0 ${
                          isSelected
                            ? 'bg-brand-soft border-brand text-brand-dark shadow-sm'
                            : 'bg-white border-slate-200 text-slate-700 hover:border-slate-300'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">
                            {acc.type}
                          </span>
                          <Icon
                            name={acc.type === 'Bank' ? 'bank' : acc.type === 'Cash' ? 'cash' : 'smartphone'}
                            className={`w-4 h-4 ${isSelected ? 'text-brand' : 'text-slate-400'}`}
                          />
                        </div>
                        <div>
                          <span className="text-xs font-bold text-slate-900 block truncate">{acc.name}</span>
                          <span className="text-[11px] font-semibold text-slate-600 block">
                            {isBalanceHidden ? '••••••' : formatIDR(bal)}
                          </span>
                        </div>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Recent Transactions Stream */}
            <div>
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-1.5">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-500">
                    Riwayat Transaksi
                  </span>
                  {selectedAccount && (
                    <span className="text-[10px] font-bold px-2 py-0.5 bg-brand-light text-brand rounded-full">
                      {selectedAccount.name}
                    </span>
                  )}
                </div>
                {selectedAccountId && (
                  <button
                    type="button"
                    onClick={() => setSelectedAccountId(null)}
                    className="text-xs text-slate-500 hover:underline"
                  >
                    Tampilkan Semua
                  </button>
                )}
              </div>

              {displayedTransactions.length === 0 ? (
                <div className="p-8 bg-white border border-slate-200 rounded-2xl text-center">
                  <div className="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center mx-auto mb-2 text-slate-400">
                    <Icon name="tag" className="w-6 h-6" />
                  </div>
                  <h3 className="text-xs font-bold text-slate-700">Belum ada transaksi</h3>
                  <p className="text-[11px] text-slate-400 mt-1 max-w-xs mx-auto">
                    {selectedAccount
                      ? `Belum ada mutasi untuk dompet ${selectedAccount.name}.`
                      : 'Mulai catat pengeluaran dan pemasukan harianmu di Voralet.'}
                  </p>
                  <button
                    type="button"
                    onClick={() => onOpenTransactionModal('EXPENSE')}
                    className="mt-3 px-3 py-1.5 bg-brand-light text-brand text-xs font-semibold rounded-lg hover:bg-sky-100 transition-colors"
                  >
                    Catat Transaksi Sekarang
                  </button>
                </div>
              ) : (
                <div className="space-y-2">
                  {displayedTransactions.map(tx => {
                    const catObj = CATEGORIES.find(c => c.id === tx.category) || {
                      label: tx.category || 'Lainnya',
                      icon: 'tag'
                    };
                    const accObj = accounts.find(a => a.id === tx.accountId);
                    const isIncome = tx.type === 'INCOME';

                    return (
                      <div
                        key={tx.id}
                        className="p-3.5 bg-white border border-slate-200 rounded-xl flex items-center justify-between shadow-sm hover:border-slate-300 transition-colors"
                      >
                        <div className="flex items-center gap-3">
                          <div
                            className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${
                              isIncome ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'
                            }`}
                          >
                            <Icon name={catObj.icon} className="w-4 h-4" />
                          </div>
                          <div>
                            <div className="flex items-center gap-2">
                              <h4 className="text-xs font-bold text-slate-900 leading-snug">{catObj.label}</h4>
                              {accObj && (
                                <span className="text-[10px] font-medium px-1.5 py-0.2 bg-slate-100 text-slate-600 rounded">
                                  {accObj.name}
                                </span>
                              )}
                            </div>
                            <div className="flex items-center gap-2 text-[11px] text-slate-400">
                              <span>{formatDateID(tx.date)}</span>
                              {tx.notes && <span>• {tx.notes}</span>}
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          <span
                            className={`text-xs font-bold text-right ${
                              isIncome ? 'text-emerald-600' : 'text-rose-600'
                            }`}
                          >
                            {isIncome ? '+' : '-'}{formatIDR(tx.amount)}
                          </span>
                          <button
                            type="button"
                            onClick={() => setDeleteTxConfirmId(tx.id)}
                            className="p-1 text-slate-300 hover:text-rose-500 rounded transition-colors"
                            title="Hapus Transaksi"
                          >
                            <Icon name="trash" className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </main>

          {/* Delete Transaction Confirmation Dialog with Crisp Close Icon */}
          {deleteTxConfirmId && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4">
              <div className="bg-white rounded-2xl p-5 max-w-xs w-full shadow-xl border border-slate-200">
                <div className="flex items-center justify-between mb-2">
                  <h3 className="text-sm font-bold text-slate-900">Hapus Transaksi?</h3>
                  <button
                    type="button"
                    onClick={() => setDeleteTxConfirmId(null)}
                    className="p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100 transition-colors"
                    aria-label="Tutup"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <line x1="18" y1="6" x2="6" y2="18"></line>
                      <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                  </button>
                </div>
                <p className="text-xs text-slate-500 mb-4">
                  Saldo akun akan disesuaikan kembali secara otomatis setelah transaksi dihapus.
                </p>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setDeleteTxConfirmId(null)}
                    className="flex-1 py-2 bg-slate-100 text-slate-700 text-xs font-semibold rounded-lg hover:bg-slate-200"
                  >
                    Batal
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      onDeleteTransaction(deleteTxConfirmId);
                      setDeleteTxConfirmId(null);
                    }}
                    className="flex-1 py-2 bg-rose-600 text-white text-xs font-semibold rounded-lg hover:bg-rose-700"
                  >
                    Hapus
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // 9. ROOT APPLICATION COMPONENT
    // =========================================================================
    function App() {
      // Local state from storage (ZERO DEFAULT MOCK DATA)
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [storedPin, setStoredPin] = useState(() => StorageService.getPin());
      const [userName, setUserName] = useState(() => StorageService.getName());
      const [accounts, setAccounts] = useState(() => StorageService.getAccounts());
      const [transactions, setTransactions] = useState(() => StorageService.getTransactions());
      const [isBalanceHidden, setIsBalanceHidden] = useState(() => StorageService.getHideBalance());

      // Modals State
      const [isTxModalOpen, setIsTxModalOpen] = useState(false);
      const [txModalType, setTxModalType] = useState('EXPENSE');
      const [isAccountsModalOpen, setIsAccountsModalOpen] = useState(false);
      const [isSettingsModalOpen, setIsSettingsModalOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const showToast = useCallback((msg) => {
        setToastMsg(msg);
      }, []);

      // Handler for Onboarding Completion
      const handleOnboardingComplete = (data) => {
        setStoredPin(data.pin);
        setUserName(data.name);
        setAccounts(data.accounts);
        setTransactions(data.transactions);
        setIsUnlocked(true);
        showToast('Akun Voralet berhasil disiapkan!');
      };

      // Handler for Transaction Creation (Atomic state update)
      const handleAddTransaction = (newTx) => {
        const nextList = [newTx, ...transactions];
        setTransactions(nextList);
        StorageService.setTransactions(nextList);
        showToast(newTx.type === 'INCOME' ? 'Pemasukan dicatat!' : 'Pengeluaran dicatat!');
      };

      // Handler for Transaction Deletion
      const handleDeleteTransaction = (txId) => {
        const nextList = transactions.filter(t => t.id !== txId);
        setTransactions(nextList);
        StorageService.setTransactions(nextList);
        showToast('Transaksi telah dihapus');
      };

      // Handler for Account Creation
      const handleAddAccount = (newAcc) => {
        const nextList = [...accounts, newAcc];
        setAccounts(nextList);
        StorageService.setAccounts(nextList);
        showToast('Akun baru ditambahkan');
      };

      // Handler for Account Edit
      const handleEditAccount = (accId, updatedData) => {
        const nextList = accounts.map(a => (a.id === accId ? { ...a, ...updatedData } : a));
        setAccounts(nextList);
        StorageService.setAccounts(nextList);
        showToast('Akun diperbarui');
      };

      // Handler for Account Deletion
      const handleDeleteAccount = (accId) => {
        if (accounts.length <= 1) {
          showToast('Minimal harus ada 1 akun aktif');
          return;
        }
        const hasTx = transactions.some(t => t.accountId === accId);
        if (hasTx) {
          const confirmDel = window.confirm(
            'Akun ini memiliki mutasi transaksi. Menghapus akun akan menghapus seluruh mutasinya juga. Lanjutkan?'
          );
          if (!confirmDel) return;
        }
        const nextAccounts = accounts.filter(a => a.id !== accId);
        const nextTransactions = transactions.filter(t => t.accountId !== accId);

        setAccounts(nextAccounts);
        setTransactions(nextTransactions);
        StorageService.setAccounts(nextAccounts);
        StorageService.setTransactions(nextTransactions);
        showToast('Akun berhasil dihapus');
      };

      // Handler for PIN Update
      const handleUpdatePin = (newPin) => {
        StorageService.setPin(newPin);
        setStoredPin(newPin);
        showToast('PIN keamanan diperbarui');
      };

      // Handler for Hide/Show Balance Toggle
      const handleToggleHideBalance = () => {
        const next = !isBalanceHidden;
        setIsBalanceHidden(next);
        StorageService.setHideBalance(next);
      };

      // Handler for JSON Export
      const handleExportData = () => {
        try {
          const exportPayload = {
            appName: 'Voralet',
            version: '1.0.0',
            exportedAt: new Date().toISOString(),
            user: {
              name: userName
            },
            accounts,
            transactions
          };
          const blob = new Blob([JSON.stringify(exportPayload, null, 2)], {
            type: 'application/json'
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `voralet_backup_${new Date().toISOString().split('T')[0]}.json`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
          showToast('File voralet_backup.json berhasil diunduh');
        } catch (e) {
          console.error(e);
          showToast('Gagal mengekspor data');
        }
      };

      // Handler for JSON Import
      const handleImportData = (parsedPayload) => {
        try {
          if (!Array.isArray(parsedPayload.accounts) || !Array.isArray(parsedPayload.transactions)) {
            throw new Error('Struktur file tidak valid');
          }
          const importedAccounts = parsedPayload.accounts;
          const importedTransactions = parsedPayload.transactions;
          const importedName = parsedPayload.user?.name || userName || 'Teman Voralet';

          setAccounts(importedAccounts);
          setTransactions(importedTransactions);
          setUserName(importedName);

          StorageService.setAccounts(importedAccounts);
          StorageService.setTransactions(importedTransactions);
          StorageService.setName(importedName);

          setIsSettingsModalOpen(false);
          showToast('Data cadangan berhasil dipulihkan!');
        } catch (err) {
          alert('Gagal memulihkan cadangan: ' + err.message);
        }
      };

      // Handler for Reset All
      const handleResetAll = () => {
        StorageService.clearAll();
        setStoredPin(null);
        setUserName('');
        setAccounts([]);
        setTransactions([]);
        setIsUnlocked(false);
        setIsSettingsModalOpen(false);
        showToast('Seluruh data Voralet telah dibersihkan');
      };

      // FLOW A: Fresh User Onboarding
      if (!storedPin) {
        return (
          <>
            {toastMsg && <Toast message={toastMsg} onClose={() => setToastMsg('')} />}
            <OnboardingFlow onComplete={handleOnboardingComplete} />
          </>
        );
      }

      // FLOW B: Returning User PIN Keypad Screen
      if (!isUnlocked) {
        return (
          <>
            {toastMsg && <Toast message={toastMsg} onClose={() => setToastMsg('')} />}
            <ReturningUserPinScreen
              storedPin={storedPin}
              userName={userName}
              onUnlock={() => setIsUnlocked(true)}
            />
          </>
        );
      }

      // UNLOCKED: Main Dashboard
      return (
        <>
          {toastMsg && <Toast message={toastMsg} onClose={() => setToastMsg('')} />}

          <MainDashboard
            userName={userName}
            accounts={accounts}
            transactions={transactions}
            isBalanceHidden={isBalanceHidden}
            onToggleHideBalance={handleToggleHideBalance}
            onOpenTransactionModal={(type) => {
              setTxModalType(type);
              setIsTxModalOpen(true);
            }}
            onOpenAccountsModal={() => setIsAccountsModalOpen(true)}
            onOpenSettingsModal={() => setIsSettingsModalOpen(true)}
            onLockApp={() => setIsUnlocked(false)}
            onDeleteTransaction={handleDeleteTransaction}
          />

          {/* Transaction Modal (Add Expense / Income) with Crisp X Icon */}
          <TransactionModal
            isOpen={isTxModalOpen}
            onClose={() => setIsTxModalOpen(false)}
            initialType={txModalType}
            accounts={accounts}
            onAddTransaction={handleAddTransaction}
          />

          {/* Accounts & Wallets Manager Modal with Crisp X Icon */}
          <AccountsManagerModal
            isOpen={isAccountsModalOpen}
            onClose={() => setIsAccountsModalOpen(false)}
            accounts={accounts}
            transactions={transactions}
            onAddAccount={handleAddAccount}
            onDeleteAccount={handleDeleteAccount}
            onEditAccount={handleEditAccount}
          />

          {/* Settings & Data Control Panel Modal with Crisp X Icon */}
          <SettingsModal
            isOpen={isSettingsModalOpen}
            onClose={() => setIsSettingsModalOpen(false)}
            currentPin={storedPin}
            userName={userName}
            onUpdatePin={handleUpdatePin}
            onExportData={handleExportData}
            onImportData={handleImportData}
            onResetAll={handleResetAll}
          />
        </>
      );
    }

    // Render Root Application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
