              {/* PIN Settings Accordion */}
              <div className="border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden">
                <button
                  type="button"
                  onClick={() => setIsChangingPin(!isChangingPin)}
                  className="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-between text-left transition-colors"
                >
                  <div className="flex items-center gap-2 text-xs font-bold text-slate-800 dark:text-white">
                    <Icon name="lock" className="w-4 h-4 text-slate-500" />
                    <span>Ganti 6-Digit PIN</span>
                  </div>
                  <span className="text-xs text-brand dark:text-sky-400 font-semibold">
                    {isChangingPin ? 'Tutup' : 'Ubah'}
                  </span>
                </button>

                {isChangingPin && (
                  <form onSubmit={handleChangePinSubmit} className="p-4 space-y-3 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700">
                    {pinMsg.text && (
                      <p className={`text-xs font-semibold ${pinMsg.isError ? 'text-red-500' : 'text-emerald-600 dark:text-emerald-400'}`}>
                        {pinMsg.text}
                      </p>
                    )}
                    <div>
                      <label className="block text-[11px] font-medium text-slate-600 dark:text-slate-300 mb-1">PIN Saat Ini (6 Angka)</label>
                      <input
                        type="password"
                        maxLength={6}
                        inputMode="numeric"
                        required
                        value={oldPin}
                        onChange={(e) => setOldPin(e.target.value.replace(/\D/g, ''))}
                        className="w-full px-3 py-1.5 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white"
                        placeholder="••••••"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-medium text-slate-600 dark:text-slate-300 mb-1">PIN Baru (6 Angka)</label>
                      <input
                        type="password"
                        maxLength={6}
                        inputMode="numeric"
                        required
                        value={newPin}
                        onChange={(e) => setNewPin(e.target.value.replace(/\D/g, ''))}
                        className="w-full px-3 py-1.5 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white"
                        placeholder="••••••"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-medium text-slate-600 dark:text-slate-300 mb-1">Ulangi PIN Baru</label>
                      <input
                        type="password"
                        maxLength={6}
                        inputMode="numeric"
                        required
                        value={confirmNewPin}
                        onChange={(e) => setConfirmNewPin(e.target.value.replace(/\D/g, ''))}
                        className="w-full px-3 py-1.5 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white"
                        placeholder="••••••"
                      />
                    </div>
                    <button
                      type="submit"
                      className="w-full py-2 bg-brand hover:bg-brand-hover text-white font-semibold text-xs rounded-lg"
                    >
                      Perbarui PIN
                    </button>
                  </form>
                )}
              </div>

              {/* Data Export / Import Actions */}
              <div className="space-y-2 pt-1">
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 block">
                  Cadangan & Pulihkan
                </span>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={onExportData}
                    className="p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 flex flex-col items-center gap-1 text-slate-700 dark:text-slate-300 transition-colors"
                  >
                    <Icon name="download" className="w-5 h-5 text-brand dark:text-sky-400" />
                    <span className="text-xs font-semibold">Ekspor JSON</span>
                    <span className="text-[10px] text-slate-400">voralet_backup.json</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => fileInputRef.current?.click()}
                    className="p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 flex flex-col items-center gap-1 text-slate-700 dark:text-slate-300 transition-colors"
                  >
                    <Icon name="upload" className="w-5 h-5 text-emerald-600 dark:text-emerald-400" />
                    <span className="text-xs font-semibold">Impor JSON</span>
                    <span className="text-[10px] text-slate-400">Pulihkan Cadangan</span>
                  </button>
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept=".json"
                    className="hidden"
                    onChange={handleFileUpload}
                  />
                </div>
              </div>

              {/* Hard Reset Local Data */}
              <div className="pt-2 border-t border-slate-100 dark:border-slate-700">
                {!showResetConfirm ? (
                  <button
                    type="button"
                    onClick={() => setShowResetConfirm(true)}
                    className="w-full py-2.5 px-3 rounded-xl border border-rose-200 dark:border-rose-900/50 text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors"
                  >
                    <Icon name="trash" className="w-4 h-4" />
                    <span>Reset Seluruh Data Aplikasi</span>
                  </button>
                ) : (
                  <div className="p-3.5 bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900/50 rounded-xl space-y-2.5">
                    <p className="text-xs font-bold text-rose-800 dark:text-rose-300">Konfirmasi Hapus Data</p>
                    <p className="text-[11px] text-rose-600 dark:text-rose-400">
                      Tindakan ini akan menghapus PIN, nama pengguna, seluruh dompet, dan mutasi. Ketik <span className="font-bold">RESET</span> di bawah untuk melanjutkan:
                    </p>
                    <input
                      type="text"
                      value={resetConfirmInput}
                      onChange={(e) => setResetConfirmInput(e.target.value)}
                      placeholder="Ketik RESET"
                      className="w-full px-3 py-1.5 text-xs bg-white dark:bg-slate-900 border border-rose-300 dark:border-rose-700 rounded-lg text-slate-900 dark:text-white focus:outline-none"
                    />
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => {
                          setShowResetConfirm(false);
                          setResetConfirmInput('');
                        }}
                        className="flex-1 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 rounded-lg text-xs font-medium"
                      >
                        Batal
                      </button>
                      <button
                        type="button"
                        disabled={resetConfirmInput.trim() !== 'RESET'}
                        onClick={() => {
                          onResetAll();
                          setShowResetConfirm(false);
                        }}
                        className="flex-1 py-1.5 bg-rose-600 disabled:bg-rose-300 text-white rounded-lg text-xs font-semibold"
                      >
                        Hapus Semua
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // 7B. SAVINGS GOAL MODAL (ADD / DEPOSIT / WITHDRAW / EDIT)
    // =========================================================================
    const SavingsGoalModal = ({ isOpen, onClose, accounts, editingGoal, onSaveGoal, onAdjustGoal }) => {
      const [name, setName] = useState('');
      const [targetAmount, setTargetAmount] = useState('');
      const [targetDate, setTargetDate] = useState('');
      const [error, setError] = useState('');

      const [adjustMode, setAdjustMode] = useState(null); // 'DEPOSIT' | 'WITHDRAW' | null
      const [adjustAmount, setAdjustAmount] = useState('');
      const [adjustAccountId, setAdjustAccountId] = useState('');
      const [isClosing, setIsClosing] = useState(false);
      const modalContentRef = useRef(null);

      const safeAccounts = Array.isArray(accounts) ? accounts.filter(Boolean) : [];

      const handleClose = () => {
        setIsClosing(true);
        setTimeout(() => {
          setIsClosing(false);
          onClose();
        }, 260);
      };

      const handleInputFocus = (e) => {
        const target = e.target;
        setTimeout(() => {
          if (target && modalContentRef.current) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 150);
      };

      useEffect(() => {
        if (editingGoal) {
          setName(editingGoal.name || '');
          setTargetAmount(editingGoal.targetAmount ? editingGoal.targetAmount.toString() : '');
          setTargetDate(editingGoal.targetDate || '');
        } else {
          setName('');
          setTargetAmount('');
          setTargetDate('');
        }
        setAdjustMode(null);
        setAdjustAmount('');
        setError('');
        if (safeAccounts.length > 0) {
          setAdjustAccountId(safeAccounts[0].id);
        }
      }, [editingGoal, isOpen, accounts]);

      if (!isOpen) return null;

      const handleSaveGoal = (e) => {
        e.preventDefault();
        const trimmed = name.trim();
        const target = parseRawNumber(targetAmount);
        if (!trimmed) {
          setError('Nama impian wajib diisi');
          return;
        }
        if (target <= 0) {
          setError('Target nominal harus lebih dari 0');
          return;
        }

        onSaveGoal({
          id: editingGoal ? editingGoal.id : 'goal_' + Date.now(),
          name: trimmed,
          targetAmount: target,
          savedAmount: editingGoal ? editingGoal.savedAmount : 0,
          targetDate: targetDate || null,
          createdAt: editingGoal ? editingGoal.createdAt : new Date().toISOString()
        });
        handleClose();
      };

      const handleExecuteAdjust = (e) => {
        e.preventDefault();
        const amount = parseRawNumber(adjustAmount);
        if (amount <= 0) {
          setError('Nominal harus lebih dari 0');
          return;
        }
        if (!adjustAccountId) {
          setError('Pilih sumber dompet');
          return;
        }

        onAdjustGoal(editingGoal.id, adjustMode, amount, adjustAccountId);
        handleClose();
      };

      return (
        <div
          className={`fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/60 p-0 sm:p-4 ${
            isClosing ? 'animate-ios-backdrop-exit' : 'animate-ios-backdrop'
          }`}
          onClick={(e) => {
            if (e.target === e.currentTarget) handleClose();
          }}
        >
          <div
            ref={modalContentRef}
            className={`w-full max-w-md bg-white dark:bg-slate-800 rounded-t-2xl sm:rounded-2xl p-5 max-h-[85dvh] overflow-y-auto pb-28 no-scrollbar shadow-xl border border-slate-200 dark:border-slate-700 transition-colors ${
              isClosing ? 'animate-ios-sheet-exit' : 'animate-ios-sheet'
            }`}
          >
            <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700 mb-4">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-lg bg-brand-light dark:bg-slate-700 text-brand dark:text-sky-300 flex items-center justify-center">
                  <Icon name="target" className="w-4 h-4" />
                </div>
                <div>
                  <h3 className="text-sm font-bold text-slate-900 dark:text-white">
                    {adjustMode
                      ? (adjustMode === 'DEPOSIT' ? 'Nabung ke Impian' : 'Tarik dari Impian')
                      : (editingGoal ? 'Edit Target Impian' : 'Buat Kantong Impian')}
                  </h3>
                  <p className="text-[11px] text-slate-500 dark:text-slate-400">
                    {adjustMode ? editingGoal?.name : 'Alokasikan simpanan untuk tujuan masa depan'}
                  </p>
                </div>
              </div>
              <button
                type="button"
                onClick={handleClose}
                className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors ios-btn-tap"
                aria-label="Tutup"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>

            {error && (
              <p className="text-xs font-semibold text-rose-500 mb-3 bg-rose-50 dark:bg-rose-950/40 p-2 rounded-lg border border-rose-200 dark:border-rose-900/50">
                {error}
              </p>
            )}

            {editingGoal && !adjustMode ? (
              <div className="space-y-4">
                <div className="p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl">
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-xs font-bold text-slate-900 dark:text-white">{editingGoal.name}</span>
                    <span className="text-xs font-mono font-bold text-brand dark:text-sky-400">
                      {Math.min(100, Math.round((editingGoal.savedAmount / editingGoal.targetAmount) * 100))}%
                    </span>
                  </div>
                  <div className="text-[11px] text-slate-500 dark:text-slate-400 flex justify-between">
                    <span>Terkumpul: {formatIDR(editingGoal.savedAmount)}</span>
                    <span>Target: {formatIDR(editingGoal.targetAmount)}</span>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      setAdjustMode('DEPOSIT');
                      setError('');
                    }}
                    className="py-2.5 bg-brand hover:bg-brand-hover text-white text-xs font-semibold rounded-xl flex items-center justify-center gap-1.5 ios-btn-tap"
                  >
                    <Icon name="arrow-up" className="w-3.5 h-3.5" />
                    <span>+ Tambah Tabungan</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setAdjustMode('WITHDRAW');
                      setError('');
                    }}
                    className="py-2.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-200 text-xs font-semibold rounded-xl flex items-center justify-center gap-1.5 ios-btn-tap"
                  >
                    <Icon name="arrow-down" className="w-3.5 h-3.5" />
                    <span>- Tarik Tabungan</span>
                  </button>
                </div>

                <form onSubmit={handleSaveGoal} className="pt-3 border-t border-slate-100 dark:border-slate-700 space-y-3">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400 block">Edit Parameter Target</span>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Nama Impian</label>
                    <input
                      type="text"
                      value={name}
                      onFocus={handleInputFocus}
                      onChange={(e) => setName(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-xs text-slate-900 dark:text-white focus:outline-none focus:border-brand"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Target Nominal (Rp)</label>
                    <input
                      type="text"
                      inputMode="numeric"
                      onFocus={handleInputFocus}
                      value={targetAmount ? formatIDR(parseRawNumber(targetAmount)) : ''}
                      onChange={(e) => setTargetAmount(parseRawNumber(e.target.value).toString())}
                      className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-xs font-semibold text-slate-900 dark:text-white focus:outline-none focus:border-brand"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Target Tanggal (Opsional)</label>
                    <input
                      type="date"
                      value={targetDate}
                      onFocus={handleInputFocus}
                      onChange={(e) => setTargetDate(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-xs text-slate-900 dark:text-white focus:outline-none focus:border-brand"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full py-2 bg-slate-800 hover:bg-slate-900 text-white dark:bg-slate-700 dark:hover:bg-slate-600 text-xs font-semibold rounded-xl transition-colors ios-btn-tap"
                  >
                    Simpan Perubahan
                  </button>
                </form>
              </div>
            ) : adjustMode ? (
              <form onSubmit={handleExecuteAdjust} className="space-y-3">
                <p className="text-xs text-slate-500 dark:text-slate-400">
                  {adjustMode === 'DEPOSIT'
                    ? 'Saldo akan dipindahkan dari dompet pilihan ke kantong impian ini.'
                    : 'Dana tabungan impian akan dicairkan kembali ke dompet pilihan.'}
                </p>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    {adjustMode === 'DEPOSIT' ? 'Dari Dompet' : 'Cairkan Ke Dompet'}
                  </label>
                  <select
                    value={adjustAccountId}
                    onFocus={handleInputFocus}
                    onChange={(e) => setAdjustAccountId(e.target.value)}
                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-xs text-slate-900 dark:text-white focus:outline-none focus:border-brand"
                  >
                    {safeAccounts.map(acc => (
                      <option key={acc.id} value={acc.id}>
                        {acc.name} ({acc.type})
                      </option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Nominal {adjustMode === 'DEPOSIT' ? 'Setor (Rp)' : 'Tarik (Rp)'}
                  </label>
                  <input
                    type="text"
                    inputMode="numeric"
                    autoFocus
                    onFocus={handleInputFocus}
                    placeholder="Rp 0"
                    value={adjustAmount ? formatIDR(parseRawNumber(adjustAmount)) : ''}
                    onChange={(e) => setAdjustAmount(parseRawNumber(e.target.value).toString())}
                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-bold text-slate-900 dark:text-white focus:outline-none focus:border-brand"
                  />
                </div>

                <div className="flex gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setAdjustMode(null)}
                    className="flex-1 py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold rounded-xl"
                  >
                    Kembali
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2.5 bg-brand hover:bg-brand-hover text-white text-xs font-semibold rounded-xl shadow-sm ios-btn-tap"
                  >
                    Konfirmasi {adjustMode === 'DEPOSIT' ? 'Setor' : 'Tarik'}
                  </button>
                </div>
              </form>
            ) : (
              // Create New Goal Form
              <form onSubmit={handleSaveGoal} className="space-y-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Nama Kantong Impian
                  </label>
                  <input
                    type="text"
                    placeholder="Contoh: Beli Laptop Baru / Dana Darurat"
                    value={name}
                    onFocus={handleInputFocus}
                    onChange={(e) => setName(e.target.value)}
                    autoFocus
                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-xs text-slate-900 dark:text-white focus:outline-none focus:border-brand"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Target Nominal (Rp)
                  </label>
                  <input
                    type="text"
                    inputMode="numeric"
                    placeholder="Rp 0"
                    onFocus={handleInputFocus}
                    value={targetAmount ? formatIDR(parseRawNumber(targetAmount)) : ''}
                    onChange={(e) => setTargetAmount(parseRawNumber(e.target.value).toString())}
                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-semibold text-slate-900 dark:text-white focus:outline-none focus:border-brand"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Target Tanggal (Opsional)
                  </label>
                  <input
                    type="date"
                    value={targetDate}
                    onFocus={handleInputFocus}
                    onChange={(e) => setTargetDate(e.target.value)}
                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-xs text-slate-900 dark:text-white focus:outline-none focus:border-brand"
                  />
                </div>

                <div className="pt-2">
                  <button
                    type="submit"
                    className="w-full py-3 bg-brand hover:bg-brand-hover text-white text-xs font-semibold rounded-xl transition-colors shadow-sm ios-btn-tap"
                  >
                    Buat Kantong Impian
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    };

    // =========================================================================
    // 7C. SAVINGS GOALS VIEW COMPONENT (KANTONG IMPIAN)
    // =========================================================================
    const SavingsGoalsView = ({ goals, accounts, isBalanceHidden, onOpenAddGoal, onSelectGoal, onDeleteGoal }) => {
      const totalSaved = useMemo(() => {
        return (goals || []).reduce((sum, g) => sum + (g.savedAmount || 0), 0);
      }, [goals]);

      const totalTarget = useMemo(() => {
        return (goals || []).reduce((sum, g) => sum + (g.targetAmount || 0), 0);
      }, [goals]);

      return (
        <div className="space-y-4">
          {/* Header Card for Savings */}
          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
            <div className="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 mb-1">
              <span className="font-semibold text-slate-700 dark:text-slate-300">Total Terkumpul di Impian</span>
              <span className="text-[10px] bg-brand-light dark:bg-slate-800 text-brand dark:text-sky-300 font-bold px-2 py-0.5 rounded-full">
                {(goals || []).length} Kantong
              </span>
            </div>
            <div className="py-1">
              <span className="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">
                {isBalanceHidden ? 'Rp ••••••••' : formatIDR(totalSaved)}
              </span>
            </div>
            <div className="mt-2 text-xs text-slate-400 dark:text-slate-500 flex justify-between items-center">
              <span>Dari total target: {isBalanceHidden ? '••••••' : formatIDR(totalTarget)}</span>
              <span className="font-bold text-brand dark:text-sky-400">
                {totalTarget > 0 ? Math.min(100, Math.round((totalSaved / totalTarget) * 100)) : 0}%
              </span>
            </div>
          </div>

          <div className="flex items-center justify-between">
            <span className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
              Daftar Target Impian
            </span>
            <button
              type="button"
              onClick={onOpenAddGoal}
              className="text-xs font-semibold text-brand dark:text-sky-400 hover:underline flex items-center gap-1 ios-btn-tap"
            >
              <Icon name="plus" className="w-3.5 h-3.5" />
              <span>Tambah Impian</span>
            </button>
          </div>

          {(!goals || goals.length === 0) ? (
            <div className="p-8 bg-white dark:bg-slate-900 border border-dashed border-slate-200 dark:border-slate-800 rounded-2xl text-center">
              <div className="w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center mx-auto mb-2 text-slate-400">
                <Icon name="target" className="w-6 h-6" />
              </div>
              <h3 className="text-xs font-bold text-slate-700 dark:text-slate-300">Belum ada Kantong Impian</h3>
              <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1 max-w-xs mx-auto">
                Mulai sisihkan tabungan untuk rencana masa depan seperti liburan, gawai baru, atau dana darurat.
              </p>
              <button
                type="button"
                onClick={onOpenAddGoal}
                className="mt-3 px-3 py-1.5 bg-brand-light dark:bg-slate-800 text-brand dark:text-sky-300 text-xs font-semibold rounded-lg hover:bg-sky-100 dark:hover:bg-slate-700 transition-colors ios-btn-tap"
              >
                + Buat Target Sekarang
              </button>
            </div>
          ) : (
            <div className="space-y-2.5">
              {goals.map(goal => {
                const percent = Math.min(100, Math.round(((goal.savedAmount || 0) / (goal.targetAmount || 1)) * 100));
                const remaining = Math.max(0, (goal.targetAmount || 0) - (goal.savedAmount || 0));

                return (
                  <div
                    key={goal.id}
                    className="p-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm hover:border-slate-300 dark:hover:border-slate-700 transition-colors ios-card-tap"
                  >
                    <div className="flex items-start justify-between mb-2">
                      <div className="flex items-center gap-2.5">
                        <div className="w-9 h-9 rounded-xl bg-sky-50 dark:bg-sky-950/50 text-brand dark:text-sky-400 flex items-center justify-center shrink-0">
                          <Icon name="target" className="w-4 h-4" />
                        </div>
                        <div>
                          <h4 className="text-xs font-bold text-slate-900 dark:text-white leading-snug">{goal.name}</h4>
                          {goal.targetDate && (
                            <span className="text-[10px] text-slate-400 dark:text-slate-500">
                              Target: {formatDateID(goal.targetDate)}
                            </span>
                          )}
                        </div>
                      </div>

                      <div className="flex items-center gap-1">
                        <button
                          type="button"
                          onClick={() => onSelectGoal(goal)}
                          className="px-2.5 py-1 bg-brand-light dark:bg-slate-800 text-brand dark:text-sky-300 text-[11px] font-bold rounded-lg hover:bg-sky-100 transition-colors ios-btn-tap"
                        >
                          Kelola
                        </button>
                        <button
                          type="button"
                          onClick={() => onDeleteGoal(goal.id)}
                          className="p-1.5 text-slate-300 hover:text-rose-500 dark:text-slate-600 dark:hover:text-rose-400 rounded transition-colors ios-btn-tap"
                          title="Hapus Impian"
                        >
                          <Icon name="trash" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </div>

                    {/* Progress Bar (Flat Minimalist) */}
                    <div className="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden my-2">
                      <div
                        className="bg-brand dark:bg-sky-400 h-full rounded-full transition-all duration-300"
                        style={{ width: `${percent}%` }}
                      />
                    </div>

                    <div className="flex justify-between items-center text-xs">
                      <div>
                        <span className="text-slate-400 text-[10px] block leading-none">Terkumpul</span>
                        <span className="font-bold text-slate-900 dark:text-white">
                          {isBalanceHidden ? '••••••' : formatIDR(goal.savedAmount || 0)}
                        </span>
                      </div>
                      <div className="text-right">
                        <span className="text-slate-400 text-[10px] block leading-none">
                          {percent >= 100 ? 'Target Terpenuhi!' : `Sisa ${isBalanceHidden ? '••••••' : formatIDR(remaining)}`}
                        </span>
                        <span className="font-bold text-brand dark:text-sky-400">{percent}%</span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // 7D. DETAILED ANALYTICS VIEW COMPONENT (INTERACTIVE SVG LINE CHART)
    // =========================================================================
    const AnalyticsView = ({ transactions, accounts }) => {
      const [period, setPeriod] = useState('MONTHLY'); // 'MONTHLY' | 'YEARLY'

      const currentYear = new Date().getFullYear();
      const currentMonth = new Date().getMonth(); // 0 - 11

      const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

      const stats = useMemo(() => {
        let income = 0;
        let expense = 0;
        const catMap = {};
        const safeTx = Array.isArray(transactions) ? transactions.filter(Boolean) : [];

        safeTx.forEach(tx => {
          const d = new Date(tx.date);
          const txYear = d.getFullYear();
          const txMonth = d.getMonth();

          const match = period === 'MONTHLY'
            ? (txYear === currentYear && txMonth === currentMonth)
            : (txYear === currentYear);

          if (match) {
            const amt = Number(tx.amount) || 0;
            if (tx.type === 'INCOME') {
              income += amt;
            } else {
              expense += amt;
              catMap[tx.category] = (catMap[tx.category] || 0) + amt;
            }
          }
        });

        // Top categories sorted descending
        const topCategories = Object.keys(catMap).map(catId => {
          const catObj = CATEGORIES.find(c => c.id === catId) || { label: catId, icon: 'tag' };
          return {
            id: catId,
            label: catObj.label,
            icon: catObj.icon,
            amount: catMap[catId],
            percent: expense > 0 ? Math.round((catMap[catId] / expense) * 100) : 0
          };
        }).sort((a, b) => b.amount - a.amount);

        return {
          income,
          expense,
          net: income - expense,
          topCategories
        };
      }, [transactions, period, currentYear, currentMonth]);

      // Interval data points for SVG line chart
      const trendData = useMemo(() => {
        const safeTx = Array.isArray(transactions) ? transactions.filter(Boolean) : [];
        if (period === 'MONTHLY') {
          const intervals = [
            { label: 'Tgl 1-6', start: 1, end: 6 },
            { label: 'Tgl 7-12', start: 7, end: 12 },
            { label: 'Tgl 13-18', start: 13, end: 18 },
            { label: 'Tgl 19-24', start: 19, end: 24 },
            { label: 'Tgl 25-31', start: 25, end: 31 }
          ];
          return intervals.map(iv => {
            let inc = 0;
            let exp = 0;
            safeTx.forEach(tx => {
              const d = new Date(tx.date);
              if (d.getFullYear() === currentYear && d.getMonth() === currentMonth) {
                const day = d.getDate();
                if (day >= iv.start && day <= iv.end) {
                  const amt = Number(tx.amount) || 0;
                  if (tx.type === 'INCOME') inc += amt;
                  else if (tx.type === 'EXPENSE') exp += amt;
                }
              }
            });
            return { label: iv.label, income: inc, expense: exp };
          });
        } else {
          const intervals = [
            { label: 'Jan-Feb', months: [0, 1] },
            { label: 'Mar-Apr', months: [2, 3] },
            { label: 'Mei-Jun', months: [4, 5] },
            { label: 'Jul-Agu', months: [6, 7] },
            { label: 'Sep-Okt', months: [8, 9] },
            { label: 'Nov-Des', months: [10, 11] }
          ];
          return intervals.map(iv => {
            let inc = 0;
            let exp = 0;
            safeTx.forEach(tx => {
              const d = new Date(tx.date);
              if (d.getFullYear() === currentYear && iv.months.includes(d.getMonth())) {
                const amt = Number(tx.amount) || 0;
                if (tx.type === 'INCOME') inc += amt;
                else if (tx.type === 'EXPENSE') exp += amt;
              }
            });
            return { label: iv.label, income: inc, expense: exp };
          });
        }
      }, [transactions, period, currentYear, currentMonth]);

      const [selectedPointIndex, setSelectedPointIndex] = useState(0);

      useEffect(() => {
        if (trendData && trendData.length > 0) {
          setSelectedPointIndex(trendData.length - 1);
        }
      }, [trendData]);

      // SVG dimensions & math
      const svgWidth = 340;
      const svgHeight = 160;
      const padLeft = 24;
      const padRight = 24;
      const padTop = 18;
      const padBottom = 32;
      const usableW = svgWidth - padLeft - padRight;
      const usableH = svgHeight - padTop - padBottom;

      const maxChartVal = useMemo(() => {
        const peak = Math.max(...trendData.map(p => Math.max(p.income, p.expense)), 0);
        return peak > 0 ? peak : 10000;
      }, [trendData]);

      const getPointsCoords = (key) => {
        return trendData.map((pt, i) => {
          const x = padLeft + (i / (trendData.length - 1)) * usableW;
          const val = pt[key] || 0;
          const y = padTop + usableH - (val / maxChartVal) * usableH;
          return { x, y, val };
        });
      };

      const incomeCoords = useMemo(() => getPointsCoords('income'), [trendData, maxChartVal]);
      const expenseCoords = useMemo(() => getPointsCoords('expense'), [trendData, maxChartVal]);

      const buildSmoothPath = (pts) => {
        if (!pts || pts.length === 0) return '';
        if (pts.length === 1) return `M ${pts[0].x},${pts[0].y}`;
        let d = `M ${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[i];
          const p1 = pts[i + 1];
          const midX = (p0.x + p1.x) / 2;
          d += ` C ${midX.toFixed(1)},${p0.y.toFixed(1)} ${midX.toFixed(1)},${p1.y.toFixed(1)} ${p1.x.toFixed(1)},${p1.y.toFixed(1)}`;
        }
        return d;
      };

      const incomePath = useMemo(() => buildSmoothPath(incomeCoords), [incomeCoords]);
      const expensePath = useMemo(() => buildSmoothPath(expenseCoords), [expenseCoords]);

      const selectedPoint = trendData[selectedPointIndex] || trendData[0] || { label: '', income: 0, expense: 0 };
      const selectedX = padLeft + (selectedPointIndex / (trendData.length - 1)) * usableW;

      // Comparison Bar Calculation
      const maxVal = Math.max(stats.income, stats.expense, 1);
      const incomePercent = Math.round((stats.income / maxVal) * 100);
      const expensePercent = Math.round((stats.expense / maxVal) * 100);

      return (
        <div className="space-y-4">
          {/* Period Selector Tabs */}
          <div className="flex bg-slate-200 dark:bg-slate-800 p-1 rounded-xl border border-slate-300/60 dark:border-slate-700">
            <button
              type="button"
              onClick={() => setPeriod('MONTHLY')}
              className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${
                period === 'MONTHLY'
                  ? 'bg-white text-slate-900 shadow-sm'
                  : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
              }`}
            >
              Bulanan ({monthNames[currentMonth]} {currentYear})
            </button>
            <button
              type="button"
              onClick={() => setPeriod('YEARLY')}
              className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${
                period === 'YEARLY'
                  ? 'bg-white text-slate-900 shadow-sm'
                  : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
              }`}
            >
              Tahunan ({currentYear})
            </button>
          </div>

          {/* SVG Line Chart Card: Income vs Expense Trends */}
          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm transition-colors">
            <div className="flex items-center justify-between mb-3">
              <div>
                <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block leading-none">
                  Grafik Tren Arus Kas
                </span>
                <h3 className="text-sm font-bold text-slate-900 dark:text-white mt-0.5">
                  Pemasukan vs Pengeluaran
                </h3>
              </div>
              <div className="flex items-center gap-3 text-[11px] font-semibold">
                <span className="flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                  Pemasukan
                </span>
                <span className="flex items-center gap-1.5 text-rose-600 dark:text-rose-400">
                  <span className="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                  Pengeluaran
                </span>
              </div>
            </div>

            {/* Inline Interactive SVG Line Chart */}
            <div className="w-full overflow-hidden">
              <svg
                viewBox={`0 0 ${svgWidth} ${svgHeight}`}
                className="w-full h-auto overflow-visible select-none"
              >
                {/* Horizontal reference grid lines */}
                <line x1={padLeft} y1={padTop} x2={padLeft + usableW} y2={padTop} stroke="currentColor" className="text-slate-100 dark:text-slate-800" strokeWidth="1" strokeDasharray="3 3" />
                <line x1={padLeft} y1={padTop + usableH / 2} x2={padLeft + usableW} y2={padTop + usableH / 2} stroke="currentColor" className="text-slate-100 dark:text-slate-800" strokeWidth="1" strokeDasharray="3 3" />
                <line x1={padLeft} y1={padTop + usableH} x2={padLeft + usableW} y2={padTop + usableH} stroke="currentColor" className="text-slate-200 dark:text-slate-800" strokeWidth="1" />

                {/* Vertical Active Guide Line */}
                <line
                  x1={selectedX}
                  y1={padTop}
                  x2={selectedX}
                  y2={padTop + usableH}
                  stroke="currentColor"
                  className="text-slate-300 dark:text-slate-600"
                  strokeWidth="1.5"
                  strokeDasharray="2 2"
                />

                {/* Subtle Area Fills */}
                {incomePath && (
                  <path
                    d={`${incomePath} L ${padLeft + usableW},${padTop + usableH} L ${padLeft},${padTop + usableH} Z`}
                    fill="#10B981"
                    fillOpacity="0.07"
                  />
                )}
                {expensePath && (
                  <path
                    d={`${expensePath} L ${padLeft + usableW},${padTop + usableH} L ${padLeft},${padTop + usableH} Z`}
                    fill="#F43F5E"
                    fillOpacity="0.06"
                  />
                )}

                {/* Income Curved Line */}
                {incomePath && (
                  <path
                    d={incomePath}
                    fill="none"
                    stroke="#10B981"
                    strokeWidth="2.5"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  />
                )}

                {/* Expense Curved Line */}
                {expensePath && (
                  <path
                    d={expensePath}
                    fill="none"
                    stroke="#F43F5E"
                    strokeWidth="2.5"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  />
                )}

                {/* Data Points & Touch Targets */}
                {trendData.map((pt, i) => {
                  const x = padLeft + (i / (trendData.length - 1)) * usableW;
                  const incY = incomeCoords[i] ? incomeCoords[i].y : padTop + usableH;
                  const expY = expenseCoords[i] ? expenseCoords[i].y : padTop + usableH;
                  const isSelected = i === selectedPointIndex;

                  return (
                    <g key={i}>
                      {/* Income Node */}
                      <circle
                        cx={x}
                        cy={incY}
                        r={isSelected ? 5 : 3.5}
                        fill="#10B981"
                        stroke="#FFFFFF"
                        strokeWidth={isSelected ? 2.5 : 1.5}
                        className="transition-all duration-150"
                      />
                      {/* Expense Node */}
                      <circle
                        cx={x}
                        cy={expY}
                        r={isSelected ? 5 : 3.5}
                        fill="#F43F5E"
                        stroke="#FFFFFF"
                        strokeWidth={isSelected ? 2.5 : 1.5}
                        className="transition-all duration-150"
                      />
                      {/* X-axis Label */}
                      <text
                        x={x}
                        y={svgHeight - 10}
                        textAnchor="middle"
                        className={`text-[10px] font-semibold select-none ${
                          isSelected
                            ? 'fill-brand dark:fill-sky-400 font-bold'
                            : 'fill-slate-400 dark:fill-slate-500'
                        }`}
                      >
                        {pt.label}
                      </text>
                      {/* Generous Touch Target */}
                      <rect
                        x={x - usableW / (trendData.length * 2)}
                        y={padTop}
                        width={usableW / trendData.length}
                        height={usableH + 20}
                        fill="transparent"
                        className="cursor-pointer"
                        onClick={() => setSelectedPointIndex(i)}
                      />
                    </g>
                  );
                })}
              </svg>
            </div>

            {/* Interactive Data Point Summary Pill */}
            <div className="mt-2 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs bg-slate-50 dark:bg-slate-800/60 p-2.5 rounded-xl">
              <div>
                <span className="text-[10px] uppercase font-bold text-slate-400 block leading-none">
                  Periode Terpilih
                </span>
                <span className="font-bold text-slate-800 dark:text-slate-100 mt-0.5 block">
                  {selectedPoint.label}
                </span>
              </div>
              <div className="flex items-center gap-4 text-right">
                <div>

              </span>

                <div className="flex justify-between text-xs mb-1 font-semibold">
                  <span className="text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
                    <Icon name="arrow-down-left" className="w-3.5 h-3.5" />
                    Total Pemasukan
                  </span>
                  <span className="text-slate-800 dark:text-slate-200">{formatIDR(stats.income)}</span>
                </div>
                <div className="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
                  <div
                    className="bg-emerald-500 h-full rounded-full transition-all duration-500"
                    style={{ width: `${incomePercent}%` }}
                  />
                </div>
              </div>

              {/* Expense Row */}
              <div>
                <div className="flex justify-between text-xs mb-1 font-semibold">
                  <span className="text-rose-600 dark:text-rose-400 flex items-center gap-1">
                    <Icon name="arrow-up-right" className="w-3.5 h-3.5" />

                  </span>
                  <span className="text-slate-800 dark:text-slate-200">{formatIDR(stats.expense)}</span>
                </div>
                <div className="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">

                    className="bg-rose-500 h-full rounded-full transition-all duration-500"

          {/* Top Spending Categories Breakdown */}
          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
            <span className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 block mb-3">
              Distribusi Pengeluaran Terbesar
            </span>

            {stats.topCategories.length === 0 ? (
              <p className="text-xs text-slate-400 text-center py-4">Belum ada pengeluaran pada periode ini.</p>
            ) : (
              <div className="space-y-3">
                {stats.topCategories.map(cat => (
                  <div key={cat.id}>
                    <div className="flex justify-between items-center text-xs mb-1 font-semibold">

                        <div className="w-6 h-6 rounded-md bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-400">

      );
    };

    // =========================================================================
    // 8. MAIN DASHBOARD VIEW
    // =========================================================================
    const MainDashboard = ({
      isAnyModalOpen = false,
      userName,
      username,
      avatar,
      theme,
      onToggleTheme,
      accounts,
      transactions,
      savingsGoals,
      isBalanceHidden,
      onToggleHideBalance,
      onOpenTransactionModal,
      onOpenAccountsModal,
      onOpenSettingsModal,
      onOpenSavingsModal,
      onSelectGoal,
      onDeleteGoal,
      onLockApp,
      onDeleteTransaction
    }) => {
      const [currentTab, setCurrentTab] = useState('DASHBOARD'); // 'DASHBOARD' | 'SAVINGS' | 'ANALYTICS'
      const [selectedAccountId, setSelectedAccountId] = useState(null); // null means All Accounts
      const [deleteTxConfirmId, setDeleteTxConfirmId] = useState(null);
      const [isClosingDelete, setIsClosingDelete] = useState(false);

      const handleCloseDelete = () => {
        setIsClosingDelete(true);
        setTimeout(() => {
          setIsClosingDelete(false);
          setDeleteTxConfirmId(null);
        }, 200);
      };

      // Calculations via Ledger (Single Source of Truth)
      const totalBalance = useMemo(() => {
        return Ledger.getTotalBalance(accounts, transactions);
      }, [accounts, transactions]);

      const summaryTotals = useMemo(() => {
        return Ledger.getSummaryTotals(transactions, selectedAccountId);
      }, [transactions, selectedAccountId]);

      // Filtered Transactions
      const displayedTransactions = useMemo(() => {
        const list = selectedAccountId
          ? transactions.filter(t => t.accountId === selectedAccountId)
          : transactions;
        // Sort descending by date then createdAt
        return [...list].sort((a, b) => {
          const dateDiff = new Date(b.date).getTime() - new Date(a.date).getTime();
          if (dateDiff !== 0) return dateDiff;
          return new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime();
        });
      }, [transactions, selectedAccountId]);

      const selectedAccount = accounts.find(a => a.id === selectedAccountId);

      return (
        <div className={`min-h-screen flex flex-col justify-between bg-slate-50 dark:bg-slate-950 max-w-md mx-auto overflow-hidden ios-screen-container ${
          isAnyModalOpen ? 'ios-screen-scaled' : ''
        }`}>
          {/* Top Navigation Bar */}
          <header className="sticky top-0 z-30 shrink-0 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-5 py-3.5 flex items-center justify-between transition-colors">
            <button
              type="button"
              onClick={onOpenSettingsModal}
              className="flex items-center gap-2.5 text-left rounded-xl p-1 -m-1 hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors ios-btn-tap group focus:outline-none"
              title="Buka Pengaturan Akun & Data"
              aria-label="Pengaturan Pengguna"
            >
              <Avatar avatar={avatar} name={userName} size="w-9 h-9" textSize="text-xs" />
              <div>
                <span className="text-[10px] font-bold uppercase tracking-wider text-brand dark:text-sky-400 block leading-none">
                  Voralet
                </span>
                <h1 className="text-sm font-bold text-slate-900 dark:text-white leading-tight group-hover:text-brand dark:group-hover:text-sky-400 transition-colors">
                  Halo, {userName || 'Teman'}
                </h1>
              </div>
            </button>

            <div className="flex items-center gap-1.5">
              <button
                type="button"
                onClick={() => onToggleTheme(theme === 'dark' ? 'light' : 'dark')}
                title={theme === 'dark' ? 'Ganti ke Mode Terang' : 'Ganti ke Mode Gelap'}
                className="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 dark:text-slate-400 hover:text-brand dark:hover:text-sky-400 hover:bg-brand-light dark:hover:bg-slate-800 transition-colors"
                aria-label="Toggle Theme"
              >
                <Icon name={theme === 'dark' ? 'sun' : 'moon'} className="w-4 h-4" />
              </button>
              <button
                type="button"
                onClick={onLockApp}
                title="Kunci Aplikasi"
                className="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 dark:text-slate-400 hover:text-brand dark:hover:text-sky-400 hover:bg-brand-light dark:hover:bg-slate-800 transition-colors"
                aria-label="Kunci Aplikasi"
              >
                <Icon name="lock" className="w-4 h-4" />
              </button>
            </div>
          </header>

          {/* Isolated Scrollable Main Viewport (Keyboard Safe) */}
          <main className="flex-1 overflow-y-auto p-4 space-y-4 pb-6">
            {currentTab === 'DASHBOARD' && (
              <div key="DASHBOARD" className="animate-ios-tab-view space-y-4">
                {/* Total Balance Card (Blu by BCA inspired) */}

                  <div className="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 mb-1">
                    <div className="flex items-center gap-1.5">
                      <span className="font-semibold text-slate-600 dark:text-slate-300">
                        {selectedAccount ? `Saldo ${selectedAccount.name}` : 'Total Saldo Gabungan'}

                      {selectedAccountId && (
                        <button
                          type="button"
                          onClick={() => setSelectedAccountId(null)}
                          className="text-[10px] text-brand dark:text-sky-400 hover:underline"
                        >
                          (Lihat Total)
                        </button>
                      )}
                    </div>
                    <button
                      type="button"
                      onClick={onToggleHideBalance}
                      className="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
                      aria-label={isBalanceHidden ? 'Tampilkan Saldo' : 'Sembunyikan Saldo'}
                    >
                      <Icon name={isBalanceHidden ? 'eye-off' : 'eye'} className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="py-1">
                    <span className="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">
                      {isBalanceHidden
                        ? 'Rp ••••••••'

                        <Icon name="arrow-down-left" className="w-3.5 h-3.5" />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block leading-none">Pemasukan</span>
                        <span className="text-xs font-semibold text-slate-800 dark:text-slate-200">
                          {isBalanceHidden ? '•••••' : formatIDR(summaryTotals.income)}
                        </span>
                      </div>
                    </div>

                    <div className="flex items-center gap-2">
                      <div className="w-6 h-6 rounded-md bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 flex items-center justify-center shrink-0">
                        <Icon name="arrow-up-right" className="w-3.5 h-3.5" />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block leading-none">Pengeluaran</span>
                        <span className="text-xs font-semibold text-slate-800 dark:text-slate-200">
                          {isBalanceHidden ? '•••••' : formatIDR(summaryTotals.expense)}

                      </div>
                    </div>

                </div>

                {/* Quick Action Buttons */}
                <div className="grid grid-cols-2 gap-2.5">

                  <button

                  >
                    <div className="w-5 h-5 rounded-full bg-white/20 text-white flex items-center justify-center">
                      <Icon name="arrow-down-left" className="w-3 h-3" />
                    </div>
                    <span>[+] Catat Pemasukan</span>
                  </button>
                </div>

                {/* Accounts Carousel / Grid (Blu Pocket Style) */}
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">

                  {accounts.length === 0 ? (

                        + Tambah Akun

                  ) : (
                    <div className="flex gap-2.5 overflow-x-auto pb-1 no-scrollbar">
                      {/* "Semua Akun" Pill */}
                      <button

                        className={`min-w-[120px] p-3 rounded-xl border text-left flex flex-col justify-between transition-all shrink-0 ios-btn-tap ${
                          selectedAccountId === null
                            ? 'bg-brand text-white border-brand shadow-sm'

                        }`}
                      >

                        <div>
                          <span className="text-xs font-bold block truncate">Total Dompet</span>
                          <span className="text-[11px] font-medium opacity-90">
                            {isBalanceHidden ? '••••••' : formatIDR(totalBalance)}
                          </span>
                        </div>
                      </button>

                      {/* Individual Wallet Pockets */}
                      {accounts.map(acc => {
                        const isSelected = selectedAccountId === acc.id;
                        const bal = Ledger.getAccountBalance(acc.id, accounts, transactions);
                        return (
                          <button
                            key={acc.id}
                            type="button"
                            onClick={() => setSelectedAccountId(isSelected ? null : acc.id)}
                            className={`min-w-[130px] p-3 rounded-xl border text-left flex flex-col justify-between transition-all shrink-0 ios-btn-tap ${
                              isSelected
                                ? 'bg-brand-soft dark:bg-slate-800 border-brand text-brand-dark dark:text-sky-300 shadow-sm'
                                : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:border-slate-300 dark:hover:border-slate-700'
                            }`}
                          >
                            <div className="flex items-center justify-between mb-2">
                              <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">
                                {acc.type}
                              </span>
                              <Icon
                                name={acc.type === 'Bank' ? 'bank' : acc.type === 'Cash' ? 'cash' : 'smartphone'}
                                className={`w-4 h-4 ${isSelected ? 'text-brand dark:text-sky-400' : 'text-slate-400'}`}
                              />
                            </div>
                            <div>
                              <span className="text-xs font-bold text-slate-900 dark:text-white block truncate">{acc.name}</span>
                              <span className="text-[11px] font-semibold text-slate-600 dark:text-slate-400 block">
                                {isBalanceHidden ? '••••••' : formatIDR(bal)}
                              </span>
                            </div>
                          </button>
                        );

                    </div>

                </div>

                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center gap-1.5">
                      <span className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                        Riwayat Transaksi
                      </span>
                      {selectedAccount && (
                        <span className="text-[10px] font-bold px-2 py-0.5 bg-brand-light dark:bg-slate-800 text-brand dark:text-sky-300 rounded-full">
                          {selectedAccount.name}
                        </span>
                      )}
                    </div>
                    {selectedAccountId && (
                      <button
                        type="button"
                        onClick={() => setSelectedAccountId(null)}
                        className="text-xs text-slate-500 dark:text-slate-400 hover:underline"
                      >
                        Tampilkan Semua
                      </button>
                    )}
                  </div>

                  {displayedTransactions.length === 0 ? (
                    <div className="p-8 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl text-center">
                      <div className="w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center mx-auto mb-2 text-slate-400">
                        <Icon name="tag" className="w-6 h-6" />
                      </div>
                      <h3 className="text-xs font-bold text-slate-700 dark:text-slate-300">Belum ada transaksi</h3>
                      <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1 max-w-xs mx-auto">
                        {selectedAccount
                          ? `Belum ada mutasi untuk dompet ${selectedAccount.name}.`
                          : 'Mulai catat pengeluaran dan pemasukan harianmu di Voralet.'}
                      </p>
                      <button
                        type="button"
                        onClick={() => onOpenTransactionModal('EXPENSE')}
                        className="mt-3 px-3 py-1.5 bg-brand-light dark:bg-slate-800 text-brand dark:text-sky-300 text-xs font-semibold rounded-lg hover:bg-sky-100 dark:hover:bg-slate-700 transition-colors ios-btn-tap"
                      >
                        Catat Transaksi Sekarang
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-2">
                      {displayedTransactions.map(tx => {
                        const catObj = CATEGORIES.find(c => c.id === tx.category) || {
                          label: tx.category || 'Lainnya',
                          icon: 'tag'
                        };
                        const accObj = accounts.find(a => a.id === tx.accountId);
                        const isIncome = tx.type === 'INCOME';

                        return (
                          <div
                            key={tx.id}
                            className="p-3.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl flex items-center justify-between shadow-sm hover:border-slate-300 dark:hover:border-slate-700 transition-colors"
                          >
                            <div className="flex items-center gap-3">
                              <div
                                className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${
                                  isIncome
                                    ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400'
                                    : 'bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400'
                                }`}
                              >
                                <Icon name={catObj.icon} className="w-4 h-4" />
                              </div>
                              <div>
                                <div className="flex items-center gap-2">
                                  <h4 className="text-xs font-bold text-slate-900 dark:text-white leading-snug">{catObj.label}</h4>
                                  {accObj && (
                                    <span className="text-[10px] font-medium px-1.5 py-0.2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded">
                                      {accObj.name}
                                    </span>
                                  )}
                                </div>
                                <div className="flex items-center gap-2 text-[11px] text-slate-400 dark:text-slate-500">
                                  <span>{formatDateID(tx.date)}</span>
                                  {tx.notes && <span>• {tx.notes}</span>}
                                </div>
                              </div>
                            </div>

                            <div className="flex items-center gap-2">
                              <span
                                className={`text-xs font-bold text-right ${
                                  isIncome ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'
                                }`}
                              >
                                {isIncome ? '+' : '-'}{formatIDR(tx.amount)}

                                type="button"
