              onClick={() => setCurrentTab('DASHBOARD')}
              className={`flex flex-col items-center gap-1 py-1 px-3 rounded-lg transition-colors ios-btn-tap ${
                currentTab === 'DASHBOARD'
                  ? 'text-brand dark:text-sky-400 font-bold'
                  : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 font-medium'
              }`}
            >
              <Icon name="wallet" className={`w-5 h-5 transition-transform duration-200 ${currentTab === 'DASHBOARD' ? 'scale-110' : 'scale-100'}`} />
              <span className="text-[10px]">Dashboard</span>
            </button>

            <button
              type="button"
              onClick={() => setCurrentTab('SAVINGS')}
              className={`flex flex-col items-center gap-1 py-1 px-3 rounded-lg transition-colors ios-btn-tap ${
                currentTab === 'SAVINGS'
                  ? 'text-brand dark:text-sky-400 font-bold'
                  : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 font-medium'
              }`}
            >
              <Icon name="target" className={`w-5 h-5 transition-transform duration-200 ${currentTab === 'SAVINGS' ? 'scale-110' : 'scale-100'}`} />
              <span className="text-[10px]">Impian</span>
            </button>

            <button
              type="button"
              onClick={() => setCurrentTab('ANALYTICS')}
              className={`flex flex-col items-center gap-1 py-1 px-3 rounded-lg transition-colors ios-btn-tap ${
                currentTab === 'ANALYTICS'
                  ? 'text-brand dark:text-sky-400 font-bold'
                  : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 font-medium'
              }`}
            >
              <Icon name="pie-chart" className={`w-5 h-5 transition-transform duration-200 ${currentTab === 'ANALYTICS' ? 'scale-110' : 'scale-100'}`} />
              <span className="text-[10px]">Analisis</span>
            </button>
          </nav>

          {/* Delete Transaction Confirmation Dialog with Crisp Close Icon */}
          {deleteTxConfirmId && (
            <div
              className={`fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4 ${
                isClosingDelete ? 'animate-ios-backdrop-exit' : 'animate-ios-backdrop'
              }`}
              onClick={(e) => {
                if (e.target === e.currentTarget) handleCloseDelete();
              }}
            >
              <div
                className={`bg-white dark:bg-slate-800 rounded-2xl p-5 max-w-xs w-full shadow-xl border border-slate-200 dark:border-slate-700 ${
                  isClosingDelete ? 'animate-ios-pop-exit' : 'animate-ios-pop'
                }`}
              >
                <div className="flex items-center justify-between mb-2">
                  <h3 className="text-sm font-bold text-slate-900 dark:text-white">Hapus Transaksi?</h3>
                  <button
                    type="button"
                    onClick={handleCloseDelete}
                    className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors ios-btn-tap"
                    aria-label="Tutup"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <line x1="18" y1="6" x2="6" y2="18"></line>
                      <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                  </button>
                </div>
                <p className="text-xs text-slate-500 dark:text-slate-400 mb-4">
                  Saldo akun akan disesuaikan kembali secara otomatis setelah transaksi dihapus.
                </p>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={handleCloseDelete}
                    className="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 ios-btn-tap"
                  >
                    Batal
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      onDeleteTransaction(deleteTxConfirmId);
                      handleCloseDelete();
                    }}
                    className="flex-1 py-2 bg-rose-600 text-white text-xs font-semibold rounded-lg hover:bg-rose-700 ios-btn-tap"
                  >
                    Hapus
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================

    // =========================================================================
    // 9. ROOT APPLICATION COMPONENT
    // =========================================================================
    function App() {
      // Launch Splash Screen
      const [showSplash, setShowSplash] = useState(true);

      // Local state from storage (ZERO DEFAULT MOCK DATA)
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [storedPin, setStoredPin] = useState(() => StorageService.getPin());
      const [userName, setUserName] = useState(() => StorageService.getName());
      const [username, setUsername] = useState(() => StorageService.getUsername());
      const [avatar, setAvatar] = useState(() => StorageService.getAvatar());
      const [theme, setTheme] = useState(() => StorageService.getTheme());
      const [accounts, setAccounts] = useState(() => StorageService.getAccounts());
      const [transactions, setTransactions] = useState(() => StorageService.getTransactions());
      const [savingsGoals, setSavingsGoals] = useState(() => StorageService.getSavingsGoals());
      const [isBalanceHidden, setIsBalanceHidden] = useState(() => StorageService.getHideBalance());

      // Modals State
      const [isTxModalOpen, setIsTxModalOpen] = useState(false);
      const [txModalType, setTxModalType] = useState('EXPENSE');
      const [isAccountsModalOpen, setIsAccountsModalOpen] = useState(false);
      const [isSettingsModalOpen, setIsSettingsModalOpen] = useState(false);
      const [isSavingsModalOpen, setIsSavingsModalOpen] = useState(false);
      const [selectedGoal, setSelectedGoal] = useState(null);
      const [toastMsg, setToastMsg] = useState('');

      const showToast = useCallback((msg) => {
        setToastMsg(msg);
      }, []);

      // Synchronize theme with HTML root class
      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        StorageService.setTheme(theme);
      }, [theme]);

      const handleToggleTheme = (targetTheme) => {
        if (typeof targetTheme === 'string') {
          setTheme(targetTheme);
        } else {
          setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
        }
      };

      const handleUpdateAvatar = (newAvatar) => {
        setAvatar(newAvatar);
        StorageService.setAvatar(newAvatar);
        showToast(newAvatar ? 'Foto profil diperbarui' : 'Foto profil dihapus');
      };

      const handleUpdateProfile = (newName, newUsername) => {
        setUserName(newName);
        setUsername(newUsername);
        StorageService.setName(newName);
        StorageService.setUsername(newUsername);
        showToast('Profil pengguna diperbarui');
      };

      // Handler for Onboarding Completion
      const handleOnboardingComplete = (data) => {
        setStoredPin(data.pin);
        setUserName(data.name);
        if (data.username) setUsername(data.username);
        if (data.avatar) setAvatar(data.avatar);
        setAccounts(data.accounts);
        setTransactions(data.transactions);
        if (data.savingsGoals) setSavingsGoals(data.savingsGoals);
        setIsUnlocked(true);
        showToast('Akun Voralet berhasil disiapkan!');
      };

      // Handler for Transaction Creation (Atomic state update)
      const handleAddTransaction = (newTx) => {
        const nextList = [newTx, ...transactions];
        setTransactions(nextList);
        StorageService.setTransactions(nextList);
        showToast(newTx.type === 'INCOME' ? 'Pemasukan dicatat!' : 'Pengeluaran dicatat!');
      };

      // Handler for Transaction Deletion
      const handleDeleteTransaction = (txId) => {
        const nextList = transactions.filter(t => t.id !== txId);
        setTransactions(nextList);
        StorageService.setTransactions(nextList);
        showToast('Transaksi telah dihapus');
      };

      // Handler for Account Creation
      const handleAddAccount = (newAcc) => {
        const nextList = [...accounts, newAcc];
        setAccounts(nextList);
        StorageService.setAccounts(nextList);
        showToast('Akun baru ditambahkan');
      };

      // Handler for Account Edit
      const handleEditAccount = (accId, updatedData) => {
        const nextList = accounts.map(a => (a.id === accId ? { ...a, ...updatedData } : a));
        setAccounts(nextList);
        StorageService.setAccounts(nextList);
        showToast('Akun diperbarui');
      };

      // Handler for Account Deletion
      const handleDeleteAccount = (accId) => {
        if (accounts.length <= 1) {
          showToast('Minimal harus ada 1 akun aktif');
          return;
        }
        const hasTx = transactions.some(t => t.accountId === accId);
        if (hasTx) {
          const confirmDel = window.confirm(
            'Akun ini memiliki mutasi transaksi. Menghapus akun akan menghapus seluruh mutasinya juga. Lanjutkan?'
          );
          if (!confirmDel) return;
        }
        const nextAccounts = accounts.filter(a => a.id !== accId);
        const nextTransactions = transactions.filter(t => t.accountId !== accId);

        setAccounts(nextAccounts);
        setTransactions(nextTransactions);
        StorageService.setAccounts(nextAccounts);
        StorageService.setTransactions(nextTransactions);
        showToast('Akun berhasil dihapus');
      };

      // Savings Goals Handlers
      const handleSaveGoal = (goalData) => {
        let nextGoals;
        const exists = savingsGoals.some(g => g.id === goalData.id);
        if (exists) {
          nextGoals = savingsGoals.map(g => (g.id === goalData.id ? { ...g, ...goalData } : g));
          showToast('Target impian diperbarui');
        } else {
          nextGoals = [...savingsGoals, goalData];
          showToast('Kantong impian baru dibuat');
        }
        setSavingsGoals(nextGoals);
        StorageService.setSavingsGoals(nextGoals);
      };

      const handleAdjustGoal = (goalId, mode, amount, accountId) => {
        const targetGoal = savingsGoals.find(g => g.id === goalId);
        if (!targetGoal) return;

        const currentSaved = targetGoal.savedAmount || 0;
        let newSaved = currentSaved;

        if (mode === 'DEPOSIT') {
          newSaved = currentSaved + amount;
          // Record an expense transaction from wallet to represent allocation into savings
          const autoTx = {
            id: 'tx_sav_' + Date.now(),
            accountId: accountId,
            amount: amount,
            type: 'EXPENSE',
            category: 'other',
            date: new Date().toISOString().split('T')[0],
            notes: `Tabungan Impian: ${targetGoal.name}`,
            createdAt: new Date().toISOString()
          };
          const nextTx = [autoTx, ...transactions];
          setTransactions(nextTx);
          StorageService.setTransactions(nextTx);
          showToast(`Berhasil menabung Rp ${amount.toLocaleString('id-ID')} ke ${targetGoal.name}`);
        } else {
          newSaved = Math.max(0, currentSaved - amount);
          // Record an income transaction back to wallet
          const autoTx = {
            id: 'tx_sav_' + Date.now(),
            accountId: accountId,
            amount: amount,
            type: 'INCOME',
            category: 'other',
            date: new Date().toISOString().split('T')[0],
            notes: `Pencairan Tabungan: ${targetGoal.name}`,
            createdAt: new Date().toISOString()
          };
          const nextTx = [autoTx, ...transactions];
          setTransactions(nextTx);
          StorageService.setTransactions(nextTx);
          showToast(`Berhasil mencairkan Rp ${amount.toLocaleString('id-ID')} ke dompet`);
        }

        const nextGoals = savingsGoals.map(g => (g.id === goalId ? { ...g, savedAmount: newSaved } : g));
        setSavingsGoals(nextGoals);
        StorageService.setSavingsGoals(nextGoals);
      };

      const handleDeleteGoal = (goalId) => {
        const confirmDel = window.confirm('Hapus kantong impian ini?');
        if (!confirmDel) return;
        const nextGoals = savingsGoals.filter(g => g.id !== goalId);
        setSavingsGoals(nextGoals);
        StorageService.setSavingsGoals(nextGoals);
        showToast('Kantong impian telah dihapus');
      };

      // Handler for PIN Update
      const handleUpdatePin = (newPin) => {
        StorageService.setPin(newPin);
        setStoredPin(newPin);
        showToast('PIN keamanan diperbarui');
      };

      // Handler for Hide/Show Balance Toggle
      const handleToggleHideBalance = () => {
        const next = !isBalanceHidden;
        setIsBalanceHidden(next);
        StorageService.setHideBalance(next);
      };

      // Handler for JSON Export
      const handleExportData = () => {
        try {
          const exportPayload = {
            appName: 'Voralet',
            version: '1.0.0',
            exportedAt: new Date().toISOString(),
            user: {
              name: userName,
              username: username
            },
            accounts,
            transactions,
            savingsGoals
          };
          const blob = new Blob([JSON.stringify(exportPayload, null, 2)], {
            type: 'application/json'
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `voralet_backup_${new Date().toISOString().split('T')[0]}.json`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
          showToast('File voralet_backup.json berhasil diunduh');
        } catch (e) {
          console.error(e);
          showToast('Gagal mengekspor data');
        }
      };

      // Handler for JSON Import
      const handleImportData = (parsedPayload) => {
        try {
          if (!Array.isArray(parsedPayload.accounts) || !Array.isArray(parsedPayload.transactions)) {
            throw new Error('Struktur file tidak valid');
          }
          const importedAccounts = parsedPayload.accounts;
          const importedTransactions = parsedPayload.transactions;
          const importedName = parsedPayload.user?.name || userName || 'Teman Voralet';
          const importedUsername = parsedPayload.user?.username || username || '';
          const importedSavings = Array.isArray(parsedPayload.savingsGoals) ? parsedPayload.savingsGoals : [];

          setAccounts(importedAccounts);
          setTransactions(importedTransactions);
          setSavingsGoals(importedSavings);
          setUserName(importedName);
          if (importedUsername) setUsername(importedUsername);

          StorageService.setAccounts(importedAccounts);
          StorageService.setTransactions(importedTransactions);
          StorageService.setSavingsGoals(importedSavings);
          StorageService.setName(importedName);
          if (importedUsername) StorageService.setUsername(importedUsername);

          setIsSettingsModalOpen(false);
          showToast('Data cadangan berhasil dipulihkan!');
        } catch (err) {
          alert('Gagal memulihkan cadangan: ' + err.message);
        }
      };

      // Handler for Reset All
      const handleResetAll = () => {
        StorageService.clearAll();
        setStoredPin(null);
        setUserName('');
        setUsername('');
        setAvatar('');
        setAccounts([]);
        setTransactions([]);
        setSavingsGoals([]);
        setIsUnlocked(false);
        setIsSettingsModalOpen(false);
        showToast('Seluruh data Voralet telah dibersihkan');
      };

      // FLOW A: Fresh User Onboarding
      if (!storedPin) {
        return (
          <>
            {showSplash && <SplashScreen onFinish={() => setShowSplash(false)} />}
            {toastMsg && <Toast message={toastMsg} onClose={() => setToastMsg('')} />}
            <OnboardingFlow onComplete={handleOnboardingComplete} />
          </>
        );
      }

      // FLOW B: Returning User PIN Keypad Screen
      if (!isUnlocked) {
        return (
          <>
            {showSplash && <SplashScreen onFinish={() => setShowSplash(false)} />}
            {toastMsg && <Toast message={toastMsg} onClose={() => setToastMsg('')} />}
            <ReturningUserPinScreen
              storedPin={storedPin}
              userName={userName}
              username={username}
              avatar={avatar}
              theme={theme}
              onToggleTheme={handleToggleTheme}
              onUnlock={() => setIsUnlocked(true)}
              onResetPin={handleUpdatePin}
            />
          </>
        );
      }

      // UNLOCKED: Main Dashboard
      const isAnyModalOpen = isTxModalOpen || isAccountsModalOpen || isSavingsModalOpen || isSettingsModalOpen;

      return (
        <div className="relative w-full h-[100dvh] overflow-hidden bg-slate-950">
          {showSplash && <SplashScreen onFinish={() => setShowSplash(false)} />}
          {toastMsg && <Toast message={toastMsg} onClose={() => setToastMsg('')} />}

          <MainDashboard
            isAnyModalOpen={isAnyModalOpen}
            userName={userName}
            username={username}
            avatar={avatar}
            theme={theme}
            onToggleTheme={handleToggleTheme}
            accounts={accounts}
            transactions={transactions}
            savingsGoals={savingsGoals}
            isBalanceHidden={isBalanceHidden}
            onToggleHideBalance={handleToggleHideBalance}
            onOpenTransactionModal={(type) => {
              setTxModalType(type);
              setIsTxModalOpen(true);
            }}
            onOpenAccountsModal={() => setIsAccountsModalOpen(true)}
            onOpenSettingsModal={() => setIsSettingsModalOpen(true)}
            onOpenSavingsModal={() => {
              setSelectedGoal(null);
              setIsSavingsModalOpen(true);
            }}
            onSelectGoal={(goal) => {
              setSelectedGoal(goal);
              setIsSavingsModalOpen(true);
            }}
            onDeleteGoal={handleDeleteGoal}
            onLockApp={() => setIsUnlocked(false)}
            onDeleteTransaction={handleDeleteTransaction}
          />

          {/* Transaction Modal (Add Expense / Income) with Crisp X Icon */}
          <TransactionModal
            isOpen={isTxModalOpen}
            onClose={() => setIsTxModalOpen(false)}
            initialType={txModalType}
            accounts={accounts}
            onAddTransaction={handleAddTransaction}
          />

          {/* Accounts & Wallets Manager Modal with Crisp X Icon */}
          <AccountsManagerModal
            isOpen={isAccountsModalOpen}
            onClose={() => setIsAccountsModalOpen(false)}
            accounts={accounts}
            transactions={transactions}
            onAddAccount={handleAddAccount}
            onDeleteAccount={handleDeleteAccount}
            onEditAccount={handleEditAccount}
          />

          {/* Savings Goal Modal with Crisp X Icon */}
          <SavingsGoalModal
            isOpen={isSavingsModalOpen}
            onClose={() => {
              setIsSavingsModalOpen(false);
              setSelectedGoal(null);
            }}
            accounts={accounts}
            editingGoal={selectedGoal}
            onSaveGoal={handleSaveGoal}
            onAdjustGoal={handleAdjustGoal}
          />

          {/* Settings & Data Control Panel Modal with Crisp X Icon */}
          <SettingsModal
            isOpen={isSettingsModalOpen}
            onClose={() => setIsSettingsModalOpen(false)}
            currentPin={storedPin}
            userName={userName}
            username={username}
            avatar={avatar}
            onUpdateProfile={handleUpdateProfile}
            onUpdateAvatar={handleUpdateAvatar}
            theme={theme}
            onToggleTheme={handleToggleTheme}
            onUpdatePin={handleUpdatePin}
            onExportData={handleExportData}
            onImportData={handleImportData}
            onResetAll={handleResetAll}
          />
        </div>
      );
    }

    // Render Root Application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
