                    <span className="text-xs font-bold block mt-0.5">Semua Akun</span>
                    <span className="text-[11px] font-semibold text-brand mt-1 block">
                      {hideBalance ? '••••' : formatIDR(totalBalance)}
                    </span>
                  </button>

                  {/* Individual Account Cards */}
                  {accounts.map(acc => {
                    const bal = Ledger.getAccountBalance(acc.id, accounts, transactions);
                    const isSelected = selectedAccountId === acc.id;

                    return (
                      <button
                        key={acc.id}
                        type="button"
                        onClick={() => setSelectedAccountId(isSelected ? null : acc.id)}
                        className={`flex-shrink-0 min-w-[130px] p-3 rounded-xl border text-left transition-all ${
                          isSelected
                            ? 'border-brand bg-brand-light text-slate-900 shadow-sm'
                            : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-1">
                          <span className="text-[9px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-medium">
                            {acc.type}
                          </span>
                          <Icon
                            name={acc.type === 'Bank' ? 'bank' : acc.type === 'Cash' ? 'cash' : 'smartphone'}
                            className="w-3.5 h-3.5 text-slate-400"
                          />
                        </div>
                        <span className="text-xs font-bold block truncate">{acc.name}</span>
                        <span className="text-[11px] font-semibold text-slate-900 mt-1 block">
                          {hideBalance ? '••••' : formatIDR(bal)}
                        </span>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Recent Transactions Header & Filters */}
            <div className="pt-2">
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-1.5">
                  <h2 className="text-xs font-bold uppercase tracking-wider text-slate-500">
                    Mutasi Transaksi
                  </h2>
                  {selectedAccountId && (
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-brand-light text-brand font-semibold">
                      {accounts.find(a => a.id === selectedAccountId)?.name}
                    </span>
                  )}
                </div>
                {selectedAccountId && (
                  <button
                    type="button"
                    onClick={() => setSelectedAccountId(null)}
                    className="text-[11px] text-slate-400 hover:text-slate-600"
                  >
                    Reset Filter
                  </button>
                )}
              </div>

              {/* Search and Type Filter Chips */}
              <div className="space-y-2 mb-3">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Cari transaksi atau kategori..."
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:outline-none focus:border-brand focus:bg-white"
                />

                <div className="flex gap-1.5">
                  {[
                    { id: 'ALL', label: 'Semua' },
                    { id: 'EXPENSE', label: 'Pengeluaran' },
                    { id: 'INCOME', label: 'Pemasukan' }
                  ].map(f => (
                    <button
                      key={f.id}
                      type="button"
                      onClick={() => setFilterType(f.id)}
                      className={`px-3 py-1 rounded-lg text-xs font-medium transition-colors ${
                        filterType === f.id
                          ? 'bg-slate-900 text-white'
                          : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                      }`}
                    >
                      {f.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Transactions List */}
              {filteredTransactions.length === 0 ? (
                <div className="p-8 text-center bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                  <div className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center mx-auto mb-2 text-slate-400">
                    <Icon name="tag" className="w-5 h-5" />
                  </div>
                  <p className="text-xs font-semibold text-slate-700">
                    {transactions.length === 0 ? 'Belum ada transaksi' : 'Tidak ada transaksi yang cocok'}
                  </p>
                  <p className="text-[11px] text-slate-400 mt-1 max-w-xs mx-auto">
                    {transactions.length === 0
                      ? 'Catat pengeluaran harian atau pemasukanmu lewat tombol di atas.'
                      : 'Coba ubah kata kunci pencarian atau bersihkan filter.'}
                  </p>
                </div>
              ) : (
                <div className="space-y-2">
                  {filteredTransactions.map(tx => {
                    const catObj = CATEGORIES.find(c => c.id === tx.category);
                    const accObj = accounts.find(a => a.id === tx.accountId);
                    const isExpense = tx.type === 'EXPENSE';

                    return (
                      <div
                        key={tx.id}
                        onClick={() => setDetailTx(tx)}
                        className="p-3 bg-white rounded-xl border border-slate-200 hover:border-slate-300 transition-colors flex items-center justify-between cursor-pointer active:bg-slate-50"
                      >
                        <div className="flex items-center gap-3">
                          <div
                            className={`w-9 h-9 rounded-xl flex items-center justify-center ${
                              isExpense ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-600'
                            }`}
                          >
                            <Icon name={catObj?.icon || 'tag'} className="w-4 h-4" />
                          </div>
                          <div>
                            <span className="text-xs font-bold text-slate-900 block leading-tight">
                              {catObj?.label || 'Transaksi'}
                            </span>
                            <div className="flex items-center gap-1.5 text-[11px] text-slate-400 mt-0.5">
                              <span>{accObj?.name || 'Dompet'}</span>
                              <span>•</span>
                              <span>{formatDateID(tx.date)}</span>
                            </div>
                            {tx.notes && (
                              <p className="text-[11px] text-slate-500 line-clamp-1 mt-0.5">{tx.notes}</p>
                            )}
                          </div>
                        </div>

                        <div className="text-right">
                          <span
                            className={`text-xs font-bold block ${
                              isExpense ? 'text-red-600' : 'text-emerald-600'
                            }`}
                          >
                            {isExpense ? '-' : '+'} {formatIDR(tx.amount)}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </main>

          {/* Transaction Detail & Delete Modal */}
          {detailTx && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/60 p-0 sm:p-4">
              <div className="w-full max-w-sm bg-white rounded-t-2xl sm:rounded-2xl p-5 shadow-xl border border-slate-200">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-sm font-bold text-slate-900">Rincian Transaksi</h3>
                  <button
                    type="button"
                    onClick={() => setDetailTx(null)}
                    className="text-slate-400 hover:text-slate-600 p-1"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <line x1="18" y1="6" x2="6" y2="18"></line>
                      <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                  </button>
                </div>

                <div className="space-y-3 text-xs bg-slate-50 p-4 rounded-xl border border-slate-200 mb-4">
                  <div className="flex justify-between">
                    <span className="text-slate-500">Tipe Mutasi:</span>
                    <span className={`font-bold ${detailTx.type === 'EXPENSE' ? 'text-red-600' : 'text-emerald-600'}`}>
                      {detailTx.type === 'EXPENSE' ? 'Pengeluaran' : 'Pemasukan'}
                    </span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Nominal:</span>
                    <span className="font-bold text-slate-900">{formatIDR(detailTx.amount)}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Kategori:</span>
                    <span className="font-medium text-slate-900">
                      {CATEGORIES.find(c => c.id === detailTx.category)?.label || detailTx.category}
                    </span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Dompet Asal:</span>
                    <span className="font-medium text-slate-900">
                      {accounts.find(a => a.id === detailTx.accountId)?.name || 'Akun'}
                    </span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Tanggal:</span>
                    <span className="font-medium text-slate-900">{formatDateID(detailTx.date)}</span>
                  </div>
                  {detailTx.notes && (
                    <div className="pt-2 border-t border-slate-200">
                      <span className="text-slate-500 block mb-0.5">Catatan:</span>
                      <p className="font-medium text-slate-800 italic">"{detailTx.notes}"</p>
                    </div>
                  )}
                </div>

                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      if (confirm('Hapus transaksi ini? Saldo dompet akan dihitung ulang secara otomatis.')) {
                        onDeleteTransaction(detailTx.id);
                        setDetailTx(null);
                      }
                    }}
                    className="flex-1 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 font-semibold text-xs rounded-xl flex items-center justify-center gap-1.5 transition-colors"
                  >
                    <Icon name="trash" className="w-4 h-4" />
                    Hapus Transaksi
                  </button>
                  <button
                    type="button"
                    onClick={() => setDetailTx(null)}
                    className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-xl transition-colors"
                  >
                    Tutup
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // 9. ROOT APP COMPONENT (COORDINATOR & STATE MANAGER)
    // =========================================================================
    const App = () => {
      // Auth & PIN State
      const [storedPin, setStoredPin] = useState(() => StorageService.getPin());
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [name, setName] = useState(() => StorageService.getName());

      // Financial State
      const [accounts, setAccounts] = useState(() => StorageService.getAccounts());
      const [transactions, setTransactions] = useState(() => StorageService.getTransactions());
      const [hideBalance, setHideBalance] = useState(() => StorageService.getHideBalance());

      // Modals State
      const [isTxModalOpen, setIsTxModalOpen] = useState(false);
      const [txModalType, setTxModalType] = useState('EXPENSE');
      const [isAccountsModalOpen, setIsAccountsModalOpen] = useState(false);
      const [isSettingsModalOpen, setIsSettingsModalOpen] = useState(false);

      // Toast Notification State
      const [toastMsg, setToastMsg] = useState('');

      const showToast = (msg) => {
        setToastMsg(msg);
      };

      // Check on startup if fresh user or returning
      const isFreshUser = !storedPin;

      // Handle Onboarding Completion
      const handleOnboardingComplete = ({ pin, name, accounts, transactions }) => {
        setStoredPin(pin);
        setName(name);
        setAccounts(accounts);
        setTransactions(transactions);
        setIsAuthenticated(true);
        showToast('Akun & PIN berhasil dibuat. Selamat datang!');
      };

      // Handle Adding Transaction (Atomically Updates State & Storage)
      const handleAddTransaction = (newTx) => {
        setTransactions(prev => {
          const updated = [newTx, ...prev];
          StorageService.setTransactions(updated);
          return updated;
        });
        showToast('Transaksi berhasil disimpan');
      };

      // Handle Deleting Transaction
      const handleDeleteTransaction = (txId) => {
        setTransactions(prev => {
          const updated = prev.filter(t => t.id !== txId);
          StorageService.setTransactions(updated);
          return updated;
        });
        showToast('Transaksi berhasil dihapus');
      };

      // Handle Adding Account
      const handleAddAccount = (newAcc) => {
        setAccounts(prev => {
          const updated = [...prev, newAcc];
          StorageService.setAccounts(updated);
          return updated;
        });
        showToast('Akun dompet berhasil ditambahkan');
      };

      // Handle Editing Account
      const handleEditAccount = (accId, updatedFields) => {
        setAccounts(prev => {
          const updated = prev.map(a => (a.id === accId ? { ...a, ...updatedFields } : a));
          StorageService.setAccounts(updated);
          return updated;
        });
        showToast('Akun dompet berhasil diperbarui');
      };

      // Handle Deleting Account & its associated transactions
      const handleDeleteAccount = (accId) => {
        setAccounts(prev => {
          const updatedAccs = prev.filter(a => a.id !== accId);
          StorageService.setAccounts(updatedAccs);
          return updatedAccs;
        });
        setTransactions(prev => {
          const updatedTxs = prev.filter(t => t.accountId !== accId);
          StorageService.setTransactions(updatedTxs);
          return updatedTxs;
        });
        showToast('Akun dompet berhasil dihapus');
      };

      // Toggle Balance Visibility
      const handleToggleHideBalance = () => {
        const next = !hideBalance;
        setHideBalance(next);
        StorageService.setHideBalance(next);
      };

      // Lock App
      const handleLockApp = () => {
        setIsAuthenticated(false);
      };

      // Update PIN
      const handleUpdatePin = (newPin) => {
        StorageService.setPin(newPin);
        setStoredPin(newPin);
      };

      // Update Profile Name
      const handleUpdateName = (newName) => {
        StorageService.setName(newName);
        setName(newName);
      };

      // Import Backup Data
      const handleImportData = (backupData) => {
        if (backupData.name) {
          StorageService.setName(backupData.name);
          setName(backupData.name);
        }
        if (Array.isArray(backupData.accounts)) {
          StorageService.setAccounts(backupData.accounts);
          setAccounts(backupData.accounts);
        }
        if (Array.isArray(backupData.transactions)) {
          StorageService.setTransactions(backupData.transactions);
          setTransactions(backupData.transactions);
        }
      };

      // Reset All Data Permanently
      const handleResetAll = () => {
        StorageService.clearAll();
        setStoredPin(null);
        setName('');
        setAccounts([]);
        setTransactions([]);
        setIsAuthenticated(false);
        setIsSettingsModalOpen(false);
        showToast('Seluruh data berhasil direset');
      };

      // Render Flows:
      // Flow A: Fresh User (Onboarding)
      if (isFreshUser) {
        return (
          <>
            <OnboardingFlow onComplete={handleOnboardingComplete} />
            {toastMsg && <Toast message={toastMsg} onClose={() => setToastMsg('')} />}
          </>
        );
      }

      // Flow B: Returning User (PIN Lock Screen)
      if (!isAuthenticated) {
        return (
          <>
            <ReturningUserPinScreen
              storedPin={storedPin}
              onUnlock={() => setIsAuthenticated(true)}
            />
            {toastMsg && <Toast message={toastMsg} onClose={() => setToastMsg('')} />}
          </>
        );
      }

      // Flow C: Authenticated Main Dashboard
      return (
        <div className="relative">
          <Dashboard
            name={name}
            accounts={accounts}
            transactions={transactions}
            hideBalance={hideBalance}
            onToggleHideBalance={handleToggleHideBalance}
            onLockApp={handleLockApp}
            onOpenSettings={() => setIsSettingsModalOpen(true)}
            onOpenAccountsManager={() => setIsAccountsModalOpen(true)}
            onOpenAddTransaction={(type) => {
              setTxModalType(type);
              setIsTxModalOpen(true);
            }}
            onDeleteTransaction={handleDeleteTransaction}
          />

          {/* Transaction Creation Modal */}
          <TransactionModal
            isOpen={isTxModalOpen}
            onClose={() => setIsTxModalOpen(false)}
            initialType={txModalType}
            accounts={accounts}
            onAddTransaction={handleAddTransaction}
          />

          {/* Accounts & Wallets Manager Modal */}
          <AccountsManagerModal
            isOpen={isAccountsModalOpen}
            onClose={() => setIsAccountsModalOpen(false)}
            accounts={accounts}
            transactions={transactions}
            onAddAccount={handleAddAccount}
            onDeleteAccount={handleDeleteAccount}
            onEditAccount={handleEditAccount}
          />

          {/* Settings & Data Control Modal */}
          <SettingsModal
            isOpen={isSettingsModalOpen}
            onClose={() => setIsSettingsModalOpen(false)}
            storedName={name}
            storedPin={storedPin}
            accounts={accounts}
            transactions={transactions}
            onUpdateName={handleUpdateName}
            onUpdatePin={handleUpdatePin}
            onImportData={handleImportData}
            onResetAll={handleResetAll}
            showToast={showToast}
          />

          {/* Toast Notification */}
          {toastMsg && <Toast message={toastMsg} onClose={() => setToastMsg('')} />}
        </div>
      );
    };

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
