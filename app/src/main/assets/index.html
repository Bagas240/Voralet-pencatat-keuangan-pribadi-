  <!-- Enforce Light Mode as strict default on first launch with Blue & White theme -->
  <script>
    try {
      const savedTheme = localStorage.getItem('voralet_theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
        if (!savedTheme) {
          localStorage.setItem('voralet_theme', 'light');
        }
      }
    } catch (e) {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <style>
    :root {
      --ios-ease: cubic-bezier(0.32, 0.72, 0, 1);
      --ios-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      transition: background-color 300ms ease-in-out, color 300ms ease-in-out;
    }
    html.dark body, body.dark {
      background-color: #0F172A !important;
      color: #F8FAFC !important;
    }
    #root {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #F8FAFC;
      color: #0F172A;
      transition: background-color 300ms ease-in-out, color 300ms ease-in-out;
    }
    html.dark #root {
      background-color: #0F172A !important;
      color: #F8FAFC !important;
    }

    /* iOS Inset Grouped Block */
    .ios-inset-group {
      border-radius: 22px;
      background-color: #FFFFFF;
      padding: 1rem;
      border: 1px solid #E2E8F0;
      box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.05);
      transition: background-color 300ms ease-in-out, border-color 300ms ease-in-out, color 300ms ease-in-out;
    }
    .dark .ios-inset-group {
      background-color: #1E293B !important;
      border-color: #334155 !important;
      box-shadow: none;
      color: #F8FAFC !important;
    }

    /* Hairline Divider */
    .ios-hairline {
      border-bottom: 1px solid #E2E8F0;
      transition: border-color 300ms ease-in-out;
    }
    .dark .ios-hairline {
      border-bottom: 1px solid #334155 !important;
    }

    /* Scrollbar hide */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Tactile Touch Animation */
    .ios-btn-tap, .ios-touch-item, .ios-card-tap {
      transition: transform 0.15s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.15s ease-out;
      will-change: transform;
      user-select: none;
      -webkit-user-select: none;
    }
    .ios-btn-tap:active, .ios-touch-item:active {
      transform: scale3d(0.96, 0.96, 1);
      opacity: 0.86;
    }
    .ios-card-tap:active {
      transform: scale3d(0.98, 0.98, 1);
      opacity: 0.92;
    }

    /* Keypad Button */
    .ios-keypad-btn {
      transition: transform 0.12s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.12s ease-out, background-color 0.15s ease;
      will-change: transform;
    }
    .ios-keypad-btn:active {
      transform: scale3d(0.92, 0.92, 1);
      opacity: 0.78;
    }

    /* iOS Bottom Sheet Animations */
    @keyframes iosSheetEnter {
      0% { transform: translate3d(0, 100%, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    @keyframes iosSheetExit {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(0, 100%, 0); }
    }
    @keyframes iosBackdropFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes iosBackdropFadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
    .animate-ios-sheet {
      animation: iosSheetEnter 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
      will-change: transform;
    }
    .animate-ios-sheet-exit {
      animation: iosSheetExit 0.25s cubic-bezier(0.32, 0.72, 0, 1) forwards;
      will-change: transform;
    }
    .animate-ios-backdrop {
      animation: iosBackdropFadeIn 0.3s cubic-bezier(0.32, 0.72, 0, 1) forwards;
      will-change: opacity;
    }
    .animate-ios-backdrop-exit {
      animation: iosBackdropFadeOut 0.22s cubic-bezier(0.32, 0.72, 0, 1) forwards;
      will-change: opacity;
    }

    /* iOS Page View Transition Animation */
    @keyframes iosTabFadeIn {
      0% {
        opacity: 0;
        transform: translate3d(0, 10px, 0) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }
    .animate-ios-tab-view {
      animation: iosTabFadeIn 0.28s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      will-change: opacity, transform;
    }

    /* iOS Spring Banner Toast */
    @keyframes iosToastSpringDown {
      0% { transform: translate3d(-50%, -100%, 0) scale(0.9); opacity: 0; }
      70% { transform: translate3d(-50%, 8px, 0) scale(1.02); opacity: 1; }
      100% { transform: translate3d(-50%, 0, 0) scale(1); opacity: 1; }
    }
    @keyframes iosToastSpringUp {
      0% { transform: translate3d(-50%, 0, 0) scale(1); opacity: 1; }
      100% { transform: translate3d(-50%, -100%, 0) scale(0.9); opacity: 0; }
    }
    .animate-ios-toast {
      animation: iosToastSpringDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .animate-ios-toast-exit {
      animation: iosToastSpringUp 0.25s cubic-bezier(0.32, 0.72, 0, 1) forwards;
    }

    /* Modal Backdrop & Card */
    .ios-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background-color: rgba(15, 23, 42, 0.65);
      overscroll-behavior: contain;
      padding: 0;
    }
    @media (min-width: 640px) {
      .ios-modal-backdrop {
        align-items: center;
        padding: 1.25rem;
      }
    }
    .ios-modal-card {
      width: 100%;
      max-width: 28rem;
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      border-top-left-radius: 1.5rem;
      border-top-right-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      background-color: #FFFFFF;
      color: #0F172A;
      transition: background-color 300ms ease-in-out, color 300ms ease-in-out;
    }
    .dark .ios-modal-card {
      background-color: #1E293B !important;
      color: #F8FAFC !important;
      border: 1px solid #334155 !important;
    }
    @media (min-width: 640px) {
      .ios-modal-card {
        border-radius: 1.5rem;
        max-height: 85vh;
      }
    }
    .ios-modal-header {
      flex-shrink: 0;
      z-index: 10;
    }
    .ios-modal-body {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding-bottom: 9rem !important;
    }

    /* Popover spring */
    @keyframes popoverSpring {
      0% { transform: scale(0.8); opacity: 0; }
      60% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-popover {
      animation: popoverSpring 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* Shake animation */
    @keyframes shake {
      0%, 100% { transform: translate3d(0, 0, 0); }
      20%, 60% { transform: translate3d(-8px, 0, 0); }
      40%, 80% { transform: translate3d(8px, 0, 0); }
    }
    .animate-shake {
      animation: shake 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97);
      will-change: transform;
    }

    /* iOS PIN Pop and Spring Animations */
    @keyframes iosPinPop {
      0% {
        transform: scale(0.45);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.35);
        opacity: 1;
      }
      75% {
        transform: scale(0.92);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
    .animate-ios-pin-pop {
      animation: iosPinPop 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      will-change: transform, opacity;
    }

    @keyframes iosPinShake {
      0%, 100% { transform: translate3d(0, 0, 0); }
      15%, 45%, 75% { transform: translate3d(-10px, 0, 0); }
      30%, 60%, 90% { transform: translate3d(10px, 0, 0); }
    }
    .animate-ios-pin-shake {
      animation: iosPinShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      will-change: transform;
    }

    .pin-keypad-screen {
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
  </style>
</head>

    // LEDGER ENGINE: Single Source of Truth
    const Ledger = {
      getAccountBalance: (accountId, accounts, transactions) => {
        if (!accountId) return 0;
        const safeAccs = Array.isArray(accounts) ? accounts : [];
        const safeTxs = Array.isArray(transactions) ? transactions : [];
        const acc = safeAccs.find(a => a && a.id === accountId);
        if (!acc) return 0;
        const initial = Number(acc.initialBalance) || 0;
        const sumTx = safeTxs
          .filter(t => t && t.accountId === accountId)
          .reduce((sum, t) => {
            const amt = Number(t.amount) || 0;
            return t.type === 'INCOME' ? sum + amt : sum - amt;
          }, 0);
        return initial + sumTx;
      },
      getTotalBalance: (accounts, transactions) => {
        const safeAccs = Array.isArray(accounts) ? accounts : [];
        const safeTxs = Array.isArray(transactions) ? transactions : [];
        return safeAccs.reduce((tot, a) => {
          if (!a) return tot;
          return tot + Ledger.getAccountBalance(a.id, safeAccs, safeTxs);
        }, 0);
      },
      getSummaryTotals: (transactions, filterAccountId = null) => {
        const safeTxs = Array.isArray(transactions) ? transactions : [];
        const filtered = filterAccountId
          ? safeTxs.filter(t => t && t.accountId === filterAccountId)
          : safeTxs;
        let income = 0;
        let expense = 0;
        for (const t of filtered) {
          if (!t) continue;
          const amt = Number(t.amount) || 0;
          if (t.type === 'INCOME') income += amt;
          else if (t.type === 'EXPENSE') expense += amt;
        }
        return { income, expense, net: income - expense };
      }
    };

    // Client-side image compression
    const compressImage = (file, callback, onError) => {
      if (!file || !file.type.startsWith('image/')) {
        if (onError) onError('File harus berupa gambar');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const maxDim = 200;
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              }
            } else {
              if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            callback(dataUrl);
          } catch (err) {
            if (onError) onError('Gagal memproses gambar');
          }
        };
        img.onerror = () => { if (onError) onError('Gagal memuat gambar'); };
        img.src = e.target.result;
      };
      reader.onerror = () => { if (onError) onError('Gagal membaca file gambar'); };
      reader.readAsDataURL(file);
    };

        const timer2 = setTimeout(() => onClose(), 2700);
        return () => {
          clearTimeout(timer1);
          clearTimeout(timer2);
        };
      }, [onClose]);

      return (
        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[100] px-4 py-2.5 rounded-full bg-slate-900/95 dark:bg-slate-800/95 text-white text-xs font-semibold shadow-xl flex items-center gap-2.5 border border-slate-700/60 select-none ${isLeaving ? 'animate-ios-toast-exit' : 'animate-ios-toast'}`}>
          <span className="w-2 h-2 rounded-full bg-brand shrink-0"></span>
          <span>{message}</span>
        </div>
      );
    };

    // =========================================================================
    // 3. AUTHENTICATION & PIN SECURITY (APPLE HIG LOCK & ONBOARDING)
    // =========================================================================
    const SplashScreen = ({ onFinish }) => {
      const [isFadingOut, setIsFadingOut] = useState(false);

      useEffect(() => {
        const timerHold = setTimeout(() => setIsFadingOut(true), 900);
        const timerDone = setTimeout(() => onFinish(), 1300);
        return () => {
          clearTimeout(timerHold);
          clearTimeout(timerDone);
        };
      }, [onFinish]);

      return (
        <div className={`fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-white dark:bg-black transition-all duration-400 ease-out select-none ${
          isFadingOut ? 'opacity-0 scale-95 pointer-events-none' : 'opacity-100 scale-100'
        }`}>

            <div className="w-20 h-20 rounded-[24px] bg-[#0284C7] text-white flex items-center justify-center shadow-md mb-4">
              <Icon name="wallet" className="w-10 h-10" strokeWidth={2} />
            </div>
            <h1 className="text-2xl font-bold tracking-tight text-[#0F172A] dark:text-white">
              Voralet
            </h1>
            <p className="text-xs text-[#64748B] dark:text-zinc-400 mt-1 font-medium">
              Keuangan Sehat • Impian Dekat
            </p>
          </div>
        </div>
      );
    };

    const PinDots = ({ count = 6, filled = 0, isError = false }) => {
      return (
        <div className={`flex justify-center items-center gap-4 my-6 select-none ${isError ? 'animate-ios-pin-shake' : ''}`}>
          {Array.from({ length: count }).map((_, idx) => {
            const isFilled = idx < filled;
            const isLatest = idx === filled - 1;
            return (
              <div
                key={idx}
                className={`relative w-4 h-4 rounded-full flex items-center justify-center transition-all duration-200 ${
                  isError
                    ? 'border-2 border-rose-500 bg-rose-500/10 scale-105'
                    : isFilled
                      ? 'border-2 border-[#0284C7] dark:border-[#38BDF8] bg-transparent'
                      : 'border-2 border-slate-300 dark:border-slate-700 bg-slate-100/90 dark:bg-slate-800'
                }`}
              >
                {isFilled && (
                  <div
                    className={`w-2.5 h-2.5 rounded-full transition-all duration-200 ${
                      isError
                        ? 'bg-rose-500'
                        : 'bg-[#0284C7] dark:bg-[#38BDF8]'
                    } ${isLatest && !isError ? 'animate-ios-pin-pop' : ''}`}
                  />

              </div>

        </div>

    };

    const Keypad = ({ onKeyPress, onBackspace }) => {
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'back'];

      return (
        <div className="grid grid-cols-3 gap-3.5 w-full max-w-xs mx-auto mt-2 select-none">
          {keys.map((k, i) => {
            if (k === '') return <div key={i} className="h-14" />;
            if (k === 'back') {
              return (
                <button
                  key={i}
                  type="button"
                  onClick={onBackspace}
                  className="h-14 rounded-2xl flex items-center justify-center text-slate-600 dark:text-[#94A3B8] hover:bg-slate-100 dark:hover:bg-[#1E293B] active:bg-slate-200 dark:active:bg-[#334155] transition-colors ios-keypad-btn"
                  aria-label="Hapus"
                >
                  <Icon name="backspace" className="w-6 h-6" strokeWidth={1.8} />
                </button>
              );
            }
            return (
              <button
                key={i}
                type="button"
                onClick={() => onKeyPress(k)}
                className="h-14 rounded-2xl flex items-center justify-center text-xl font-semibold text-[#0F172A] dark:text-[#F8FAFC] bg-white dark:bg-[#1E293B] border border-slate-200 dark:border-[#334155] hover:bg-slate-50 dark:hover:bg-[#273549] transition-colors shadow-sm ios-keypad-btn"
              >
                {k}
              </button>
            );
          })}
        </div>
      );
    };

    // Forgot PIN Modal: Verifies username offline to reset PIN without deleting ledger history!
    const ForgotPinModal = ({ storedUsername, storedName, onClose, onResetPin }) => {
      const [step, setStep] = useState(1);
      const [inputUsername, setInputUsername] = useState('');
      const [verifyError, setVerifyError] = useState('');
      const [newPin, setNewPin] = useState('');
      const [confirmPin, setConfirmPin] = useState('');
      const [pinError, setPinError] = useState('');
      const [isClosing, setIsClosing] = useState(false);

      const handleClose = () => {
        setIsClosing(true);
        setTimeout(() => {
          setIsClosing(false);
          onClose();
        }, 220);
      };

      const handleVerifyUsername = (e) => {
        e.preventDefault();
        const trimmedInput = inputUsername.trim().toLowerCase().replace(/^@/, '');
        const targetUsername = (storedUsername || '').trim().toLowerCase();
        const targetName = (storedName || '').trim().toLowerCase();

        if (!trimmedInput) {
          setVerifyError('Harap masukkan username terdaftar');
          return;
        }

        const isMatch = targetUsername ? (trimmedInput === targetUsername) : (trimmedInput === targetName);
        if (isMatch) {
          setVerifyError('');
          setStep(2);
        } else {
          setVerifyError('Username tidak cocok dengan brankas akun Voralet.');
        }
      };

      const handleSaveNewPin = (e) => {
        e.preventDefault();
        if (newPin.length !== 6 || !/^\d{6}$/.test(newPin)) {
          setPinError('PIN harus berupa 6 angka');
          return;
        }
        if (newPin !== confirmPin) {
          setPinError('Konfirmasi PIN tidak cocok');
          return;
        }
        onResetPin(newPin);
      };

      return (
        <div className={`ios-modal-backdrop ${isClosing ? 'animate-ios-backdrop-exit' : 'animate-ios-backdrop'}`}
             onClick={(e) => { if (e.target === e.currentTarget) handleClose(); }}>
          <div className={`ios-modal-card bg-white dark:bg-[#121212] border border-slate-200 dark:border-[#27272A] p-5 ${isClosing ? 'animate-ios-sheet-exit' : 'animate-ios-sheet'}`}>
            <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-[#27272A]">
              <div className="flex items-center gap-2">
                <IconBadge icon="lock" className="p-2 rounded-xl bg-sky-100 dark:bg-[#1C1C1E] text-brand dark:text-sky-400" />
                <h3 className="text-sm font-bold text-slate-900 dark:text-white">
                  {step === 1 ? 'Verifikasi Lupa PIN' : 'Buat PIN Baru'}
                </h3>
              </div>
              <button
                type="button"
                onClick={handleClose}
                className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-zinc-200 rounded-full hover:bg-slate-100 dark:hover:bg-[#1E1E1E] transition-colors ios-btn-tap"
                aria-label="Tutup"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>

            {step === 1 ? (
              <form onSubmit={handleVerifyUsername} className="pt-4 space-y-4">
                <p className="text-xs text-slate-500 dark:text-zinc-400 leading-relaxed">
                  Untuk keamanan offline, masukkan <strong>Username (@id)</strong> akun Voralet kamu. Data mutasi keuangan kamu tetap aman dan tidak akan terhapus.
                </p>
                <div>
                  <label className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-zinc-400 block mb-1">
                    Username Akun (@id)
                  </label>
                  <div className="relative">
                    <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs font-mono font-bold">@</span>
                    <input
                      type="text"
                      value={inputUsername}
                      onFocus={handleGlobalInputFocus}
                      onBlur={handleGlobalInputBlur}
                      onChange={(e) => {
                        setInputUsername(e.target.value);
                        setVerifyError('');
                      }}
                      placeholder="username_kamu"
                      className="w-full pl-8 pr-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-[#27272A] bg-slate-50 dark:bg-[#181818] text-slate-900 dark:text-white text-xs font-mono focus:outline-none focus:border-brand dark:focus:border-sky-400 transition-colors"
                      autoFocus
                    />
                  </div>
                  {verifyError && (
                    <p className="text-[11px] text-rose-500 font-semibold mt-1">{verifyError}</p>
                  )}
                </div>
                <div className="flex gap-2 pt-2">
                  <button
                    type="button"
                    onClick={handleClose}
                    className="flex-1 py-2.5 bg-slate-100 dark:bg-[#1E1E1E] text-slate-700 dark:text-zinc-300 text-xs font-semibold rounded-xl ios-btn-tap"
                  >
                    Batal
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2.5 bg-brand text-white text-xs font-semibold rounded-xl hover:bg-brand-hover transition-colors ios-btn-tap"
                  >
                    Verifikasi
                  </button>
                </div>
              </form>
            ) : (
              <form onSubmit={handleSaveNewPin} className="pt-4 space-y-4">
                <p className="text-xs text-slate-500 dark:text-zinc-400 leading-relaxed">
                  Identitas terverifikasi! Masukkan 6-digit PIN baru untuk brankas Voralet kamu.
                </p>
                <div>
                  <label className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-zinc-400 block mb-1">
                    6-Digit PIN Baru
                  </label>
                  <input
                    type="password"
                    maxLength={6}
                    inputMode="numeric"
                    pattern="[0-9]*"
                    value={newPin}
                    onFocus={handleGlobalInputFocus}
                    onBlur={handleGlobalInputBlur}
                    onChange={(e) => {
                      const val = e.target.value.replace(/\D/g, '').slice(0, 6);
                      setNewPin(val);
                      setPinError('');
                    }}
                    placeholder="••••••"
                    className="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-300 dark:border-zinc-700 bg-white dark:bg-[#181818] text-slate-900 dark:text-white text-center tracking-widest text-sm font-bold focus:outline-none focus:border-brand dark:focus:border-sky-400 transition-colors"
                    autoFocus
                  />
                </div>
                <div>
                  <label className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-zinc-400 block mb-1">
                    Konfirmasi PIN Baru
                  </label>
                  <input
                    type="password"
                    maxLength={6}
                    inputMode="numeric"
                    pattern="[0-9]*"
                    value={confirmPin}
                    onFocus={handleGlobalInputFocus}
                    onBlur={handleGlobalInputBlur}
                    onChange={(e) => {
                      const val = e.target.value.replace(/\D/g, '').slice(0, 6);
                      setConfirmPin(val);
                      setPinError('');
                    }}
                    placeholder="••••••"
                    className="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-300 dark:border-zinc-700 bg-white dark:bg-[#181818] text-slate-900 dark:text-white text-center tracking-widest text-sm font-bold focus:outline-none focus:border-brand dark:focus:border-sky-400 transition-colors"
                  />
                  {pinError && (
                    <p className="text-[11px] text-rose-500 font-semibold mt-1">{pinError}</p>
                  )}
                </div>
                <div className="flex gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setStep(1)}
                    className="flex-1 py-2.5 bg-slate-100 dark:bg-[#1E1E1E] text-slate-700 dark:text-zinc-300 text-xs font-semibold rounded-xl ios-btn-tap"
                  >
                    Kembali
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2.5 bg-brand text-white text-xs font-semibold rounded-xl hover:bg-brand-hover transition-colors ios-btn-tap"
                  >
                    Simpan PIN
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    };

    const ReturningUserPinScreen = ({ storedPin, userName, username, avatar, theme, onToggleTheme, onUnlock, onResetPin }) => {
      const [pin, setPin] = useState('');
      const [error, setError] = useState(false);
      const [isForgotModalOpen, setIsForgotModalOpen] = useState(false);

      const handlePress = (digit) => {
        if (pin.length < 6) {
          const next = pin + digit;
          setPin(next);
          setError(false);

          if (next.length === 6) {
            if (next === storedPin) {
              setTimeout(() => onUnlock(), 120);
            } else {
              setError(true);
              setTimeout(() => setPin(''), 400);
            }
          }
        }
      };

      const handleBackspace = () => {
        setPin(prev => prev.slice(0, -1));
        setError(false);
      };

      return (
        <div className="pin-keypad-screen flex flex-col justify-between p-6 bg-white dark:bg-[#0F172A] max-w-md mx-auto transition-colors duration-300 ease-in-out">
          <div>
            <div className="flex items-center justify-between pt-2">
              <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#E0F2FE] dark:bg-[#1E293B] border border-[#BAE6FD] dark:border-[#334155] text-[#0284C7] dark:text-[#38BDF8] text-xs font-bold">
                <Icon name="wallet" className="w-4 h-4" />
                <span>Voralet</span>
              </div>
              <button
                type="button"
                onClick={onToggleTheme}

                aria-label="Mode Gelap / Terang"
              >
                <Icon name={theme === 'dark' ? 'sun' : 'moon'} className="w-5 h-5" />
              </button>
            </div>

            <div className="pt-8 text-center flex flex-col items-center">
              {avatar ? (
                <div className="mb-3">
                  <Avatar avatar={avatar} name={userName} size="w-16 h-16" textSize="text-xl" />
                </div>
              ) : (
                <div className="w-16 h-16 rounded-[22px] bg-[#F0F9FF] dark:bg-[#1E293B] border border-[#E0F2FE] dark:border-[#334155] flex items-center justify-center mb-3 text-[#0284C7] dark:text-[#38BDF8]">
                  <Icon name="lock" className="w-7 h-7" strokeWidth={1.8} />
                </div>
              )}
              <h1 className="text-xl font-bold text-[#0F172A] dark:text-[#F8FAFC]">
                {userName ? `Hai, ${userName}` : 'Kunci Brankas'}
              </h1>
              {username && (
                <p className="text-xs font-mono text-[#0284C7] dark:text-[#38BDF8] font-semibold mt-0.5">@{username}</p>
              )}
              <p className="text-xs text-[#64748B] dark:text-[#94A3B8] mt-1">Masukkan 6-digit PIN untuk akses brankas</p>

              <PinDots count={6} filled={pin.length} isError={error} />
              {error && (
                <p className="text-xs font-semibold text-rose-500">PIN salah. Silakan coba kembali.</p>
              )}
            </div>
          </div>

          <div className="pb-8">
            <Keypad onKeyPress={handlePress} onBackspace={handleBackspace} />
            <div className="mt-4 text-center">
              <button
                type="button"
                onClick={() => setIsForgotModalOpen(true)}
                className="text-xs font-medium text-[#64748B] hover:text-[#0284C7] dark:text-[#94A3B8] dark:hover:text-[#38BDF8] transition-colors py-1 px-3"
              >
                Lupa PIN?
              </button>
            </div>
          </div>

          {isForgotModalOpen && (
            <ForgotPinModal
              storedUsername={username}
              storedName={userName}
              onClose={() => setIsForgotModalOpen(false)}
              onResetPin={(newPin) => {
                onResetPin(newPin);
                setIsForgotModalOpen(false);
                setPin('');
              }}
            />
          )}
        </div>
      );
    };

    const OnboardingFlow = ({ onComplete }) => {
      const [onboardingStep, setOnboardingStep] = useState(1);
      const [newPin, setNewPin] = useState('');
      const [pinError, setPinError] = useState('');

      const [name, setName] = useState('');
      const [username, setUsername] = useState('');
      const [avatar, setAvatar] = useState('');
      const [identityError, setIdentityError] = useState('');

      const [walletName, setWalletName] = useState('BCA Utama');
      const [walletType, setWalletType] = useState('Bank'); // Tunai | Bank | E-Wallet
      const [initialBalance, setInitialBalance] = useState('');

      // STEP 1 PIN Handlers
      const handleDigitPress = (digit) => {
        if (newPin.length < 6) {
          const next = newPin + digit;
          setNewPin(next);
          setPinError('');
        }
      };

      const handleBackspace = () => {
        setNewPin(prev => prev.slice(0, -1));
        setPinError('');
      };

      const handleStep1Next = () => {
        if (newPin.length !== 6) {
          setPinError('PIN harus terdiri dari 6 digit angka');
          return;
        }
        setPinError('');
        setOnboardingStep(2);
      };

      // STEP 2 PROFILE HANDLER
      const handleStep2Next = (e) => {
        e?.preventDefault();
        const trimmedName = name.trim();
        if (!trimmedName) {
          setIdentityError('Harap masukkan nama panggilan');
          return;
        }
        let cleanUsername = username.trim().toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_]/g, '');
        if (!cleanUsername) {
          cleanUsername = trimmedName.toLowerCase().replace(/[^a-z0-9_]/g, '') || 'voralet_user';
          setUsername(cleanUsername);
        }
        setIdentityError('');
        setOnboardingStep(3);
      };

      // STEP 3 FINISH ONBOARDING
      const handleFinishOnboarding = (e) => {
        e?.preventDefault();
        const trimmedName = name.trim() || 'Sahabat Voralet';
        const cleanUsername = (username.trim().toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_]/g, '') || trimmedName.toLowerCase().replace(/[^a-z0-9_]/g, '') || 'voralet_user');
        const rawBalance = parseRawNumber(initialBalance);
        const trimmedWallet = walletName.trim() || 'BCA Utama';

        const firstAccount = {
          id: 'acc_' + Date.now(),
          name: trimmedWallet,
          type: walletType,
          initialBalance: rawBalance,
          createdAt: new Date().toISOString()
        };

        StorageService.setPin(newPin);
        StorageService.setName(trimmedName);
        StorageService.setUsername(cleanUsername);
        if (avatar) StorageService.setAvatar(avatar);
        StorageService.setAccounts([firstAccount]);
        StorageService.setTransactions([]);
        StorageService.setSavingsGoals([]);
        StorageService.setDebts([]);

        onComplete({
          pin: newPin,
          name: trimmedName,
          username: cleanUsername,
          avatar: avatar,
          accounts: [firstAccount],
          transactions: [],
          savingsGoals: [],
          debts: []
        });
      };

      return (
        <div className="min-h-[100dvh] w-full flex flex-col justify-between p-6 bg-white dark:bg-[#0F172A] max-w-md mx-auto transition-colors duration-300 ease-in-out text-[#0F172A] dark:text-[#F8FAFC]">
          {/* STEP 1: Buat 6-Digit PIN Security */}
          {onboardingStep === 1 && (
            <div className="pin-keypad-screen flex flex-col justify-between w-full">
              <div className="pt-6 text-center">
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#E0F2FE] dark:bg-[#1E293B] border border-[#BAE6FD] dark:border-[#334155] text-[#0284C7] dark:text-[#38BDF8] text-xs font-bold mb-4">
                  <span>Langkah 1 dari 3</span>
                </div>
                <div className="w-16 h-16 rounded-[22px] bg-[#F0F9FF] dark:bg-[#1E293B] border border-[#E0F2FE] dark:border-[#334155] flex items-center justify-center mx-auto mb-3 text-[#0284C7] dark:text-[#38BDF8]">
                  <Icon name="lock" className="w-7 h-7" strokeWidth={1.8} />
                </div>
                <h1 className="text-xl font-bold text-[#0F172A] dark:text-[#F8FAFC]">
                  Buat 6-Digit PIN Security
                </h1>
                <p className="text-xs text-[#64748B] dark:text-[#94A3B8] mt-1">
                  PIN digunakan untuk mengamankan brankas lokal kamu
                </p>

                <PinDots
                  count={6}
                  filled={newPin.length}
                  isError={Boolean(pinError)}
                />

                {pinError && (
                  <p className="text-xs font-semibold text-rose-500 mt-2">{pinError}</p>
                )}
              </div>

              <div className="pb-4 space-y-4">
                <Keypad
                  onKeyPress={handleDigitPress}
                  onBackspace={handleBackspace}
                />
                <button
                  type="button"
                  onClick={handleStep1Next}
                  disabled={newPin.length < 6}
                  className={`w-full py-3.5 rounded-xl font-bold text-sm transition-all ios-btn-tap ${
                    newPin.length === 6
                      ? 'bg-[#0284C7] hover:bg-[#0369A1] text-white shadow-sm cursor-pointer'
                      : 'bg-slate-100 dark:bg-[#1E293B] border border-transparent dark:border-[#334155] text-[#64748B] dark:text-[#94A3B8] opacity-60 cursor-not-allowed'
                  }`}
                >
                  Lanjut
                </button>
              </div>
            </div>
          )}

          {/* STEP 2: Atur Profil Kamu */}
          {onboardingStep === 2 && (
            <div className="flex-1 flex flex-col justify-between w-full py-4 overflow-y-auto no-scrollbar">
              <div className="pt-4">
                <div className="text-center mb-6">
                  <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#E0F2FE] dark:bg-[#1E293B] border border-[#BAE6FD] dark:border-[#334155] text-[#0284C7] dark:text-[#38BDF8] text-xs font-bold mb-3">
                    <span>Langkah 2 dari 3</span>
                  </div>
                  <h1 className="text-xl font-bold text-[#0F172A] dark:text-[#F8FAFC]">Atur Profil Kamu</h1>
                  <p className="text-xs text-[#64748B] dark:text-[#94A3B8] mt-1">
                    Atur nama dan username untuk brankas keuanganmu
                  </p>
                </div>

                <div className="flex flex-col items-center mb-6">
                  <div className="relative">
                    <Avatar avatar={avatar} name={name} size="w-20 h-20" textSize="text-2xl" />
                    <label
                      htmlFor="onboarding-avatar-upload"
                      className="absolute bottom-0 right-0 w-7 h-7 bg-[#0284C7] text-white rounded-full flex items-center justify-center cursor-pointer shadow hover:bg-[#0369A1] transition-colors ios-btn-tap"
                      title="Unggah Foto Profil"
                    >
                      <Icon name="camera" className="w-4 h-4" />
                    </label>
                    <input

          {/* STEP 3: Setup Dompet Pertama */}

                <form id="step3-form" onSubmit={handleFinishOnboarding} className="space-y-4 ios-inset-group bg-[#F0F9FF] dark:bg-[#1E293B] border border-[#E0F2FE] dark:border-[#334155] rounded-[22px] p-4">
                  {/* Field 1: Nama Dompet */}
                  <div>
                    <label className="block text-xs font-semibold text-[#0F172A] dark:text-[#F8FAFC] mb-1.5">

    // =========================================================================
    // 4. SAFE-TO-SPEND, QUICK SHORTCUTS & FINANCIAL MILESTONES
    // =========================================================================
    const SafeToSpendCard = ({ accounts, transactions, hideBalance, onSetBudget, safeBudget }) => {
      const [isEditingBudget, setIsEditingBudget] = useState(false);
      const [budgetInput, setBudgetInput] = useState('');

      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const currentDay = now.getDate();
      const daysRemaining = Math.max(1, totalDays - currentDay + 1);

      const totalLiquid = Ledger.getTotalBalance(accounts, transactions);
      const currentMonthTotals = useMemo(() => {
        const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
        const thisMonthTx = (transactions || []).filter(t => t && t.date && t.date.startsWith(monthPrefix));
        return Ledger.getSummaryTotals(thisMonthTx);
      }, [transactions, year, month]);

      const effectiveBudget = safeBudget > 0 ? safeBudget : totalLiquid;
      const spentThisMonth = currentMonthTotals.expense;
      const remainingMonthBudget = Math.max(0, safeBudget > 0 ? (safeBudget - spentThisMonth) : totalLiquid);
      const dailyAllowance = Math.floor(remainingMonthBudget / daysRemaining);

      const handleSaveBudget = (e) => {
        e.preventDefault();
        const num = parseRawNumber(budgetInput);
        onSetBudget(num);
        setIsEditingBudget(false);
      };

      return (
        <div className="ios-inset-group mb-4">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-2">
              <IconBadge icon="shield-check" className="p-1.5 rounded-xl bg-sky-100 dark:bg-slate-700 text-brand dark:text-sky-400" iconClass="w-4 h-4" />
              <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                Safe-to-Spend Harian
              </span>
            </div>
            <button
              type="button"
              onClick={() => {
                setBudgetInput(safeBudget ? String(safeBudget) : '');
                setIsEditingBudget(true);
              }}
              className="text-[11px] font-semibold text-brand dark:text-sky-400 hover:underline flex items-center gap-1 ios-btn-tap"
            >
              <Icon name="edit" className="w-3 h-3" />
              <span>{safeBudget > 0 ? 'Atur Limit' : 'Pasang Limit'}</span>
            </button>
          </div>

          <div className="flex items-baseline justify-between mt-1">
            <div>
              <div className="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                {hideBalance ? 'Rp ••••••' : formatIDR(dailyAllowance)}
                <span className="text-xs font-normal text-slate-400 dark:text-slate-500 ml-1">/ hari</span>
              </div>
              <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">
                Sisa {daysRemaining} hari di bulan ini • Sisa dana {hideBalance ? 'Rp ••••••' : formatIDR(remainingMonthBudget)}
              </p>
            </div>
            <div className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
              dailyAllowance > 50000 ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 border border-emerald-200/50' : 'bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400 border border-amber-200/50'
            }`}>
              {dailyAllowance > 50000 ? 'Aman' : 'Hemat'}
            </div>
          </div>

          {isEditingBudget && (
            <form onSubmit={handleSaveBudget} className="mt-3 pt-3 border-t border-slate-100 dark:border-slate-700 flex gap-2">
              <input
                type="text"
                inputMode="numeric"
                value={budgetInput ? formatIDR(parseRawNumber(budgetInput)) : ''}
                onFocus={handleGlobalInputFocus}
                onBlur={handleGlobalInputBlur}
                onChange={(e) => setBudgetInput(parseRawNumber(e.target.value).toString())}
                placeholder="Limit belanja bulanan (Rp)"
                className="flex-1 px-3 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-medium text-slate-900 dark:text-white focus:outline-none focus:border-brand"
                autoFocus
              />
              <button
                type="submit"
                className="px-3 py-1.5 bg-brand text-white text-xs font-semibold rounded-xl hover:bg-brand-hover ios-btn-tap"
              >
                Simpan
              </button>
              <button
                type="button"
                onClick={() => setIsEditingBudget(false)}
                className="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs font-medium rounded-xl ios-btn-tap"
              >
                Batal
              </button>
            </form>
          )}
        </div>
      );
    };

    // Quick Expense Presets
    const QuickExpenseBar = ({ onSelectQuickExpense }) => {
      const presets = [
        { label: 'Kopi', amount: 25000, category: 'makan', icon: 'food' },
        { label: 'Makan', amount: 35000, category: 'makan', icon: 'food' },
        { label: 'Bensin', amount: 50000, category: 'transport', icon: 'transport' },
        { label: 'Harian', amount: 100000, category: 'belanja', icon: 'shopping' }
      ];

      return (
        <div className="mb-4">
          <div className="flex items-center justify-between mb-2 px-1">
            <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
              Pintas Cepat
            </span>
            <span className="text-[10px] text-slate-400">1-Tap Catat</span>
          </div>
          <div className="grid grid-cols-4 gap-2">
            {presets.map((p, idx) => (
              <button
                key={idx}
                type="button"
                onClick={() => onSelectQuickExpense(p)}
                className="p-2.5 rounded-[18px] bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700/60 shadow-sm flex flex-col items-center text-center ios-btn-tap hover:border-brand/40 transition-all"
              >
                <div className="w-8 h-8 rounded-xl bg-sky-50 dark:bg-slate-700 text-brand dark:text-sky-400 flex items-center justify-center mb-1">
                  <Icon name={p.icon} className="w-4 h-4" />
                </div>
                <span className="text-xs font-bold text-slate-800 dark:text-slate-200">{p.label}</span>
                <span className="text-[10px] text-slate-400 font-medium">Rp {p.amount / 1000}rb</span>
              </button>
            ))}
          </div>
        </div>
      );
    };

    // Financial Milestones & Achievement Badges
    const MilestonesCard = ({ transactions, savingsGoals, debts, totalBalance }) => {
      const [isOpen, setIsOpen] = useState(false);

      const milestones = useMemo(() => {
        const txCount = (transactions || []).length;
        const activeGoalsCount = (savingsGoals || []).length;
        const unpaidDebts = (debts || []).filter(d => d.status !== 'LUNAS' && d.type === 'HUTANG').length;

        return [
          {
            id: 'first_tx',
            title: 'Pencatat Aktif',
            desc: 'Catat minimal 5 mutasi',
            icon: 'award',
            unlocked: txCount >= 5,
            progress: `${Math.min(txCount, 5)}/5`
          },
          {
            id: 'discipline',
            title: 'Disiplin Keuangan',
            desc: 'Catat 15 mutasi keuangan',
            icon: 'shield-check',
            unlocked: txCount >= 15,
            progress: `${Math.min(txCount, 15)}/15`
          },
          {
            id: 'dreamer',
            title: 'Pemburu Impian',
            desc: 'Buat target kantong impian',
            icon: 'target',
            unlocked: activeGoalsCount >= 1,
            progress: `${Math.min(activeGoalsCount, 1)}/1`
          },
          {
            id: 'debt_free',
            title: 'Bebas Beban Hutang',
            desc: 'Nol hutang belum lunas',
            icon: 'check-circle',
            unlocked: unpaidDebts === 0 && (debts || []).length > 0,
            progress: unpaidDebts === 0 ? 'Lunas' : `${unpaidDebts} Hutang`
          },
          {
            id: 'wealth',
            title: 'Sultan Muda',
            desc: 'Total saldo > Rp 1.000.000',
            icon: 'zap',
            unlocked: totalBalance >= 1000000,
            progress: totalBalance >= 1000000 ? 'Tercapai' : `${Math.floor((totalBalance / 1000000) * 100)}%`
          }
        ];
      }, [transactions, savingsGoals, debts, totalBalance]);

      const unlockedCount = milestones.filter(m => m.unlocked).length;

      return (
        <div className="ios-inset-group mb-4">
          <div
            className="flex items-center justify-between cursor-pointer ios-touch-item"
            onClick={() => setIsOpen(prev => !prev)}
          >
            <div className="flex items-center gap-2">
              <IconBadge icon="award" className="p-1.5 rounded-xl bg-amber-50 dark:bg-slate-700 text-amber-500" iconClass="w-4 h-4" />
              <div>
                <h3 className="text-xs font-bold text-slate-900 dark:text-white">Milestone Keuangan</h3>
                <p className="text-[11px] text-slate-500 dark:text-slate-400">
                  {unlockedCount} dari {milestones.length} lencana tercapai
                </p>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <div className="w-16 h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                <div
                  className="h-full bg-brand transition-all duration-300"
                  style={{ width: `${(unlockedCount / milestones.length) * 100}%` }}
                />
              </div>
              <span className="text-xs font-bold text-brand">{Math.round((unlockedCount / milestones.length) * 100)}%</span>
            </div>
          </div>

          {isOpen && (
            <div className="mt-3 pt-3 border-t border-slate-100 dark:border-slate-700 space-y-2">
              {milestones.map(m => (
                <div
                  key={m.id}
                  className={`p-2.5 rounded-xl flex items-center justify-between ${
                    m.unlocked
                      ? 'bg-sky-50 dark:bg-slate-700/60 border border-sky-100 dark:border-slate-700'
                      : 'bg-slate-50 dark:bg-slate-900/50 border border-slate-100 dark:border-slate-800 opacity-70'
                  }`}
                >
                  <div className="flex items-center gap-2.5">
                    <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${
                      m.unlocked ? 'bg-brand text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-400'
                    }`}>
                      <Icon name={m.icon} className="w-4 h-4" />
                    </div>
                    <div>
                      <h4 className="text-xs font-bold text-slate-900 dark:text-white leading-tight">{m.title}</h4>
                      <p className="text-[10px] text-slate-500 dark:text-slate-400">{m.desc}</p>
                    </div>
                  </div>
                  <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${
                    m.unlocked ? 'bg-sky-100 dark:bg-slate-600 text-brand dark:text-sky-300' : 'bg-slate-200 dark:bg-slate-700 text-slate-500'
                  }`}>
                    {m.progress}
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // 5. DEBT & LOAN TRACKER (HUTANG & PIUTANG VIEW + MODAL)
    // =========================================================================
    const DebtModal = ({ isOpen, onClose, debtToEdit, onSaveDebt }) => {
      const [type, setType] = useState('HUTANG'); // HUTANG (Saya berhutang) | PIUTANG (Orang lain berhutang)
      const [personName, setPersonName] = useState('');
      const [amountStr, setAmountStr] = useState('');
      const [dueDate, setDueDate] = useState('');
      const [notes, setNotes] = useState('');
      const [isClosing, setIsClosing] = useState(false);

      useEffect(() => {
        if (debtToEdit) {
          setType(debtToEdit.type || 'HUTANG');
          setPersonName(debtToEdit.personName || '');
          setAmountStr(debtToEdit.amount ? String(debtToEdit.amount) : '');
          setDueDate(debtToEdit.dueDate || '');
          setNotes(debtToEdit.notes || '');
        } else {
          setType('HUTANG');
          setPersonName('');
          setAmountStr('');
          setDueDate('');
          setNotes('');
        }
      }, [debtToEdit, isOpen]);

      if (!isOpen) return null;

      const handleClose = () => {
        setIsClosing(true);
        setTimeout(() => {
          setIsClosing(false);
          onClose();
        }, 220);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const rawAmt = parseRawNumber(amountStr);
        if (!personName.trim() || rawAmt <= 0) return;

        const debtData = {
          id: debtToEdit ? debtToEdit.id : ('debt_' + Date.now()),
          type,
          personName: personName.trim(),
          amount: rawAmt,
          dueDate: dueDate || '',
          notes: notes.trim(),
          status: debtToEdit ? debtToEdit.status : 'BELUM_LUNAS',
          createdAt: debtToEdit ? debtToEdit.createdAt : new Date().toISOString()
        };

        onSaveDebt(debtData);
        handleClose();
      };

      return (
        <div className={`ios-modal-backdrop ${isClosing ? 'animate-ios-backdrop-exit' : 'animate-ios-backdrop'}`}
             onClick={(e) => { if (e.target === e.currentTarget) handleClose(); }}>
          <div className={`ios-modal-card bg-white dark:bg-slate-800 ${isClosing ? 'animate-ios-sheet-exit' : 'animate-ios-sheet'}`}>
            <div className="ios-modal-header px-5 py-4 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between bg-white dark:bg-slate-800">
              <h2 className="text-base font-bold text-slate-900 dark:text-white">
                {debtToEdit ? 'Edit Catatan' : 'Catat Hutang / Piutang'}
              </h2>
              <button
                type="button"
                onClick={handleClose}
                className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors ios-btn-tap"
                aria-label="Tutup"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>

    const DebtsView = ({ debts, onAddDebt, onToggleStatus, onDeleteDebt, hideBalance, onEditDebt }) => {

    // =========================================================================
    // 6. CORE MODALS (TRANSACTION, ACCOUNTS, SAVINGS, SETTINGS)

    const TransactionModal = ({ isOpen, onClose, initialData, accounts, onAddTransaction }) => {
      const [type, setType] = useState('EXPENSE');
      const [amountStr, setAmountStr] = useState('');
      const [accountId, setAccountId] = useState(accounts[0]?.id || '');
      const [category, setCategory] = useState(CATEGORIES[0].id);
      const [date, setDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [notes, setNotes] = useState('');
      const [error, setError] = useState('');
      const [isClosing, setIsClosing] = useState(false);

      const handleClose = () => {
        setIsClosing(true);
        setTimeout(() => {
          setIsClosing(false);
          onClose();
        }, 220);
      };

      useEffect(() => {
        if (initialData) {
          setType(initialData.type || 'EXPENSE');
          setAmountStr(initialData.amount ? String(initialData.amount) : '');
          setCategory(initialData.category || CATEGORIES[0].id);
          setNotes(initialData.notes || '');
          if (initialData.accountId) setAccountId(initialData.accountId);
        } else {
          setType('EXPENSE');
          setAmountStr('');
          setCategory(CATEGORIES[0].id);
          setNotes('');
        }
        if (accounts.length > 0 && !accounts.some(a => a.id === accountId)) {
          setAccountId(accounts[0].id);
        }
      }, [initialData, accounts, isOpen]);

      if (!isOpen) return null;

      const filteredCategories = CATEGORIES.filter(c => c.type === 'ALL' || c.type === type);

      const handleQuickAdd = (value) => {
        const current = parseRawNumber(amountStr);
        setAmountStr((current + value).toString());
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const rawAmount = parseRawNumber(amountStr);
        if (rawAmount <= 0) {
          setError('Nominal harus lebih dari 0');
          return;
        }
        if (!accountId) {
          setError('Pilih dompet terlebih dahulu');
          return;
        }

        const newTx = {
          id: 'tx_' + Date.now(),
          accountId,
          type,
          amount: rawAmount,
          category,
          date,
          notes: notes.trim(),
          createdAt: new Date().toISOString()
        };

        onAddTransaction(newTx);
        handleClose();
      };

      return (
        <div className={`ios-modal-backdrop ${isClosing ? 'animate-ios-backdrop-exit' : 'animate-ios-backdrop'}`}
             onClick={(e) => { if (e.target === e.currentTarget) handleClose(); }}>
          <div className={`ios-modal-card bg-white dark:bg-slate-800 ${isClosing ? 'animate-ios-sheet-exit' : 'animate-ios-sheet'}`}>
            <div className="ios-modal-header px-5 py-4 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between bg-white dark:bg-slate-800">
              <h2 className="text-base font-bold text-slate-900 dark:text-white">Catat Transaksi</h2>
              <button
                type="button"
                onClick={handleClose}
                className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors ios-btn-tap"
                aria-label="Tutup"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="ios-modal-body flex-1 overflow-y-auto pb-28 p-4 sm:p-5 space-y-4 no-scrollbar">
              <SegmentedControl
                options={[
                  { value: 'EXPENSE', label: '[-] Pengeluaran' },
                  { value: 'INCOME', label: '[+] Pemasukan' }
                ]}
                value={type}
                onChange={(newType) => {
                  setType(newType);
                  const newCats = CATEGORIES.filter(c => c.type === 'ALL' || c.type === newType);
                  if (!newCats.some(c => c.id === category)) {
                    setCategory(newCats[0].id);
                  }
                }}
                className="w-full"
              />

              <div>
                <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Nominal (Rp)</label>
                <input
                  type="text"
                  inputMode="numeric"
                  required
                  value={amountStr ? formatIDR(parseRawNumber(amountStr)) : ''}
                  onFocus={handleGlobalInputFocus}
                  onBlur={handleGlobalInputBlur}
                  onChange={(e) => {
                    const num = parseRawNumber(e.target.value);
                    setAmountStr(num ? num.toString() : '');
                    setError('');
                  }}
                  placeholder="0"
                  className="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-lg font-bold text-slate-900 dark:text-white focus:outline-none focus:border-brand"
                />
                {error && <p className="text-xs text-rose-500 mt-1">{error}</p>}

                <div className="flex flex-wrap gap-1.5 mt-2">
                  {[20000, 50000, 100000, 250000, 500000].map(val => (
                    <button
                      key={val}
                      type="button"
                      onClick={() => handleQuickAdd(val)}
                      className="px-2.5 py-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-300 rounded-lg text-[11px] font-medium ios-btn-tap"

                      +{val >= 1000 ? `${val / 1000}rb` : val}

                    <button
                      type="button"
                      onClick={() => setAmountStr('')}

              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Dompet / Rekening</label>

              <div>
                <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Kategori</label>
                <div className="grid grid-cols-3 gap-2">
                  {filteredCategories.map(cat => (

                          : 'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400'
                      }`}

                      <span className="text-[11px] leading-tight line-clamp-1">{cat.label}</span>

              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Tanggal</label>
                  <input
                    type="date"
                    value={date}
                    onFocus={handleGlobalInputFocus}
                    onBlur={handleGlobalInputBlur}
                    onChange={(e) => setDate(e.target.value)}
                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-brand"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Catatan</label>
                  <input

                    maxLength={60}

                    onBlur={handleGlobalInputBlur}

                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-brand"
                  />

              </div>

              <div className="pt-2">
                <button

    const AccountsManagerModal = ({ isOpen, onClose, accounts, transactions, onAddAccount, onDeleteAccount, onEditAccount }) => {
      const [isAdding, setIsAdding] = useState(false);
      const [name, setName] = useState('');
      const [type, setType] = useState('Bank');
      const [initialBalance, setInitialBalance] = useState('');
      const [editingAcc, setEditingAcc] = useState(null);
      const [isClosing, setIsClosing] = useState(false);

      const safeAccounts = Array.isArray(accounts) ? accounts.filter(Boolean) : [];
      const safeTransactions = Array.isArray(transactions) ? transactions.filter(Boolean) : [];

      useEffect(() => {
        if (!isOpen) {
          setIsAdding(false);
          setEditingAcc(null);
          setName('');
          setInitialBalance('');
          setType('Bank');
        }
      }, [isOpen]);

      if (!isOpen) return null;

      const handleClose = () => {
        setIsClosing(true);
        setTimeout(() => {
          setIsClosing(false);
          onClose();
        }, 220);
      };

      const handleSave = (e) => {
        e.preventDefault();
        const trimmed = (name || '').trim();

                        className="w-full px-3 py-2 bg-white dark:bg-[#181818] border-2 border-slate-300 dark:border-zinc-700 rounded-xl text-center font-bold tracking-widest text-sm text-slate-900 dark:text-white focus:outline-none focus:border-brand dark:focus:border-sky-400 transition-colors"

              {/* Cadangan Data (JSON Backup & Restore) */}
              <div className="pt-3 border-t border-slate-100 dark:border-slate-700 space-y-2">

    // =========================================================================
    // 7. VIEWS: SAVINGS GOALS, ANALYTICS & FLOATING CAPSULE NAVIGATION
    // =========================================================================
    const SavingsView = ({ savingsGoals, onOpenNewGoal, onEditGoal, onDeleteGoal, onDepositGoal, hideBalance }) => {

      const handleDepositSubmit = (e) => {
        e.preventDefault();
        const amt = parseRawNumber(depositAmount);
        if (amt <= 0 || !depositGoal) return;
        onDepositGoal(depositGoal.id, amt, depositMode);
        setDepositGoal(null);
        setDepositAmount('');

      return (
        <div className="space-y-4 pb-28 animate-ios-tab-view">
          <div className="flex items-center justify-between pt-1">
            <div>
              <h2 className="text-lg font-bold text-slate-900 dark:text-white leading-tight">Kantong Impian</h2>
              <p className="text-xs text-slate-500 dark:text-slate-400">Wujudkan target tabungan kamu</p>
            </div>
            <button
              type="button"
              onClick={onOpenNewGoal}
              className="px-4 py-2.5 bg-brand hover:bg-brand-hover text-white text-xs font-bold rounded-2xl flex items-center gap-2 shadow-sm transition-all ios-btn-tap"

              <Icon name="plus" className="w-4 h-4" strokeWidth={2.4} />

            </button>
          </div>

          {safeGoals.length === 0 ? (
            <div className="ios-inset-group text-center py-10">
              <IconBadge icon="target" className="w-14 h-14 rounded-2xl bg-sky-50 dark:bg-slate-800 text-brand mx-auto mb-3" iconClass="w-7 h-7" />
              <h3 className="text-sm font-bold text-slate-800 dark:text-white">Belum Ada Target Impian</h3>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-xs mx-auto mb-4">
                Beli gadget baru, liburan, motor, atau dana darurat? Buat target impian pertamamu sekarang.
              </p>
              <button
                type="button"
                onClick={onOpenNewGoal}
                className="inline-flex items-center gap-2 px-5 py-2.5 bg-brand hover:bg-brand-hover text-white text-xs font-bold rounded-xl shadow-sm transition-colors ios-btn-tap mx-auto"

                <Icon name="plus" className="w-4 h-4" />

                    <div className="flex items-start justify-between mb-2">
                      <div className="flex items-center gap-2.5">
                        <IconBadge icon="target" className="p-2 rounded-xl bg-sky-50 dark:bg-slate-700 text-brand dark:text-sky-400" />
                        <div>
                          <h3 className="text-xs font-bold text-slate-900 dark:text-white">{goal.title}</h3>
                          <p className="text-[11px] text-slate-400">
                            {goal.targetDate ? `Target: ${formatDateID(goal.targetDate)}` : 'Target fleksibel'}
                          </p>
                        </div>
                      </div>
                      <div className="flex items-center gap-1">
                        <button
                          type="button"
                          onClick={() => onEditGoal(goal)}
                          className="p-1.5 text-slate-400 hover:text-brand rounded-lg ios-btn-tap"
                          title="Edit"
                        >
                          <Icon name="edit" className="w-3.5 h-3.5" />
                        </button>
                        <button
                          type="button"
                          onClick={() => onDeleteGoal(goal.id)}
                          className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg ios-btn-tap"
                          title="Hapus"
                        >
                          <Icon name="trash" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </div>

                    <div className="flex items-baseline justify-between mb-1.5">
                      <span className="text-sm font-bold text-brand dark:text-sky-400">
                        {hideBalance ? 'Rp ••••••' : formatIDR(current)}
                      </span>
                      <span className="text-xs text-slate-400">
                        dari {hideBalance ? 'Rp ••••••' : formatIDR(target)} ({pct}%)
                      </span>
                    </div>

                    <div className="w-full h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden mb-3">
                      <div
                        className="h-full bg-brand rounded-full transition-all duration-300"
                        style={{ width: `${pct}%` }}
                      />
                    </div>

                    <div className="flex gap-2 pt-1 border-t border-slate-100 dark:border-slate-700">
                      <button
                        type="button"
                        onClick={() => {
                          setDepositGoal(goal);
                          setDepositMode('DEPOSIT');
                          setDepositAmount('');
                        }}
                        className="flex-1 py-1.5 rounded-xl bg-sky-50 dark:bg-slate-700 text-brand dark:text-sky-400 text-xs font-semibold hover:bg-sky-100 dark:hover:bg-slate-600 transition-colors ios-btn-tap"
                      >
                        + Setor Tabungan
                      </button>
                      {current > 0 && (
                        <button
                          type="button"
                          onClick={() => {
                            setDepositGoal(goal);
                            setDepositMode('WITHDRAW');
                            setDepositAmount('');
                          }}
                          className="flex-1 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs font-semibold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors ios-btn-tap"
                        >
                          - Tarik Saldo
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Deposit/Withdraw Mini Modal */}
          {depositGoal && (
            <div className="ios-modal-backdrop animate-ios-backdrop" onClick={(e) => { if (e.target === e.currentTarget) setDepositGoal(null); }}>
              <div className="ios-modal-card bg-white dark:bg-slate-800 p-5 animate-ios-sheet max-w-sm mx-auto rounded-[24px]">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
                  <h3 className="text-sm font-bold text-slate-900 dark:text-white">
                    {depositMode === 'DEPOSIT' ? 'Setor Tabungan' : 'Tarik Saldo Impian'}
                  </h3>
                  <button
                    type="button"
                    onClick={() => setDepositGoal(null)}
                    className="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors ios-btn-tap shrink-0"
                    aria-label="Tutup"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 flex-shrink-0 aspect-square">
                      <line x1="18" y1="6" x2="6" y2="18"></line>
                      <line x1="6" y1="6" x2="18" y2="18"></line>

                <form onSubmit={handleDepositSubmit} className="space-y-4 pt-3">
                  <p className="text-xs text-slate-500 dark:text-slate-400">

                      required
                      value={depositAmount ? formatIDR(parseRawNumber(depositAmount)) : ''}
                      onFocus={handleGlobalInputFocus}
                      onBlur={handleGlobalInputBlur}
                      onChange={(e) => {
                        const num = parseRawNumber(e.target.value);
                        setDepositAmount(num ? num.toString() : '');
                      }}
                      placeholder="Rp 0"
                      className="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-bold text-slate-900 dark:text-white focus:outline-none focus:border-brand"
                      autoFocus
