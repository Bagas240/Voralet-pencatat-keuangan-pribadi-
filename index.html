  <!-- Theme Synchronization Initialization -->
  <script>
    try {
      const savedTheme = localStorage.getItem('voralet_theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
        if (document.body) document.body.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
        if (document.body) document.body.classList.remove('dark');
        if (!savedTheme) {
          localStorage.setItem('voralet_theme', 'light');
        }
      }
    } catch (e) {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <style>
    :root {
      --ios-ease: cubic-bezier(0.32, 0.72, 0, 1);
      --ios-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;

    html, body {

      width: 100%;
      margin: 0;

    }

      color: #F8FAFC !important;
    }
    #root {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #F8FAFC;
      color: #0F172A;
      transition: background-color 300ms ease-in-out, color 300ms ease-in-out;
    }
    html.dark #root {

      color: #F8FAFC !important;
    }

    /* iOS Inset Grouped Block */
    .ios-inset-group {
      border-radius: 22px;
      background-color: #FFFFFF;
      padding: 1rem;
      border: 1px solid #E2E8F0;
      box-shadow: 0 2px 10px -1px rgba(15, 23, 42, 0.07), 0 1px 3px -1px rgba(15, 23, 42, 0.04);
      transition: background-color 300ms ease-in-out, border-color 300ms ease-in-out, color 300ms ease-in-out, box-shadow 300ms ease-in-out;

    .dark .ios-inset-group {
      background-color: #1E293B !important;
      border-color: #334155 !important;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.45), 0 2px 8px -1px rgba(0, 0, 0, 0.3) !important;
      color: #F8FAFC !important;

    /* iOS Floating & Capsule Shadows */
    .ios-drop-shadow {
      box-shadow: 0 6px 20px -3px rgba(15, 23, 42, 0.1), 0 2px 6px -2px rgba(15, 23, 42, 0.05);
    }
    .dark .ios-drop-shadow {
      box-shadow: 0 8px 24px -3px rgba(0, 0, 0, 0.55), 0 2px 8px -2px rgba(0, 0, 0, 0.4);
    }
    .ios-nav-shadow {
      box-shadow: 0 14px 36px -6px rgba(15, 23, 42, 0.22), 0 4px 14px -2px rgba(15, 23, 42, 0.1);
    }
    .dark .ios-nav-shadow {
      box-shadow: 0 18px 40px -6px rgba(0, 0, 0, 0.75), 0 4px 16px -2px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    /* Hairline Divider */
    .ios-hairline {
      border-bottom: 1px solid #E2E8F0;
      transition: border-color 300ms ease-in-out;
    }
    .dark .ios-hairline, html.dark .ios-hairline {
      border-bottom: 1px solid #334155 !important;
    }

    /* Bulletproof Fallbacks for Dark Mode */

      background-color: #0F172A !important;
      color: #F8FAFC !important;
    }

    }
    .dark .bg-white, html.dark .bg-white {

    }
    .dark .text-slate-900, html.dark .text-slate-900,

    }

    /* Scrollbar hide */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Tactile Touch Animation (SwiftUI Bouncy Spring Compression) */
    .ios-btn-tap, .ios-touch-item {
      transition: transform 150ms ease-out, opacity 150ms ease-out;
      will-change: transform;
      user-select: none;
      -webkit-user-select: none;
    }
    .ios-btn-tap:active, .ios-touch-item:active {
      transform: scale3d(0.94, 0.94, 1) !important;
      opacity: 0.86;
    }
    .ios-card-tap {
      transition: transform 150ms ease-out, opacity 150ms ease-out;
      will-change: transform;
      user-select: none;
      -webkit-user-select: none;
    }
    .ios-card-tap:active {
      transform: scale3d(0.96, 0.96, 1) !important;
      opacity: 0.92;
    }

    /* Keypad Button */
    .ios-keypad-btn {
      transition: transform 150ms ease-out, opacity 150ms ease-out, background-color 150ms ease;
      will-change: transform;
    }
    .ios-keypad-btn:active {
      transform: scale3d(0.92, 0.92, 1) !important;
      opacity: 0.76;
    }

    /* iOS Native Modal Sheet Depth Stacking Effect */
    .ios-modal-depth-layer {
      transition: transform 350ms cubic-bezier(0.32, 0.72, 0, 1), border-radius 350ms cubic-bezier(0.32, 0.72, 0, 1), filter 350ms ease-out;
      will-change: transform, border-radius;
      transform-origin: center top;
    }
    .ios-modal-depth-stacked {
      transform: scale(0.96) !important;
      border-radius: 28px !important;
      overflow: hidden !important;
      filter: brightness(0.95);
    }
    html.dark .ios-modal-depth-stacked, .dark .ios-modal-depth-stacked {

    /* SwiftUI Bouncy Elastic Curve for Dialogs, Popovers & Toasts */
    @keyframes iosSpringPop {
      0% {

        opacity: 0;

      100% {

    @keyframes iosSheetEnter {

    @keyframes iosSheetExit {

    .animate-ios-sheet-exit {

    }
    .animate-ios-backdrop {

    @keyframes iosTabFadeIn {

      100% {
        opacity: 1;

    }
    .animate-ios-tab-view {

    }

    /* iOS Spring Banner Toast */
    @keyframes iosToastSpringDown {
      0% { transform: translate3d(-50%, -100%, 0) scale(0.9); opacity: 0; }

      100% { transform: translate3d(-50%, 0, 0) scale(1); opacity: 1; }
    }
    @keyframes iosToastSpringUp {

    .ios-modal-backdrop {

    /* Popover spring */
    @keyframes popoverSpring {
      0% { transform: scale(0.8); opacity: 0; }

      100% { transform: scale(1); opacity: 1; }

    .animate-popover {
      animation: popoverSpring 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;

    /* Shake animation */
    @keyframes shake {

      animation: shake 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97);

      animation: iosPinPop 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;

    @keyframes iosPinShake {

      animation: iosPinShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // =========================================================================
    // 2. ICON SYSTEM (Apple SF Symbols Thin-Stroke SVG Icons & Badge System)

    const Icon = ({ name, className = "w-5 h-5", strokeWidth = 2 }) => {
      const computedClass = className.includes('aspect-square')

        case 'arrow-up-right':
        case 'trending-down':
        case 'expense':
          return (
            <svg className={computedClass} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
              <path d="M7 17L17 7M17 7H7M17 7V17" />

          );
        case 'arrow-down-left':
        case 'trending-up':
        case 'income':
          return (

              <path d="M17 7L7 17M7 17H17M7 17V7" />

          );
        case 'plus-circle':
          return (

              <circle cx="12" cy="12" r="10" />

        case 'minus-circle':

              <circle cx="12" cy="12" r="10" />

    // Resilient Error Boundary to safeguard against render crashes
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        // Silently capture error for application resilience
      }
      render() {
        if (this.state.hasError) {
          if (this.props.fallback) return this.props.fallback;
          return (
            <div className="p-4 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 text-amber-800 dark:text-amber-300 text-xs text-center my-3">

    // =========================================================================
    // 1. DATA LAYER (LOCAL STORAGE SERVICE & LEDGER SYSTEM)

    const STORAGE_KEYS = {
      PIN: 'voralet_pin',

      USERNAME: 'voralet_username',
      ACCOUNTS: 'voralet_accounts',
      TRANSACTIONS: 'voralet_transactions',

    };

    // =========================================================================
    // CRYPTOGRAPHY SERVICE (PBKDF2 PIN hashing with legacy migration)
    // =========================================================================
    const CryptoService = {
      SALT: 'voralet_secure_salt_v1_',
      ITERATIONS: 120000,
      bytesToBase64: (bytes) => {
        let binary = '';
        bytes.forEach(byte => { binary += String.fromCharCode(byte); });
        return btoa(binary);
      },
      base64ToBytes: (value) => Uint8Array.from(atob(value), char => char.charCodeAt(0)),
      legacyHashPin: async (pin) => {
        try {
          if (window.crypto && window.crypto.subtle && window.crypto.subtle.digest) {
            const encoder = new TextEncoder();
            const data = encoder.encode(CryptoService.SALT + String(pin));
            const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
          }
        } catch (e) {}
        // Deterministic fallback if subtle is unavailable
        let hash = 0x811c9dc5;
        const str = CryptoService.SALT + String(pin);
        for (let i = 0; i < str.length; i++) {
          hash ^= str.charCodeAt(i);
          hash += (hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24);
        }
        return 'voralet_hash_' + (hash >>> 0).toString(16);
      },
      deriveHash: async (pin, salt, iterations) => {
        const encoder = new TextEncoder();
        const key = await window.crypto.subtle.importKey(
          'raw',
          encoder.encode(String(pin)),
          { name: 'PBKDF2' },
          false,
          ['deriveBits']
        );
        const bits = await window.crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
          key,
          256
        );
        return new Uint8Array(bits);
      },
      equalConstantTime: (left, right) => {
        if (typeof left !== 'string' || typeof right !== 'string' || left.length !== right.length) return false;
        let difference = 0;
        for (let index = 0; index < left.length; index++) {
          difference |= left.charCodeAt(index) ^ right.charCodeAt(index);
        }
        return difference === 0;
      },
      hashPin: async (pin) => {
        if (!pin) return '';
        try {
          if (window.crypto?.subtle && window.crypto?.getRandomValues) {
            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const hash = await CryptoService.deriveHash(pin, salt, CryptoService.ITERATIONS);
            return `v2$${CryptoService.ITERATIONS}$${CryptoService.bytesToBase64(salt)}$${CryptoService.bytesToBase64(hash)}`;
          }
        } catch (e) {}
        return CryptoService.legacyHashPin(pin);
      },
      verifyPin: async (inputPin, storedPin) => {
        if (!storedPin || !inputPin) return false;
        // Legacy plaintext migration: if storedPin is 6 raw digits, check and upgrade
        if (storedPin.length === 6 && /^\d{6}$/.test(storedPin)) {
          if (inputPin === storedPin) {
            CryptoService.hashPin(inputPin).then(hashed => {
              if (hashed) StorageService.setPin(hashed);
            });
            return true;
          }
          return false;
        }
        if (storedPin.startsWith('v2$')) {
          try {
            const [, iterations, saltValue, expectedHash] = storedPin.split('$');
            const actualHash = await CryptoService.deriveHash(
              inputPin,
              CryptoService.base64ToBytes(saltValue),
              Number(iterations)
            );
            return CryptoService.equalConstantTime(
              CryptoService.bytesToBase64(actualHash),
              expectedHash
            );
          } catch (e) {
            return false;
          }
        }
        const hashedInput = await CryptoService.legacyHashPin(inputPin);
        if (!CryptoService.equalConstantTime(hashedInput, storedPin)) return false;
        CryptoService.hashPin(inputPin).then(hashed => StorageService.setPin(hashed));
        return true;
      }
    };

    // =========================================================================
    // DEFENSIVE VALIDATORS & SCHEMA INTEGRITY
    // =========================================================================
    const Validators = {
      sanitizeText: (str, maxLen = 60) => {
        if (!str) return '';
        return String(str).trim().slice(0, maxLen);
      },
      sanitizeNumber: (val, fallback = 0) => {
        const n = Number(val);
        return (isNaN(n) || !isFinite(n) || n < 0) ? fallback : n;
      },
      validateTransaction: (tx) => {
        if (!tx || typeof tx !== 'object') return null;
        const amount = Validators.sanitizeNumber(tx.amount, 0);
        if (amount <= 0) return null;
        return {
          id: String(tx.id || ('tx_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7))),
          type: (tx.type === 'INCOME') ? 'INCOME' : 'EXPENSE',
          amount,
          category: Validators.sanitizeText(tx.category || 'lainnya', 30),
          accountId: String(tx.accountId || ''),
          date: tx.date || new Date().toISOString().split('T')[0],
          note: Validators.sanitizeText(tx.note || '', 100),
          createdAt: tx.createdAt || new Date().toISOString()
        };
      },
      validateAccount: (acc) => {
        if (!acc || typeof acc !== 'object') return null;
        const name = Validators.sanitizeText(acc.name, 30);
        if (!name) return null;
        return {
          id: String(acc.id || ('acc_' + Date.now())),
          name,
          type: ['Bank', 'Cash', 'E-Wallet'].includes(acc.type) ? acc.type : 'Cash',
          initialBalance: Validators.sanitizeNumber(acc.initialBalance, 0),
          createdAt: acc.createdAt || new Date().toISOString()
        };
      },
      validateSavingsGoal: (goal) => {
        if (!goal || typeof goal !== 'object') return null;
        const name = Validators.sanitizeText(goal.name, 40);
        const targetAmount = Validators.sanitizeNumber(goal.targetAmount, 0);
        if (!name || targetAmount <= 0) return null;
        return {
          id: String(goal.id || ('goal_' + Date.now())),
          name,
          targetAmount,
          currentAmount: Validators.sanitizeNumber(goal.currentAmount, 0),
          category: Validators.sanitizeText(goal.category || 'Tabungan', 30),
          icon: Validators.sanitizeText(goal.icon || 'target', 20),
          createdAt: goal.createdAt || new Date().toISOString()
        };
      },
      validateDebt: (debt) => {
        if (!debt || typeof debt !== 'object') return null;
        const personName = Validators.sanitizeText(debt.personName, 40);
        const amount = Validators.sanitizeNumber(debt.amount, 0);
        if (!personName || amount <= 0) return null;
        return {
          id: String(debt.id || ('debt_' + Date.now())),
          personName,
          type: debt.type === 'PIUTANG' ? 'PIUTANG' : 'HUTANG',
          amount,
          dueDate: debt.dueDate || '',
          isPaid: Boolean(debt.isPaid),
          note: Validators.sanitizeText(debt.note || '', 100),
          createdAt: debt.createdAt || new Date().toISOString()
        };
      },
      validateBackupSchema: (data) => {
        if (!data || typeof data !== 'object') return null;
        const accounts = Array.isArray(data.accounts)
          ? data.accounts.map(Validators.validateAccount).filter(Boolean)
          : [];
        const transactions = Array.isArray(data.transactions)
          ? data.transactions.map(Validators.validateTransaction).filter(Boolean)
          : [];
        const savingsGoals = Array.isArray(data.savingsGoals)
          ? data.savingsGoals.map(Validators.validateSavingsGoal).filter(Boolean)
          : [];
        const debts = Array.isArray(data.debts)
          ? data.debts.map(Validators.validateDebt).filter(Boolean)
          : [];
        return {
          accounts,
          transactions,
          savingsGoals,
          debts,
          name: Validators.sanitizeText(data.name || '', 30),
          username: (data.username || '').toLowerCase().replace(/[^a-z0-9_]/g, ''),
          avatar: typeof data.avatar === 'string' ? data.avatar : '',
          theme: data.theme === 'dark' ? 'dark' : 'light',
          safeBudget: Validators.sanitizeNumber(data.safeBudget, 0)
        };
      }
    };

    const StorageService = {
      getPin: () => {
        try { return localStorage.getItem(STORAGE_KEYS.PIN); } catch (e) { return null; }
      },
      setPin: (pin) => {
        try { localStorage.setItem(STORAGE_KEYS.PIN, pin); } catch (e) {}
      },
      getName: () => {
        try { return localStorage.getItem(STORAGE_KEYS.NAME) || ''; } catch (e) { return ''; }
      },
      setName: (name) => {

      getAccounts: () => {

      getSavingsGoals: () => {

      setSavingsGoals: (goals) => {

          localStorage.setItem(STORAGE_KEYS.SAVINGS_GOALS, JSON.stringify(clean));

      getDebts: () => {

        } catch (e) { return []; }
      },
      setDebts: (debts) => {

          localStorage.setItem(STORAGE_KEYS.DEBTS, JSON.stringify(clean));

      getSafeBudget: () => {

          return v ? Number(v) : 0;
        } catch (e) { return 0; }

      },
      getHideBalance: () => {
        try { return localStorage.getItem(STORAGE_KEYS.HIDE_BALANCE) === 'true'; } catch (e) { return false; }
      },
      setHideBalance: (val) => {
        try { localStorage.setItem(STORAGE_KEYS.HIDE_BALANCE, val ? 'true' : 'false'); } catch (e) {}
      },
      getTheme: () => {
        try {
          const val = localStorage.getItem(STORAGE_KEYS.THEME);
          return val === 'dark' ? 'dark' : 'light';
        } catch (e) { return 'light'; }
      },
      setTheme: (theme) => {
        try { localStorage.setItem(STORAGE_KEYS.THEME, theme); } catch (e) {}
      },
      getAvatar: () => {
        try { return localStorage.getItem(STORAGE_KEYS.AVATAR) || ''; } catch (e) { return ''; }
      },
      setAvatar: (avatar) => {
        try {
          if (avatar) localStorage.setItem(STORAGE_KEYS.AVATAR, avatar);
          else localStorage.removeItem(STORAGE_KEYS.AVATAR);
        } catch (e) {}
      },
      clearAll: () => {
        try {
          Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k));
        } catch (e) {}
      }
    };

    // LEDGER ENGINE: Single Source of Truth for Deterministic Calculations
    const Ledger = {
      getAccountBalance: (accountId, accounts, transactions) => {
        if (!accountId) return 0;
        const safeAccs = Array.isArray(accounts) ? accounts : [];
        const safeTxs = Array.isArray(transactions) ? transactions : [];
        const acc = safeAccs.find(a => a && a.id === accountId);
        if (!acc) return 0;
        const initial = Number(acc.initialBalance) || 0;
        const sumTx = safeTxs
          .filter(t => t && t.accountId === accountId)
          .reduce((sum, t) => {
            const amt = Number(t.amount) || 0;
            return t.type === 'INCOME' ? sum + amt : sum - amt;
          }, 0);
        return initial + sumTx;
      },
      getTotalBalance: (accounts, transactions) => {
        const safeAccs = Array.isArray(accounts) ? accounts : [];
        const safeTxs = Array.isArray(transactions) ? transactions : [];
        return safeAccs.reduce((tot, a) => {
          if (!a) return tot;
          return tot + Ledger.getAccountBalance(a.id, safeAccs, safeTxs);
        }, 0);
      },
      getSummaryTotals: (transactions, filterAccountId = null) => {
        const safeTxs = Array.isArray(transactions) ? transactions : [];
        const filtered = filterAccountId
          ? safeTxs.filter(t => t && t.accountId === filterAccountId)
          : safeTxs;
        let income = 0;
        let expense = 0;
        for (const t of filtered) {
          if (!t) continue;
          const amt = Number(t.amount) || 0;
          if (t.type === 'INCOME') income += amt;
          else if (t.type === 'EXPENSE') expense += amt;
        }
        return { income, expense, net: income - expense };
      },
      // Deterministic calculation for Safe-to-Spend Daily Limit
      calculateSafeToSpend: (accounts, transactions, customDailyBudget = 0) => {
        const now = new Date();
        const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const currentDay = now.getDate();
        const daysRemaining = Math.max(1, daysInMonth - currentDay + 1);

        const totalBalance = Ledger.getTotalBalance(accounts, transactions);

        // This month's total expenses
        const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        const monthlyTxs = (transactions || []).filter(t => t && t.date && t.date.startsWith(currentMonthStr));
        const spentThisMonth = monthlyTxs
          .filter(t => t.type === 'EXPENSE')
          .reduce((acc, t) => acc + (Number(t.amount) || 0), 0);

        // Today's total expenses
        const todayStr = now.toISOString().split('T')[0];
        const spentToday = (transactions || [])
          .filter(t => t && t.date === todayStr && t.type === 'EXPENSE')
          .reduce((acc, t) => acc + (Number(t.amount) || 0), 0);

        // Calculate daily allowance
        let dailyLimit = customDailyBudget > 0
          ? customDailyBudget
          : Math.max(0, Math.floor(totalBalance / daysRemaining));

        const remainingToday = Math.max(0, dailyLimit - spentToday);
        const percentUsed = dailyLimit > 0 ? Math.min(100, Math.round((spentToday / dailyLimit) * 100)) : 0;

        return {
          dailyLimit,
          spentToday,
          remainingToday,
          percentUsed,
          daysRemaining,
          spentThisMonth
        };
      },
      // Deterministic Financial Milestones & Health
      calculateMilestones: (accounts, transactions, savingsGoals, debts) => {
        const totalBalance = Ledger.getTotalBalance(accounts, transactions);
        const totalSavings = (savingsGoals || []).reduce((sum, g) => sum + (Number(g.currentAmount) || 0), 0);
        const unpaidDebts = (debts || []).filter(d => !d.isPaid && d.type === 'HUTANG').reduce((sum, d) => sum + (Number(d.amount) || 0), 0);
        const unpaidReceivables = (debts || []).filter(d => !d.isPaid && d.type === 'PIUTANG').reduce((sum, d) => sum + (Number(d.amount) || 0), 0);

        const milestones = [
          {
            id: 'm1',
            title: 'Langkah Awal',
            desc: 'Mencatat transaksi pertama di Voralet',
            isCompleted: (transactions || []).length > 0,
            icon: 'check-circle'
          },
          {
            id: 'm2',
            title: 'Dana Darurat Siaga',
            desc: 'Saldo total mencapai minimal Rp 1.000.000',
            isCompleted: totalBalance >= 1000000,
            icon: 'shield'
          },
          {
            id: 'm3',
            title: 'Penabung Cerdas',
            desc: 'Memiliki minimal satu Kantong Impian aktif',
            isCompleted: (savingsGoals || []).length > 0,
            icon: 'target'
          },
          {
            id: 'm4',
            title: 'Bebas Hutang',
            desc: 'Tidak ada tanggungan hutang yang belum lunas',
            isCompleted: unpaidDebts === 0,
            icon: 'check'
          }
        ];

        const completedCount = milestones.filter(m => m.isCompleted).length;
        const progressPct = Math.round((completedCount / milestones.length) * 100);

        return {
          milestones,
          completedCount,
          totalMilestones: milestones.length,
          progressPct,
          totalSavings,
          unpaidDebts,
          unpaidReceivables
        };
      }
    };

    // Formatters
    const formatIDR = (amount) => {
      const num = Number(amount) || 0;
      return 'Rp ' + new Intl.NumberFormat('id-ID').format(num);

    const parseRawNumber = (str) => {

    // Client-side image compression
    const compressImage = (file, callback, onError) => {
      if (!file || !file.type.startsWith('image/')) {
        if (onError) onError('File harus berupa gambar');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const maxDim = 200;
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              }
            } else {
              if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            callback(dataUrl);
          } catch (err) {
            if (onError) onError('Gagal memproses gambar');
          }
        };
        img.onerror = () => { if (onError) onError('Gagal memuat gambar'); };
        img.src = e.target.result;
      };
      reader.onerror = () => { if (onError) onError('Gagal membaca file gambar'); };

              <h1 className="text-xl font-bold text-[#0F172A] dark:text-[#F8FAFC]">
                {userName ? `Hai, ${userName}` : 'Kunci Brankas'}
              </h1>
              {username && (
                <p className="text-xs font-mono text-[#0284C7] dark:text-[#38BDF8] font-semibold mt-0.5">@{username}</p>
              )}
              <p className="text-xs text-[#64748B] dark:text-[#94A3B8] mt-1">Masukkan 6-digit PIN untuk akses brankas</p>

              <PinDots count={6} filled={pin.length} isError={error} />
              {error && (
                <p className="text-xs font-semibold text-rose-500">PIN salah. Silakan coba kembali.</p>
              )}
            </div>
          </div>

          <div className="pb-8">
            <Keypad onKeyPress={handlePress} onBackspace={handleBackspace} />
            <div className="mt-4 text-center">
              <button
                type="button"
                onClick={() => setIsForgotModalOpen(true)}
                className="text-xs font-medium text-[#64748B] hover:text-[#0284C7] dark:text-[#94A3B8] dark:hover:text-[#38BDF8] transition-colors py-1 px-3"
              >
                Lupa PIN?
              </button>
            </div>
          </div>

          {isForgotModalOpen && (
            <ForgotPinModal
              storedUsername={username}
              storedName={userName}
              onClose={() => setIsForgotModalOpen(false)}
              onResetPin={(newPin) => {
                onResetPin(newPin);
                setIsForgotModalOpen(false);
                setPin('');
              }}
            />
          )}
        </div>
      );
    };

    const OnboardingFlow = ({ onComplete }) => {
      const [onboardingStep, setOnboardingStep] = useState(1);
      const [newPin, setNewPin] = useState('');
      const [pinError, setPinError] = useState('');

      const [name, setName] = useState('');
      const [username, setUsername] = useState('');
      const [avatar, setAvatar] = useState('');
      const [identityError, setIdentityError] = useState('');

      const [walletName, setWalletName] = useState('BCA Utama');
      const [walletType, setWalletType] = useState('Bank'); // Tunai | Bank | E-Wallet
      const [initialBalance, setInitialBalance] = useState('');

      // STEP 1 PIN Handlers
      const handleDigitPress = (digit) => {
        if (newPin.length < 6) {
          const next = newPin + digit;
          setNewPin(next);
          setPinError('');
        }
      };

      const handleBackspace = () => {
        setNewPin(prev => prev.slice(0, -1));
        setPinError('');
      };

      const handleStep1Next = () => {
        if (newPin.length !== 6) {
          setPinError('PIN harus terdiri dari 6 digit angka');
          return;
        }
        setPinError('');
        setOnboardingStep(2);
      };

      // STEP 2 PROFILE HANDLER
      const handleStep2Next = (e) => {
        e?.preventDefault();
        const trimmedName = name.trim();
        if (!trimmedName) {
          setIdentityError('Harap masukkan nama panggilan');
          return;
        }
        let cleanUsername = username.trim().toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_]/g, '');
        if (!cleanUsername) {
          cleanUsername = trimmedName.toLowerCase().replace(/[^a-z0-9_]/g, '') || 'voralet_user';
          setUsername(cleanUsername);
        }
        setIdentityError('');
        setOnboardingStep(3);
      };

      // STEP 3 FINISH ONBOARDING
      const handleFinishOnboarding = (e) => {
        e?.preventDefault();
        const trimmedName = name.trim() || 'Sahabat Voralet';
        const cleanUsername = (username.trim().toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_]/g, '') || trimmedName.toLowerCase().replace(/[^a-z0-9_]/g, '') || 'voralet_user');
        const rawBalance = parseRawNumber(initialBalance);
        const trimmedWallet = walletName.trim() || 'BCA Utama';

        const firstAccount = {
          id: 'acc_' + Date.now(),
          name: trimmedWallet,
          type: walletType,
          initialBalance: rawBalance,
          createdAt: new Date().toISOString()
        };

        CryptoService.hashPin(newPin).then(hashedPin => {
          StorageService.setPin(hashedPin);
          StorageService.setName(trimmedName);
          StorageService.setUsername(cleanUsername);
          if (avatar) StorageService.setAvatar(avatar);
          StorageService.setAccounts([firstAccount]);
          StorageService.setTransactions([]);
          StorageService.setSavingsGoals([]);
          StorageService.setDebts([]);

          onComplete({
            pin: hashedPin,
            name: trimmedName,
            username: cleanUsername,
            avatar: avatar,
            accounts: [firstAccount],
            transactions: [],
            savingsGoals: [],
            debts: []
          });
        });
      };

      return (
        <div className="min-h-[100dvh] w-full flex flex-col justify-between p-6 bg-white dark:bg-[#0F172A] max-w-md mx-auto transition-colors duration-300 ease-in-out text-[#0F172A] dark:text-[#F8FAFC]">
          {/* STEP 1: Buat 6-Digit PIN Security */}
          {onboardingStep === 1 && (
            <div className="pin-keypad-screen flex flex-col justify-between w-full">
              <div className="pt-6 text-center">
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#E0F2FE] dark:bg-[#1E293B] border border-[#BAE6FD] dark:border-[#334155] text-[#0284C7] dark:text-[#38BDF8] text-xs font-bold mb-4">
                  <span>Langkah 1 dari 3</span>
                </div>
                <div className="w-16 h-16 rounded-[22px] bg-[#F0F9FF] dark:bg-[#1E293B] border border-[#E0F2FE] dark:border-[#334155] flex items-center justify-center mx-auto mb-3 text-[#0284C7] dark:text-[#38BDF8]">
                  <Icon name="lock" className="w-7 h-7" strokeWidth={1.8} />
                </div>
                <h1 className="text-xl font-bold text-[#0F172A] dark:text-[#F8FAFC]">
                  Buat 6-Digit PIN Security
                </h1>
                <p className="text-xs text-[#64748B] dark:text-[#94A3B8] mt-1">
                  PIN digunakan untuk mengamankan brankas lokal kamu
                </p>

                <PinDots
                  count={6}
                  filled={newPin.length}
                  isError={Boolean(pinError)}
                />

                {pinError && (
                  <p className="text-xs font-semibold text-rose-500 mt-2">{pinError}</p>
                )}
              </div>

              {/* Elevated Button Container with generous bottom safe-area padding */}
              <div className="pb-10 mb-8 pt-2 space-y-4">
                <Keypad
                  onKeyPress={handleDigitPress}
                  onBackspace={handleBackspace}
                />
                <button
                  type="button"
                  onClick={handleStep1Next}
                  disabled={newPin.length < 6}
                  className={`w-full py-4 rounded-2xl font-bold text-sm transition-all ios-btn-tap ${
                    newPin.length === 6
                      ? 'bg-[#0284C7] hover:bg-[#0369A1] text-white shadow-md cursor-pointer'
                      : 'bg-slate-100 dark:bg-[#1E293B] border border-transparent dark:border-[#334155] text-[#64748B] dark:text-[#94A3B8] opacity-60 cursor-not-allowed'
                  }`}
                >
                  Lanjutkan
                </button>
              </div>
            </div>
          )}

          {/* STEP 2: Atur Profil Kamu */}
          {onboardingStep === 2 && (
            <div className="flex-1 flex flex-col justify-between w-full py-4 overflow-y-auto no-scrollbar">
              <div className="pt-4">
                <div className="text-center mb-6">
                  <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#E0F2FE] dark:bg-[#1E293B] border border-[#BAE6FD] dark:border-[#334155] text-[#0284C7] dark:text-[#38BDF8] text-xs font-bold mb-3">
                    <span>Langkah 2 dari 3</span>
                  </div>
                  <h1 className="text-xl font-bold text-[#0F172A] dark:text-[#F8FAFC]">Atur Profil Kamu</h1>
                  <p className="text-xs text-[#64748B] dark:text-[#94A3B8] mt-1">
                    Atur nama dan username untuk brankas keuanganmu
                  </p>
                </div>

                <div className="flex flex-col items-center mb-6">
                  <div className="relative">
                    <Avatar avatar={avatar} name={name} size="w-20 h-20" textSize="text-2xl" />
                    <label
                      htmlFor="onboarding-avatar-upload"
                      className="absolute bottom-0 right-0 w-7 h-7 bg-[#0284C7] text-white rounded-full flex items-center justify-center cursor-pointer shadow hover:bg-[#0369A1] transition-colors ios-btn-tap"
                      title="Unggah Foto Profil"
                    >
                      <Icon name="camera" className="w-4 h-4" />
                    </label>
                    <input
                      id="onboarding-avatar-upload"
                      type="file"
                      accept="image/*"
                      className="hidden"
                      onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (file) compressImage(file, (dataUrl) => setAvatar(dataUrl));
                      }}
                    />
                  </div>
                  <span className="text-[11px] text-[#64748B] dark:text-[#94A3B8] mt-2">Foto Profil (Opsional)</span>
                </div>

                <form id="step2-form" onSubmit={handleStep2Next} className="space-y-4 ios-inset-group bg-[#F0F9FF] dark:bg-[#1E293B] border border-[#E0F2FE] dark:border-[#334155] rounded-[22px] p-4">
                  <div>
                    <label className="block text-xs font-semibold text-[#0F172A] dark:text-[#F8FAFC] mb-1.5">
                      Nama Panggilan <span className="text-rose-500">*</span>
                    </label>
                    <input
                      type="text"
                      required
                      maxLength={30}
                      value={name}
                      onFocus={handleGlobalInputFocus}
                      onBlur={handleGlobalInputBlur}
                      onChange={(e) => {
                        const val = e.target.value;
                        setName(val);
                        setIdentityError('');
                        if (!username) {
                          setUsername(val.toLowerCase().replace(/[^a-z0-9_]/g, ''));
                        }
                      }}
                      placeholder="Misal: Bagas"
                      className="w-full px-3.5 py-3 bg-white dark:bg-[#0F172A] border border-slate-200 dark:border-[#334155] rounded-xl text-sm font-medium text-[#0F172A] dark:text-[#F8FAFC] focus:outline-none focus:border-[#0284C7] dark:focus:border-[#38BDF8] transition-colors"
                      autoFocus
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-[#0F172A] dark:text-[#F8FAFC] mb-1.5">
                      Username
                    </label>
                    <div className="relative">
                      <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#64748B] dark:text-[#94A3B8] font-mono text-sm font-bold">@</span>
                      <input
                        type="text"
                        required
                        maxLength={20}
                        value={username}
                        onFocus={handleGlobalInputFocus}
                        onBlur={handleGlobalInputBlur}
                        onChange={(e) => {
                          setUsername(e.target.value.toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_]/g, ''));
                          setIdentityError('');
                        }}
                        placeholder="bagas"
                        className="w-full pl-8 pr-3.5 py-3 bg-white dark:bg-[#0F172A] border border-slate-200 dark:border-[#334155] rounded-xl text-sm font-mono text-[#0F172A] dark:text-[#F8FAFC] focus:outline-none focus:border-[#0284C7] dark:focus:border-[#38BDF8] transition-colors"
                      />
                    </div>
                    <span className="text-[11px] text-[#64748B] dark:text-[#94A3B8] mt-1 block">
                      Contoh: @bagas (digunakan untuk verifikasi pemulihan PIN)
                    </span>
                  </div>

                  {identityError && (
                    <p className="text-xs font-semibold text-rose-500">{identityError}</p>
                  )}
                </form>
              </div>

              <div className="flex gap-3 pt-6 pb-2">
                <button
                  type="button"
                  onClick={() => setOnboardingStep(1)}
                  className="py-3 px-4 bg-[#F0F9FF] dark:bg-[#1E293B] border border-[#E0F2FE] dark:border-[#334155] text-[#0F172A] dark:text-[#F8FAFC] text-sm font-semibold rounded-xl hover:bg-sky-50 dark:hover:bg-[#273549] transition-colors ios-btn-tap shrink-0"
                >
                  Kembali
                </button>
                <button
                  type="button"
                  onClick={handleStep2Next}
                  className="flex-1 py-3 bg-[#0284C7] hover:bg-[#0369A1] text-white text-sm font-bold rounded-xl shadow-sm transition-colors ios-btn-tap"
                >
                  Lanjut
                </button>
              </div>
            </div>
          )}

          {/* STEP 3: Setup Dompet Pertama */}
          {onboardingStep === 3 && (
            <div className="flex-1 flex flex-col justify-between w-full py-4 overflow-y-auto no-scrollbar">
              <div className="pt-4">
                <div className="text-center mb-6">
                  <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#E0F2FE] dark:bg-[#1E293B] border border-[#BAE6FD] dark:border-[#334155] text-[#0284C7] dark:text-[#38BDF8] text-xs font-bold mb-3">
                    <span>Langkah 3 dari 3</span>
                  </div>
                  <h1 className="text-xl font-bold text-[#0F172A] dark:text-[#F8FAFC]">Buat Dompet Pertama</h1>
                  <p className="text-xs text-[#64748B] dark:text-[#94A3B8] mt-1">
                    Atur sumber dana awal untuk mencatat keuanganmu
                  </p>
                </div>

                <form id="step3-form" onSubmit={handleFinishOnboarding} className="space-y-4 ios-inset-group bg-[#F0F9FF] dark:bg-[#1E293B] border border-[#E0F2FE] dark:border-[#334155] rounded-[22px] p-4">
                  {/* Field 1: Nama Dompet */}
                  <div>
                    <label className="block text-xs font-semibold text-[#0F172A] dark:text-[#F8FAFC] mb-1.5">
                      Nama Dompet <span className="text-rose-500">*</span>
                    </label>
                    <input
                      type="text"
                      required
                      value={walletName}
                      onFocus={handleGlobalInputFocus}
                      onBlur={handleGlobalInputBlur}
                      onChange={(e) => setWalletName(e.target.value)}
                      placeholder="e.g. BCA Utama, Cash"
                      className="w-full px-3.5 py-3 bg-white dark:bg-[#0F172A] border border-slate-200 dark:border-[#334155] rounded-xl text-sm font-medium text-[#0F172A] dark:text-[#F8FAFC] focus:outline-none focus:border-[#0284C7] dark:focus:border-[#38BDF8] transition-colors"
                      autoFocus
                    />
                  </div>

                  {/* Field 2: Kategori (3 Segmented Buttons: [Tunai] [Bank] [E-Wallet]) */}
                  <div>
                    <label className="block text-xs font-semibold text-[#0F172A] dark:text-[#F8FAFC] mb-1.5">
                      Kategori
                    </label>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { id: 'Cash', label: 'Tunai', icon: 'cash' },
                        { id: 'Bank', label: 'Bank', icon: 'bank' },
                        { id: 'E-Wallet', label: 'E-Wallet', icon: 'smartphone' }
                      ].map(item => {
                        const isSelected = walletType === item.id;
                        return (
                          <button
                            key={item.id}
                            type="button"
                            onClick={() => setWalletType(item.id)}
                            className={`py-2.5 px-2 text-center rounded-xl border text-xs font-medium flex flex-col items-center gap-1.5 transition-all ios-btn-tap ${
                              isSelected
                                ? 'bg-[#E0F2FE] dark:bg-[#1E293B] border-[#0284C7] dark:border-[#38BDF8] text-[#0284C7] dark:text-[#38BDF8] font-bold shadow-sm'
                                : 'bg-white dark:bg-[#0F172A] border-slate-200 dark:border-[#334155] text-[#64748B] dark:text-[#94A3B8] hover:bg-slate-50 dark:hover:bg-[#1E293B]'
                            }`}
                          >
                            <Icon name={item.icon} className="w-5 h-5 flex-shrink-0 aspect-square" />
                            <span className="whitespace-nowrap">{item.label}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Field 3: Saldo Awal */}
                  <div>
                    <label className="block text-xs font-semibold text-[#0F172A] dark:text-[#F8FAFC] mb-1.5">
                      Saldo Awal
                    </label>
                    <div className="relative">
                      <input
                        type="text"
                        inputMode="numeric"
                        value={initialBalance ? formatIDR(parseRawNumber(initialBalance)) : ''}
                        onFocus={handleGlobalInputFocus}
                        onBlur={handleGlobalInputBlur}
                        onChange={(e) => {
                          const num = parseRawNumber(e.target.value);
                          setInitialBalance(num ? num.toString() : '');
                        }}
                        placeholder="Rp 0"
                        className="w-full px-3.5 py-3 bg-white dark:bg-[#0F172A] border border-slate-200 dark:border-[#334155] rounded-xl text-base font-bold text-[#0F172A] dark:text-[#F8FAFC] focus:outline-none focus:border-[#0284C7] dark:focus:border-[#38BDF8] transition-colors"
                      />
                    </div>
                    <span className="text-[11px] text-[#64748B] dark:text-[#94A3B8] mt-1 block">
                      Jumlah saldo yang kamu miliki saat ini
                    </span>
                  </div>
                </form>
              </div>

              {/* CTA Button: Mulai Gunakan Voralet -> Saves to LocalStorage and enters Dashboard */}
              <div className="flex gap-3 pt-6 pb-2">
                <button
                  type="button"
                  onClick={() => setOnboardingStep(2)}
                  className="py-3 px-4 bg-[#F0F9FF] dark:bg-[#1E293B] border border-[#E0F2FE] dark:border-[#334155] text-[#0F172A] dark:text-[#F8FAFC] text-sm font-semibold rounded-xl hover:bg-sky-50 dark:hover:bg-[#273549] transition-colors ios-btn-tap shrink-0"
                >
                  Kembali
                </button>
                <button
                  type="button"
                  onClick={handleFinishOnboarding}
                  className="flex-1 py-3.5 bg-[#0099FF] hover:bg-[#008CE8] text-white text-sm font-bold rounded-xl shadow-md transition-all active:scale-95 ios-btn-tap text-center"
                >
                  Mulai Gunakan Voralet
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // 4. SAFE-TO-SPEND, QUICK SHORTCUTS & FINANCIAL MILESTONES
    // =========================================================================
    const SafeToSpendCard = ({ accounts, transactions, hideBalance, onSetBudget, safeBudget }) => {
      const [isEditingBudget, setIsEditingBudget] = useState(false);
      const [budgetInput, setBudgetInput] = useState('');

      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const currentDay = now.getDate();
      const daysRemaining = Math.max(1, totalDays - currentDay + 1);

      const totalLiquid = Ledger.getTotalBalance(accounts, transactions);
      const currentMonthTotals = useMemo(() => {
        const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
        const thisMonthTx = (transactions || []).filter(t => t && t.date && t.date.startsWith(monthPrefix));
        return Ledger.getSummaryTotals(thisMonthTx);
      }, [transactions, year, month]);

      const effectiveBudget = safeBudget > 0 ? safeBudget : totalLiquid;
      const spentThisMonth = currentMonthTotals.expense;
      const remainingMonthBudget = Math.max(0, safeBudget > 0 ? (safeBudget - spentThisMonth) : totalLiquid);
      const dailyAllowance = Math.floor(remainingMonthBudget / daysRemaining);

      const handleSaveBudget = (e) => {
        e.preventDefault();
        const num = parseRawNumber(budgetInput);
        onSetBudget(num);
        setIsEditingBudget(false);
      };

      return (
        <div className="ios-inset-group mb-4">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-2">
              <IconBadge icon="shield-check" className="p-1.5 rounded-xl bg-sky-100 dark:bg-slate-700 text-brand dark:text-sky-400" iconClass="w-4 h-4" />
              <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                Safe-to-Spend Harian
              </span>
            </div>
            <button
              type="button"
              onClick={() => {
                setBudgetInput(safeBudget ? String(safeBudget) : '');
                setIsEditingBudget(true);
              }}
              className="text-[11px] font-semibold text-brand dark:text-sky-400 hover:underline flex items-center gap-1 ios-btn-tap"
            >
              <Icon name="edit" className="w-3 h-3" />
              <span>{safeBudget > 0 ? 'Atur Limit' : 'Pasang Limit'}</span>
            </button>
          </div>

          <div className="flex items-baseline justify-between mt-1">
            <div>
              <div className="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                {hideBalance ? 'Rp ••••••' : formatIDR(dailyAllowance)}
                <span className="text-xs font-normal text-slate-400 dark:text-slate-500 ml-1">/ hari</span>
              </div>
              <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">
                Sisa {daysRemaining} hari di bulan ini • Sisa dana {hideBalance ? 'Rp ••••••' : formatIDR(remainingMonthBudget)}
              </p>
            </div>
            <div className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
              dailyAllowance > 50000 ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 border border-emerald-200/50' : 'bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400 border border-amber-200/50'
            }`}>
              {dailyAllowance > 50000 ? 'Aman' : 'Hemat'}
            </div>
          </div>

          {isEditingBudget && (
            <form onSubmit={handleSaveBudget} className="mt-3 pt-3 border-t border-slate-100 dark:border-slate-700 flex gap-2">
              <input
                type="text"
                inputMode="numeric"
                value={budgetInput ? formatIDR(parseRawNumber(budgetInput)) : ''}
                onFocus={handleGlobalInputFocus}
                onBlur={handleGlobalInputBlur}
                onChange={(e) => setBudgetInput(parseRawNumber(e.target.value).toString())}
                placeholder="Limit belanja bulanan (Rp)"
                className="flex-1 px-3 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-medium text-slate-900 dark:text-white focus:outline-none focus:border-brand"
                autoFocus
              />
              <button
                type="submit"
                className="px-3 py-1.5 bg-brand text-white text-xs font-semibold rounded-xl hover:bg-brand-hover ios-btn-tap"
              >
                Simpan
              </button>
              <button
                type="button"
                onClick={() => setIsEditingBudget(false)}
                className="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs font-medium rounded-xl ios-btn-tap"
              >
                Batal
              </button>
            </form>
          )}
        </div>
      );
    };

    // Quick Expense Presets
    const QuickExpenseBar = ({ onSelectQuickExpense }) => {
      const presets = [
        { label: 'Kopi', amount: 25000, category: 'makan', icon: 'food' },
        { label: 'Makan', amount: 35000, category: 'makan', icon: 'food' },
        { label: 'Bensin', amount: 50000, category: 'transport', icon: 'transport' },
        { label: 'Harian', amount: 100000, category: 'belanja', icon: 'shopping' }
      ];

      return (
        <div className="mb-4">
          <div className="flex items-center justify-between mb-2 px-1">
            <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
              Pintas Cepat
            </span>
            <span className="text-[10px] text-slate-400">1-Tap Catat</span>
          </div>
          <div className="grid grid-cols-4 gap-2">
            {presets.map((p, idx) => (

        return [

      return (

                  className="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-base font-bold text-slate-900 dark:text-white focus:outline-none focus:border-brand"

    const DebtsView = ({ debts, onAddDebt, onToggleStatus, onDeleteDebt, hideBalance, onEditDebt, onModalChange }) => {
      const [filterTab, setFilterTab] = useState('ALL'); // ALL | HUTANG | PIUTANG

      const totals = useMemo(() => {

        let totalPiutang = 0;
        safeDebts.forEach(d => {

            if (d.type === 'HUTANG') totalHutang += amt;
            else totalPiutang += amt;
          }

      }, [safeDebts]);

        if (filterTab === 'ALL') return safeDebts;
        return safeDebts.filter(d => d.type === filterTab);

      return (
        <div className="space-y-4 pb-28 animate-ios-tab-view">

              <div className="text-lg font-bold text-slate-900 dark:text-white">
                {hideBalance ? 'Rp ••••••' : formatIDR(totals.totalHutang)}

            </div>
            <div className="ios-inset-group">
              <span className="text-[10px] font-bold uppercase tracking-wider text-emerald-500 block mb-1">
                Piutang Saya (Dipinjam)

              <div className="text-lg font-bold text-slate-900 dark:text-white">
                {hideBalance ? 'Rp ••••••' : formatIDR(totals.totalPiutang)}

                <button

                  onClick={() => setFilterTab(tab)}
                  className={`px-3.5 py-1.5 rounded-lg transition-colors ios-btn-tap ${

                      ? 'bg-white dark:bg-slate-700 text-brand dark:text-white shadow-sm font-bold'
                      : 'text-slate-500 dark:text-slate-400'

            <button
              type="button"
              onClick={() => {
                setSelectedDebt(null);
                setIsModalOpen(true);
              }}
              className="px-3 py-1.5 bg-sky-50 dark:bg-slate-800 text-brand dark:text-sky-400 text-xs font-bold rounded-xl border border-sky-200/60 dark:border-slate-700 flex items-center gap-1.5 shadow-sm ios-btn-tap hover:bg-sky-100"
            >
              <Icon name="plus" className="w-3.5 h-3.5" />
              <span>Tambah</span>
            </button>

          {/* Debt List */}
          {filteredList.length === 0 ? (
            <div className="ios-inset-group text-center py-10">
              <IconBadge icon="receipt" className="w-14 h-14 rounded-2xl bg-sky-50 dark:bg-slate-800 text-brand mx-auto mb-3" iconClass="w-7 h-7" />
              <h3 className="text-sm font-bold text-slate-800 dark:text-white">Belum Ada Catatan Hutang / Piutang</h3>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-xs mx-auto mb-4">
                Catat pinjaman pribadi atau uang yang sedang dipinjam rekan agar tertata rapi.
              </p>
              <button
                type="button"
                onClick={() => {
                  setSelectedDebt(null);
                  setIsModalOpen(true);
                }}
                className="inline-flex items-center gap-2 px-5 py-2.5 bg-brand hover:bg-brand-hover text-white text-xs font-bold rounded-xl shadow-sm transition-colors ios-btn-tap mx-auto"
              >
                <Icon name="plus" className="w-4 h-4" />
                <span>Mulai Buat Catatan</span>

                      <Icon name={item.type === 'HUTANG' ? 'arrow-up-right' : 'arrow-down-left'} className="w-5 h-5" />

                    <div>

                        }`}>
                          {item.status === 'LUNAS' ? 'LUNAS' : item.type === 'HUTANG' ? 'HUTANG' : 'PIUTANG'}
                        </span>
                      </div>
                      <div className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">
                        {item.notes ? item.notes : 'Tanpa keterangan'}
                        {item.dueDate && ` • Tempo: ${formatDateID(item.dueDate)}`}
                      </div>
                    </div>

                  <div className="flex items-center gap-2">
                    <div className="text-right">
                      <div className={`text-xs font-bold ${

                onAddDebt(data);
                setIsModalOpen(false);

          )}

    // =========================================================================
    // 6. CORE MODALS (TRANSACTION, ACCOUNTS, SAVINGS, SETTINGS)
    // =========================================================================
    const TransactionModal = ({ isOpen, onClose, initialData, accounts, onAddTransaction }) => {
      const [type, setType] = useState('EXPENSE');
      const [amountStr, setAmountStr] = useState('');
      const [accountId, setAccountId] = useState(accounts[0]?.id || '');
      const [category, setCategory] = useState(CATEGORIES[0].id);
      const [date, setDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [notes, setNotes] = useState('');
      const [error, setError] = useState('');
      const [isClosing, setIsClosing] = useState(false);

      const handleClose = () => {
        setIsClosing(true);
        setTimeout(() => {
          setIsClosing(false);
          onClose();
        }, 220);
      };

      useEffect(() => {
        if (initialData) {
          setType(initialData.type || 'EXPENSE');
          setAmountStr(initialData.amount ? String(initialData.amount) : '');
          setCategory(initialData.category || CATEGORIES[0].id);
          setNotes(initialData.notes || '');
          if (initialData.accountId) setAccountId(initialData.accountId);
        } else {
          setType('EXPENSE');
          setAmountStr('');
          setCategory(CATEGORIES[0].id);
          setNotes('');
        }
        if (accounts.length > 0 && !accounts.some(a => a.id === accountId)) {
          setAccountId(accounts[0].id);
        }
      }, [initialData, accounts, isOpen]);

      if (!isOpen) return null;

      const filteredCategories = CATEGORIES.filter(c => c.type === 'ALL' || c.type === type);

      const handleQuickAdd = (value) => {
        const current = parseRawNumber(amountStr);
        setAmountStr((current + value).toString());
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const rawAmount = parseRawNumber(amountStr);
        if (rawAmount <= 0) {
          setError('Nominal harus lebih dari 0');
          return;
        }
        if (!accountId) {
          setError('Pilih dompet terlebih dahulu');
          return;
        }

        const newTx = {
          id: 'tx_' + Date.now(),
          accountId,
          type,
          amount: rawAmount,
          category,
          date,
          notes: notes.trim(),
          createdAt: new Date().toISOString()
        };
