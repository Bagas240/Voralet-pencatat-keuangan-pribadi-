    };

    // =========================================================================
    // DEDICATED CARDS / WALLET VIEW (TAB 2 - KANTONG KEUANGAN)
    // =========================================================================
    const CardsView = ({
      accounts = [],
      transactions = [],
      hideBalance = false,
      onToggleHideBalance,
      onAddAccount,
      onUpdateAccount,
      onDeleteAccount,
      onReorderAccounts,
      onOpenAddTx,
      onToast
    }) => {
      const [isAdding, setIsAdding] = useState(false);
      const [editingAcc, setEditingAcc] = useState(null);
      const [name, setName] = useState('');
      const [type, setType] = useState('Bank');
      const [initialBalance, setInitialBalance] = useState('');
      const [color, setColor] = useState('#0284C7');
      const [expandedCardId, setExpandedCardId] = useState(null);

      // Drag and drop reordering state
      const [draggedId, setDraggedId] = useState(null);
      const [dragOverId, setDragOverId] = useState(null);
      const [dragPosition, setDragPosition] = useState(null); // 'before' | 'after'
      const isDraggingRef = useRef(false);
      const justDraggedRef = useRef(false);
      const cardRefs = useRef({});
      const touchStateRef = useRef(null);

      const safeAccounts = Array.isArray(accounts) ? accounts : [];
      const safeTransactions = Array.isArray(transactions) ? transactions : [];

      // Reorder account programmatically (e.g. Move up/down/top)
      const handleMoveAccount = useCallback((accId, direction) => {
        const idx = safeAccounts.findIndex(a => a.id === accId);
        if (idx === -1) return;
        const next = [...safeAccounts];
        const [moved] = next.splice(idx, 1);
        if (direction === 'top') {
          next.unshift(moved);
        } else if (direction === 'up' && idx > 0) {
          next.splice(idx - 1, 0, moved);
        } else if (direction === 'down' && idx < safeAccounts.length - 1) {
          next.splice(idx + 1, 0, moved);
        } else {
          return;
        }
        if (onReorderAccounts) {
          onReorderAccounts(next);
        }
        if (window.VoraletHaptics?.notification) {
          window.VoraletHaptics.notification('success');
        } else if (window.VoraletHaptics?.tap) {
          window.VoraletHaptics.tap();
        }
      }, [safeAccounts, onReorderAccounts]);

      // Pointer & Touch drag handler for mobile WebView and desktop
      const handleDragHandlePointerDown = useCallback((accId, e) => {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        e.stopPropagation();

        setExpandedCardId(null);
        const pointerId = e.pointerId;
        const startY = e.clientY;
        const startX = e.clientX;

        if (window.VoraletHaptics?.tap) {
          window.VoraletHaptics.tap();
        }

        touchStateRef.current = {
          accId,
          pointerId,
          startY,
          startX,
          isStarted: false
        };

        const handlePointerMove = (moveEv) => {
          if (!touchStateRef.current || touchStateRef.current.pointerId !== moveEv.pointerId) return;
          const deltaY = moveEv.clientY - touchStateRef.current.startY;
          const deltaX = moveEv.clientX - touchStateRef.current.startX;

          if (!touchStateRef.current.isStarted) {
            if (Math.abs(deltaY) > 6 || Math.abs(deltaX) > 6) {
              touchStateRef.current.isStarted = true;
              isDraggingRef.current = true;
              setDraggedId(accId);
              if (window.VoraletHaptics?.selection) {
                window.VoraletHaptics.selection();
              }
            } else {
              return;
            }
          }

          if (moveEv.cancelable) {
            moveEv.preventDefault();
          }

          const currentClientY = moveEv.clientY;
          let foundId = null;
          let foundPos = null;

          for (const a of safeAccounts) {
            const el = cardRefs.current[a.id];
            if (!el) continue;
            const rect = el.getBoundingClientRect();
            if (currentClientY >= rect.top && currentClientY <= rect.bottom) {
              foundId = a.id;
              const midY = rect.top + rect.height / 2;
              foundPos = currentClientY < midY ? 'before' : 'after';
              break;
            }
          }

          if (foundId) {
            setDragOverId(foundId);
            setDragPosition(foundPos);
          }
        };

        const handlePointerUp = (upEv) => {
          if (!touchStateRef.current || touchStateRef.current.pointerId !== upEv.pointerId) return;

          window.removeEventListener('pointermove', handlePointerMove);
          window.removeEventListener('pointerup', handlePointerUp);
          window.removeEventListener('pointercancel', handlePointerUp);

          const wasStarted = touchStateRef.current.isStarted;
          touchStateRef.current = null;

          if (wasStarted) {
            justDraggedRef.current = true;
            setTimeout(() => {
              justDraggedRef.current = false;
            }, 300);

            setDraggedId(currDragged => {
              setDragOverId(currOver => {
                setDragPosition(currPos => {
                  if (currDragged && currOver && currDragged !== currOver) {
                    const fromIdx = safeAccounts.findIndex(a => a.id === currDragged);
                    const toIdx = safeAccounts.findIndex(a => a.id === currOver);
                    if (fromIdx !== -1 && toIdx !== -1) {
                      const next = [...safeAccounts];
                      const [moved] = next.splice(fromIdx, 1);
                      const finalIdx = next.findIndex(a => a.id === currOver);
                      const insertIdx = currPos === 'after' ? finalIdx + 1 : finalIdx;
                      next.splice(insertIdx, 0, moved);

                      if (onReorderAccounts) {
                        onReorderAccounts(next);
                      }
                      if (window.VoraletHaptics?.notification) {
                        window.VoraletHaptics.notification('success');
                      } else if (window.VoraletHaptics?.tap) {
                        window.VoraletHaptics.tap();
                      }
                    }
                  }
                  return null;
                });
                return null;
              });
              return null;
            });
            isDraggingRef.current = false;
          }
        };

        window.addEventListener('pointermove', handlePointerMove, { passive: false });
        window.addEventListener('pointerup', handlePointerUp);
        window.addEventListener('pointercancel', handlePointerUp);
      }, [safeAccounts, onReorderAccounts]);

      // HTML5 Drag and Drop handlers for desktop
      const handleHtmlDragStart = (e, accId) => {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', accId);
        setDraggedId(accId);
        isDraggingRef.current = true;
        setExpandedCardId(null);
      };

      const handleHtmlDragOver = (e, accId) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const el = cardRefs.current[accId];
        if (el) {
          const rect = el.getBoundingClientRect();
          const midY = rect.top + rect.height / 2;
          const pos = e.clientY < midY ? 'before' : 'after';
          setDragOverId(accId);
          setDragPosition(pos);
        }
      };

      const handleHtmlDrop = (e, targetAccId) => {
        e.preventDefault();
        const sourceAccId = e.dataTransfer.getData('text/plain') || draggedId;
        if (sourceAccId && targetAccId && sourceAccId !== targetAccId) {
          const fromIdx = safeAccounts.findIndex(a => a.id === sourceAccId);
          const toIdx = safeAccounts.findIndex(a => a.id === targetAccId);
          if (fromIdx !== -1 && toIdx !== -1) {
            const next = [...safeAccounts];
            const [moved] = next.splice(fromIdx, 1);
            const finalIdx = next.findIndex(a => a.id === targetAccId);
            const insertIdx = dragPosition === 'after' ? finalIdx + 1 : finalIdx;
            next.splice(insertIdx, 0, moved);
            if (onReorderAccounts) {
              onReorderAccounts(next);
            }
            if (window.VoraletHaptics?.notification) {
              window.VoraletHaptics.notification('success');
            }
          }
        }
        setDraggedId(null);
        setDragOverId(null);
        setDragPosition(null);
        isDraggingRef.current = false;
      };

      const handleHtmlDragEnd = () => {
        setDraggedId(null);
        setDragOverId(null);
        setDragPosition(null);
        isDraggingRef.current = false;
      };

      // Calculate total balance across all pockets
      const totalBalance = useMemo(() => {
        return safeAccounts.reduce((acc, a) => {
          return acc + Ledger.getAccountBalance(a.id, safeAccounts, safeTransactions);
        }, 0);
      }, [safeAccounts, safeTransactions]);

      const handleStartEdit = (acc, e) => {
        if (e) e.stopPropagation();
        setEditingAcc(acc);
        setName(acc.name || '');
        setType(acc.type || 'Bank');
        setInitialBalance(String(acc.initialBalance || '0'));
        setColor(acc.color || '#0284C7');
        setIsAdding(true);
      };

      const handleSave = (e) => {
        if (e) e.preventDefault();
        const cleanName = Validators.sanitizeText(name, 40);
        if (!cleanName) return;

        const numInit = Math.max(0, Validators.sanitizeNumber(initialBalance, 0));

        if (editingAcc) {
          onUpdateAccount({
            ...editingAcc,
            name: cleanName,
            type,
            initialBalance: numInit,
            color
          });
        } else {
          onAddAccount({
            id: 'acc_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
            name: cleanName,
            type,
            initialBalance: numInit,
            color
          });
        }

        setIsAdding(false);
        setEditingAcc(null);
        setName('');
        setInitialBalance('');
      };

      return (
        <div className="space-y-4 pb-24 animate-ios-tab-view">
          {/* Header Title Bar */}
          <div className="flex items-center justify-between pt-1">
            <div>
              <h2 className="text-xl font-bold text-slate-900 dark:text-white">Kantong Keuangan</h2>
              <p className="text-xs text-slate-500 dark:text-slate-400">Atur rekening bank, e-wallet, dan kas tunai</p>
            </div>
            {!isAdding && (
              <button
                type="button"
                onClick={() => {
                  setEditingAcc(null);
                  setName('');
                  setType('Bank');
                  setInitialBalance('');
                  setColor('#0284C7');
                  setIsAdding(true);
                }}
                className="px-3.5 py-2 bg-[#0284C7] hover:bg-[#0369A1] text-white text-xs font-bold rounded-xl flex items-center gap-1.5 transition-colors ios-btn-tap shadow-xs"
              >
                <Icon name="plus" className="w-3.5 h-3.5" strokeWidth={2.5} />
                <span>Tambah</span>
              </button>
            )}
          </div>

          {/* Total Saldo Semua Kantong Banner (Strict Flat Design) */}
          <div className="bg-[#F0F9FF] dark:bg-slate-800 rounded-2xl border border-sky-100 dark:border-slate-700 p-4 select-none">
            <div className="flex items-center justify-between mb-1.5">
              <span className="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">
                TOTAL SALDO SEMUA KANTONG
              </span>
              {onToggleHideBalance && (
                <button
                  type="button"
                  onClick={onToggleHideBalance}
                  className="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 rounded-lg ios-btn-tap"
                  title={hideBalance ? 'Tampilkan Saldo' : 'Sembunyikan Saldo'}
                >
                  <Icon name={hideBalance ? 'eye-off' : 'eye'} className="w-3.5 h-3.5" />
                </button>
              )}
            </div>
            <div className="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">
              {hideBalance ? 'Rp ••••••••' : formatIDR(totalBalance)}
            </div>
            <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">
              Terdistribusi di {safeAccounts.length} kantong aktif
            </p>
          </div>

          {/* Inline Add / Edit Form */}
          {isAdding && (
            <form onSubmit={handleSave} className="bg-[#F0F9FF] dark:bg-slate-800 rounded-2xl border border-sky-200 dark:border-slate-700 p-4 space-y-3.5 animate-ios-spring-pop">
              <div className="flex items-center justify-between pb-2 border-b border-sky-100 dark:border-slate-700">
                <h3 className="text-xs font-bold text-slate-900 dark:text-white">
                  {editingAcc ? 'Edit Kantong' : 'Tambah Kantong Baru'}
                </h3>
                <button
                  type="button"
                  onClick={() => {
                    setIsAdding(false);
                    setEditingAcc(null);
                  }}
                  className="text-xs font-semibold text-slate-500 hover:text-slate-700 dark:text-slate-400"
                >
                  Batal
                </button>
              </div>

              <div>
                <label className="text-[11px] font-semibold text-slate-600 dark:text-slate-300 block mb-1">
                  Nama Kantong
                </label>
                <input
                  type="text"
                  required
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="Contoh: BCA Utama, Gopay, Dompet Fisik"
                  className="w-full px-3.5 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs text-slate-900 dark:text-white focus:outline-none focus:border-[#0284C7]"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-[11px] font-semibold text-slate-600 dark:text-slate-300 block mb-1">
                    Jenis Kantong
                  </label>
                  <select
                    value={type}
                    onChange={(e) => setType(e.target.value)}
                    className="w-full px-3 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs text-slate-900 dark:text-white focus:outline-none focus:border-[#0284C7]"
                  >
                    <option value="Bank">Rekening Bank</option>
                    <option value="E-Wallet">E-Wallet</option>
                    <option value="Cash">Kas Tunai</option>
                    <option value="Investasi">Investasi</option>
                  </select>
                </div>

                <div>
                  <label className="text-[11px] font-semibold text-slate-600 dark:text-slate-300 block mb-1">
                    {editingAcc ? 'Saldo Pokok Awal' : 'Saldo Awal'}
                  </label>
                  <input
                    type="number"
                    min="0"
                    value={initialBalance}
                    onChange={(e) => setInitialBalance(e.target.value)}
                    placeholder="0"
                    className="w-full px-3 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs text-slate-900 dark:text-white focus:outline-none focus:border-[#0284C7]"
                  />
                </div>
              </div>

              <button
                type="submit"
                className="w-full py-2.5 bg-[#0284C7] hover:bg-[#0369A1] text-white text-xs font-bold rounded-xl transition-colors ios-btn-tap"
              >
                {editingAcc ? 'Simpan Perubahan' : 'Buat Kantong'}
              </button>
            </form>
          )}

          {/* Simplified Pocket Cards List */}
          <div className="space-y-2.5">
            <div className="flex items-center justify-between px-1">
              <span className="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                Daftar Kantong ({safeAccounts.length})
              </span>
              {safeAccounts.length > 1 ? (
                <span className="text-[10px] text-slate-400 flex items-center gap-1 font-medium">
                  <Icon name="grip-vertical" className="w-3 h-3 text-sky-500" />
                  <span>Tahan & geser untuk atur prioritas</span>
                </span>
              ) : (
                <span className="text-[10px] text-slate-400">Ketuk kantong untuk mutasi & opsi</span>

    // =========================================================================
    // 8. FLOATING CAPSULE NAVIGATION (ICON-ONLY 5 TABS WITH TOUCH DRAG MECHANICS)
    // =========================================================================
    // =========================================================================
    // 8. FLOATING CAPSULE NAVIGATION (ICON-ONLY 5 TABS WITH FLUID iOS DRAG & DUAL MASK)
    // =========================================================================
    const FloatingCapsuleNav = ({ currentTab, onSelectTab }) => {
      const tabs = [
        { id: 'dashboard', label: 'Ringkasan', icon: 'home' },
        { id: 'cards', label: 'Kantong', icon: 'credit-card' },
        { id: 'debts', label: 'Hutang', icon: 'receipt' },
        { id: 'savings', label: 'Impian', icon: 'target' },
        { id: 'analytics', label: 'Statistik', icon: 'pie-chart' }
      ];

      const navRef = useRef(null);
      const isDraggingRef = useRef(false);
      const activeIndex = Math.max(0, tabs.findIndex(t => t.id === currentTab));

      // Continuous float position for real-time drag (0.0 to 4.0)
      const [dragPos, setDragPos] = useState(activeIndex);
      const [isDragging, setIsDragging] = useState(false);

      // Sync dragPos with activeIndex when not actively dragging
      useEffect(() => {
        if (!isDraggingRef.current) {
          setDragPos(activeIndex);
        }
      }, [activeIndex]);

      const updatePosFromCoord = (clientX) => {
        if (!navRef.current) return;
        const rect = navRef.current.getBoundingClientRect();
        const padding = 6;
        const availableW = rect.width - (padding * 2);
        const relX = clientX - (rect.left + padding);
        const fraction = Math.max(0, Math.min(0.9999, relX / availableW));
        const continuousPos = fraction * tabs.length;
        setDragPos(continuousPos);
      };

      const handlePointerDown = (clientX) => {
        isDraggingRef.current = true;
        setIsDragging(true);
        if (window.VoraletHaptics) window.VoraletHaptics.tap();
        else if (window.navigator?.vibrate) window.navigator.vibrate(10);
        updatePosFromCoord(clientX);
      };

      const handlePointerMove = (clientX) => {
        if (!isDraggingRef.current) return;
        updatePosFromCoord(clientX);
      };

      const handlePointerUp = () => {
        if (!isDraggingRef.current) return;
        isDraggingRef.current = false;
        setIsDragging(false);

        // Snap to nearest tab
        const finalIdx = Math.max(0, Math.min(tabs.length - 1, Math.round(dragPos - 0.5)));
        setDragPos(finalIdx);
        if (tabs[finalIdx] && tabs[finalIdx].id !== currentTab) {
          onSelectTab(tabs[finalIdx].id);
          if (window.VoraletHaptics) window.VoraletHaptics.tap();
          else if (window.navigator?.vibrate) window.navigator.vibrate(15);
        }
      };

      const currentPos = isDragging ? Math.max(0, Math.min(tabs.length - 1, dragPos - 0.5)) : activeIndex;
      const pillLeftPercent = (currentPos / tabs.length) * 100;
      const pillWidthPercent = 100 / tabs.length;

      return (
        <nav
          ref={navRef}
          onTouchStart={(e) => { if (e.touches?.[0]) handlePointerDown(e.touches[0].clientX); }}
          onTouchMove={(e) => { if (e.touches?.[0]) handlePointerMove(e.touches[0].clientX); }}
          onTouchEnd={handlePointerUp}
          onTouchCancel={handlePointerUp}
          onMouseDown={(e) => handlePointerDown(e.clientX)}
          onMouseMove={(e) => handlePointerMove(e.clientX)}
          onMouseUp={handlePointerUp}
          onMouseLeave={() => { if (isDraggingRef.current) handlePointerUp(); }}
          className="fixed bottom-5 left-0 right-0 z-50 w-[92%] max-w-[360px] h-14 mx-auto rounded-full bg-[#FFFFFF] dark:bg-[#1E293B] border border-slate-200 dark:border-[#334155] shadow-[0_12px_32px_rgba(15,23,42,0.18)] dark:shadow-[0_16px_36px_rgba(0,0,0,0.6)] select-none touch-none overflow-hidden p-1.5"
          style={{ willChange: 'transform' }}
        >
          {/* Inner relative container for precise pixel positioning */}
          <div className="relative w-full h-full">

            {/* BASE LAYER: Inactive Grey / Slate Icons */}
            <div className="absolute inset-0 flex items-center justify-around pointer-events-none">
              {tabs.map((t) => (
                <div
                  key={t.id}
                  className="flex-1 h-full flex items-center justify-center text-slate-400 dark:text-slate-500"
                >
                  <Icon
                    name={t.icon}
                    className="w-5 h-5 flex-shrink-0 aspect-square"
                    strokeWidth={1.8}
                  />
                </div>
              ))}
            </div>

            {/* SLIDING PILL BACKGROUND - Smooth spring when releasing, instantaneous when dragging */}
            <div
              className={`absolute top-0 bottom-0 rounded-full bg-[#0284C7] dark:bg-[#38BDF8] shadow-sm pointer-events-none ${
                isDragging ? 'transition-none' : 'transition-all duration-300'
              }`}
              style={{
                left: `${pillLeftPercent}%`,
                width: `${pillWidthPercent}%`,
                transitionTimingFunction: 'cubic-bezier(0.16, 1, 0.3, 1)'
              }}
            />

            {/* TOP MASKED LAYER: Brilliant White Icons revealed EXACTLY where the pill is */}
            <div
              className={`absolute inset-0 pointer-events-none overflow-hidden ${
                isDragging ? 'transition-none' : 'transition-all duration-300'
              }`}
              style={{
                clipPath: `inset(0 ${Math.max(0, 100 - (pillLeftPercent + pillWidthPercent))}% 0 ${pillLeftPercent}% round 9999px)`,
                WebkitClipPath: `inset(0 ${Math.max(0, 100 - (pillLeftPercent + pillWidthPercent))}% 0 ${pillLeftPercent}% round 9999px)`,
                transitionTimingFunction: 'cubic-bezier(0.16, 1, 0.3, 1)'
              }}
            >
              <div className="w-full h-full flex items-center justify-around">
                {tabs.map((t) => (
                  <div
                    key={t.id}
                    className="flex-1 h-full flex items-center justify-center text-white dark:text-[#0F172A]"
                  >
                    <Icon
                      name={t.icon}
                      className="w-5 h-5 flex-shrink-0 aspect-square"
                      strokeWidth={2.4}
                    />
                  </div>
                ))}
              </div>
            </div>

            {/* CLICKABLE HIT TARGETS - 48x48dp touch accessibility */}
            <div className="absolute inset-0 flex items-center justify-around z-20">
              {tabs.map((t, idx) => (
                <button
                  key={t.id}
                  type="button"
                  onClick={() => {
                    setDragPos(idx);
                    onSelectTab(t.id);
                  }}
                  title={t.label}
                  aria-label={t.label}
                  className="flex-1 h-full flex items-center justify-center rounded-full ios-btn-tap focus:outline-none cursor-pointer"
                />
              ))}
            </div>

          </div>
        </nav>
      );
    };

      onDelete,
      onEdit,
      onDuplicate,
      isNewlyAdded = false,
      isDeleting = false,
      onClearNewlyAdded,
      disableAnimation = false
    }) => {
      const [offsetX, setOffsetX] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const startX = useRef(0);
      const startY = useRef(0);
      const longPressTimer = useRef(null);
      const [isMenuOpen, setIsMenuOpen] = useState(false);

      const handleTouchStart = (e) => {
        startX.current = e.touches[0].clientX;
        startY.current = e.touches[0].clientY;
        setIsDragging(false);

        // Long press detection (500ms)
        longPressTimer.current = setTimeout(() => {
          setIsMenuOpen(true);
        }, 500);
      };

      const handleTouchMove = (e) => {
        const diffX = e.touches[0].clientX - startX.current;
        const diffY = e.touches[0].clientY - startY.current;

        // If moved more than 8px, cancel long press
        if (Math.abs(diffX) > 8 || Math.abs(diffY) > 8) {
          clearTimeout(longPressTimer.current);
        }

        // Only drag horizontally if diffX > diffY
        if (Math.abs(diffX) > Math.abs(diffY)) {
          setIsDragging(true);
          // Limit drag between -80 (delete) and 80 (edit)
          const clamped = Math.max(-80, Math.min(80, diffX));
          setOffsetX(clamped);
        }
      };

      const handleTouchEnd = () => {
        clearTimeout(longPressTimer.current);
        if (offsetX < -45) {
          // Revealed delete
          setOffsetX(-70);
        } else if (offsetX > 45) {
          // Revealed edit
          setOffsetX(70);
        } else {
          setOffsetX(0);
        }
        setIsDragging(false);
      };

      return (
        <div
          className={`relative overflow-hidden select-none h-[64px] ${
            isDeleting
              ? 'animate-tx-fade-out'
              : isNewlyAdded
                ? 'animate-tx-slide-in rounded-2xl'
                : disableAnimation
                  ? ''
                  : 'animate-tx-card-entry'
          }`}
          style={{
            height: '64px',
            boxSizing: 'border-box',
            animationDelay: isDeleting || isNewlyAdded || disableAnimation ? '0ms' : `${Math.min((idx || 0) * 35, 280)}ms`
          }}
          onAnimationEnd={(e) => {
            if (e.target === e.currentTarget && isNewlyAdded && onClearNewlyAdded) {
              onClearNewlyAdded(tx.id);
            }
          }}
        >
          {/* Background Swipe Actions */}
          <div className="absolute inset-0 flex items-center justify-between pointer-events-auto">
            {/* Swipe Right Action: Edit */}
            <button
              type="button"
              onClick={() => {
                setOffsetX(0);
                onEdit(tx);
              }}
              className="w-16 h-full bg-brand text-white flex flex-col items-center justify-center text-[10px] font-bold rounded-l-xl ios-btn-tap"
            >
              <Icon name="edit" className="w-4 h-4 mb-0.5" />
              <span>Edit</span>
            </button>

            {/* Swipe Left Action: Delete */}
            <button
              type="button"
              onClick={() => {
                setOffsetX(0);
                onDelete(tx.id);
              }}
              className="w-16 h-full bg-rose-600 text-white flex flex-col items-center justify-center text-[10px] font-bold rounded-r-xl ios-btn-tap"
            >
              <Icon name="trash" className="w-4 h-4 mb-0.5" />
              <span>Hapus</span>
            </button>
          </div>

          {/* Foreground Row */}
          <div
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
            onClick={() => {
              if (offsetX !== 0) setOffsetX(0);
            }}
            style={{
              transform: `translate3d(${offsetX}px, 0, 0)`,
              transition: isDragging ? 'none' : 'transform 0.25s cubic-bezier(0.32, 0.72, 0, 1)'
            }}
            className={`relative bg-white dark:bg-slate-800 flex items-center justify-between h-full px-1.5 ${!isLast ? 'ios-hairline' : ''} ios-touch-item ${
              isNewlyAdded ? 'animate-tx-highlight rounded-xl' : ''
            }`}
          >
            <div className="flex items-center gap-3 min-w-0 pointer-events-none">
              <div className="relative shrink-0">
                <IconBadge icon={cat.icon} className="p-2.5 rounded-2xl bg-sky-100 dark:bg-slate-700 text-brand dark:text-sky-400 shrink-0" />
                <div className={`absolute -bottom-1 -right-1 w-4 h-4 rounded-full flex items-center justify-center text-white border-2 border-white dark:border-slate-800 ${
                  tx.type === 'EXPENSE' ? 'bg-rose-500' : 'bg-emerald-500'
                }`}>
                  <Icon name={tx.type === 'EXPENSE' ? 'arrow-up-right' : 'arrow-down-left'} className="w-2.5 h-2.5" strokeWidth={3} />
                </div>
              </div>
              <div className="min-w-0">
                <h4 className="text-xs font-bold text-slate-900 dark:text-white truncate">
                  {cat.label}
                </h4>
                <div className="text-[11px] text-slate-400 flex items-center gap-1.5 mt-0.5">
                  <span>{formatDateID(tx.date)}</span>
                  {acc && (
                    <>
                      <span>•</span>
                      <span className="text-slate-500 dark:text-slate-400 font-medium">{acc.name}</span>
                    </>
                  )}
                  {tx.notes && (
                    <>
                      <span>•</span>
                      <span className="truncate italic max-w-[130px]">{tx.notes}</span>
                    </>
                  )}
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2 shrink-0">
              <span className={`text-xs whitespace-nowrap truncate font-bold ${
                tx.type === 'EXPENSE' ? 'text-rose-600 dark:text-rose-400' : 'text-emerald-600 dark:text-emerald-400'
              }`}>
                {tx.type === 'EXPENSE' ? '-' : '+'}
                {hideBalance ? 'Rp ••••••' : formatIDR(tx.amount)}
              </span>
              <button
                type="button"
                onClick={(e) => {
                  e.stopPropagation();
                  setIsMenuOpen(true);
                }}
                className="p-1.5 text-slate-300 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg ios-btn-tap"
                title="Pilihan"
              >
                <Icon name="more-horizontal" className="w-4 h-4" />
              </button>
            </div>
          </div>

          {/* Contextual Long-Press / More Menu */}
          <ContextualMenuModal
            isOpen={isMenuOpen && !isDeleting}
            title={`${cat.label} - ${formatIDR(tx.amount)}`}
            onClose={() => setIsMenuOpen(false)}
            onEdit={() => onEdit(tx)}
            onDuplicate={() => onDuplicate(tx)}
            onDelete={() => onDelete(tx.id)}
          />
        </div>
      );
    });

    // =========================================================================
    // 9.5. VIRTUALIZED TRANSACTION LIST (High-Performance List Virtualization)
    // =========================================================================
    const ITEM_ROW_HEIGHT = 64;
    const VIRTUAL_OVERSCAN = 6;

    const VirtualizedTransactionList = React.memo(({
      transactions,
      customCategories,
      safeAccounts,
      hideBalance,
      onDeleteTx,
      onEditTx,
      onDuplicateTx,
      newlyAddedTxIds,
      deletingTxIds,
      onClearNewlyAddedTx
    }) => {
      const containerRef = useRef(null);
      const [scrollState, setScrollState] = useState({
        scrollTop: 0,
        viewportHeight: 600,
        containerOffsetTop: 0
      });

      useEffect(() => {
        const el = containerRef.current;
        if (!el) return;

        // Temukan kontainer scroll induk terdekat (misal <main> ber-overflow-y-auto)
        let parent = el.parentElement;
        while (parent && parent !== document.body) {
          const style = window.getComputedStyle(parent);
          if (style.overflowY === 'auto' || style.overflowY === 'scroll' || parent.tagName === 'MAIN') {
            break;
          }
          parent = parent.parentElement;
        }
        const scrollTarget = parent || window;

        let ticking = false;
        const updatePositions = () => {
          if (!containerRef.current) return;
          const sTop = scrollTarget === window ? window.scrollY : scrollTarget.scrollTop;
          const vHeight = scrollTarget === window ? window.innerHeight : scrollTarget.clientHeight;

          const elRect = containerRef.current.getBoundingClientRect();
          const parentRect = scrollTarget === window ? { top: 0 } : scrollTarget.getBoundingClientRect();
          const relativeTop = (elRect.top - parentRect.top) + sTop;

          setScrollState({
            scrollTop: sTop,
            viewportHeight: vHeight || 600,
            containerOffsetTop: Math.max(0, relativeTop)
          });
          ticking = false;
        };

        const onScrollOrResize = () => {
          if (!ticking) {
            ticking = true;
            requestAnimationFrame(updatePositions);
          }
        };

        updatePositions();
        const eventNode = scrollTarget === window ? window : scrollTarget;
        eventNode.addEventListener('scroll', onScrollOrResize, { passive: true });
        window.addEventListener('resize', onScrollOrResize, { passive: true });

        let resizeObserver = null;
        if (typeof ResizeObserver !== 'undefined') {
          try {
            resizeObserver = new ResizeObserver(() => {
              onScrollOrResize();
            });
            resizeObserver.observe(el);
            if (scrollTarget !== window) {
              resizeObserver.observe(scrollTarget);
            }
          } catch (_) {
            // Abaikan jika ResizeObserver tidak tersedia di lingkungan tertentu
          }
        }

        return () => {
          eventNode.removeEventListener('scroll', onScrollOrResize);
          window.removeEventListener('resize', onScrollOrResize);
          if (resizeObserver) resizeObserver.disconnect();
        };
      }, [transactions.length]);

      if (!transactions || transactions.length === 0) {
        return (
          <div className="text-center py-8">
            <IconBadge icon="receipt" className="w-10 h-10 rounded-xl bg-slate-50 dark:bg-slate-900 text-slate-400 mx-auto mb-1.5" iconClass="w-5 h-5" />
            <p className="text-xs text-slate-400">Tidak ada transaksi ditemukan.</p>
          </div>
        );
      }

      const count = transactions.length;
      const { scrollTop, viewportHeight, containerOffsetTop } = scrollState;
      const relativeScroll = Math.max(0, scrollTop - containerOffsetTop);

      const startIndex = Math.max(0, Math.floor(relativeScroll / ITEM_ROW_HEIGHT) - VIRTUAL_OVERSCAN);
      const endIndex = Math.min(count, Math.ceil((relativeScroll + viewportHeight) / ITEM_ROW_HEIGHT) + VIRTUAL_OVERSCAN);

      const topSpacerHeight = startIndex * ITEM_ROW_HEIGHT;
      const bottomSpacerHeight = Math.max(0, (count - endIndex) * ITEM_ROW_HEIGHT);
      const visibleItems = transactions.slice(startIndex, endIndex);

      return (
        <div ref={containerRef} className="relative w-full" style={{ minHeight: `${count * ITEM_ROW_HEIGHT}px` }}>
          {/* Virtual Top Spacer */}
          {topSpacerHeight > 0 && (
            <div style={{ height: `${topSpacerHeight}px` }} aria-hidden="true" />
          )}

          {/* Rendered Window of Visible Items */}
          <div className="divide-y divide-transparent">
            {visibleItems.map((tx, localIdx) => {
              const globalIdx = startIndex + localIdx;
              const isLast = globalIdx === count - 1;
              const cat = getCategoryById(tx.category, customCategories);
              const acc = safeAccounts.find(a => a.id === tx.accountId);

              return (
                <SwipeableTransactionRow
                  key={tx.id}
                  tx={tx}
                  idx={globalIdx}
                  isLast={isLast}
                  cat={cat}
                  acc={acc}
                  hideBalance={hideBalance}
                  onDelete={onDeleteTx}
                  onEdit={onEditTx}
                  onDuplicate={onDuplicateTx}
                  isNewlyAdded={newlyAddedTxIds ? newlyAddedTxIds.has(tx.id) : false}
                  isDeleting={deletingTxIds ? deletingTxIds.has(tx.id) : false}
                  onClearNewlyAdded={onClearNewlyAddedTx}
                  disableAnimation={globalIdx >= 10}
                />
              );
            })}
          </div>

          {/* Virtual Bottom Spacer */}
          {bottomSpacerHeight > 0 && (
            <div style={{ height: `${bottomSpacerHeight}px` }} aria-hidden="true" />
          )}
        </div>
      );
    });

    // =========================================================================
    // 10. MAIN DASHBOARD
    // =========================================================================
    const MainDashboard = React.memo(({

      transactions,
      userProfile,

    }) => {

      const [filterType, setFilterType] = useState('ALL'); // ALL | EXPENSE | INCOME
      const [selectedAccountFilter, setSelectedAccountFilter] = useState('ALL');
      const [selectedCategoryFilter, setSelectedCategoryFilter] = useState('ALL');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      const [datePreset, setDatePreset] = useState('ALL'); // ALL | TODAY | THIS_WEEK | THIS_MONTH | LAST_MONTH | CUSTOM
      const [isDateFilterOpen, setIsDateFilterOpen] = useState(false);

      const applyDatePreset = (preset) => {
        setDatePreset(preset);
        const now = new Date();
        if (preset === 'ALL') {
          setStartDate('');
          setEndDate('');
        } else if (preset === 'TODAY') {
          const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
          setStartDate(todayStr);
          setEndDate(todayStr);
        } else if (preset === 'THIS_WEEK') {
          const day = now.getDay(); // 0 is Sunday, 1 is Monday...
          const diffToMon = (day === 0 ? -6 : 1) - day;
          const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMon);
          const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
          const monStr = `${mon.getFullYear()}-${String(mon.getMonth() + 1).padStart(2, '0')}-${String(mon.getDate()).padStart(2, '0')}`;
          const sunStr = `${sun.getFullYear()}-${String(sun.getMonth() + 1).padStart(2, '0')}-${String(sun.getDate()).padStart(2, '0')}`;
          setStartDate(monStr);
          setEndDate(sunStr);
        } else if (preset === 'THIS_MONTH') {
          const y = now.getFullYear();
          const m = now.getMonth();
          const firstDay = `${y}-${String(m + 1).padStart(2, '0')}-01`;
          const lastDate = new Date(y, m + 1, 0).getDate();
          const lastDay = `${y}-${String(m + 1).padStart(2, '0')}-${String(lastDate).padStart(2, '0')}`;
          setStartDate(firstDay);
          setEndDate(lastDay);
        } else if (preset === 'LAST_MONTH') {
          const y = now.getMonth() === 0 ? now.getFullYear() - 1 : now.getFullYear();
          const m = now.getMonth() === 0 ? 11 : now.getMonth() - 1;
          const firstDay = `${y}-${String(m + 1).padStart(2, '0')}-01`;
          const lastDate = new Date(y, m + 1, 0).getDate();
          const lastDay = `${y}-${String(m + 1).padStart(2, '0')}-${String(lastDate).padStart(2, '0')}`;
          setStartDate(firstDay);
          setEndDate(lastDay);
        }
      };

      const hasActiveDateFilter = Boolean(startDate || endDate || datePreset !== 'ALL');

      const allCategories = useMemo(() => {
        return getAllCategories(customCategories);
      }, [customCategories]);

      const safeAccounts = useMemo(() => Array.isArray(accounts) ? accounts.filter(Boolean) : [], [accounts]);
      const safeTransactions = useMemo(() => Array.isArray(transactions) ? transactions.filter(Boolean) : [], [transactions]);

      const totalBalance = useMemo(() => {
        return Ledger.getTotalBalance(safeAccounts, safeTransactions);
      }, [safeAccounts, safeTransactions]);

      const monthSummary = useMemo(() => {
        const now = new Date();
        const prefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        const thisMonthTx = safeTransactions.filter(t => t && t.date && t.date.startsWith(prefix));
        return Ledger.getSummaryTotals(thisMonthTx);
      }, [safeTransactions]);

      // Pre-calculated account balances map for instant lookup without O(N) recalculations
      const accountBalancesMap = useMemo(() => {
        const map = new Map();
        for (const acc of safeAccounts) {
          map.set(acc.id, Ledger.getAccountBalance(acc.id, safeAccounts, safeTransactions));
        }
        return map;
      }, [safeAccounts, safeTransactions]);

      // Filtered transactions with date-range support
      const filteredTransactions = useMemo(() => {
        return safeTransactions.filter(tx => {
          if (!tx) return false;
          if (filterType !== 'ALL' && tx.type !== filterType) return false;
          if (selectedAccountFilter !== 'ALL' && tx.accountId !== selectedAccountFilter) return false;
          if (selectedCategoryFilter !== 'ALL' && tx.category !== selectedCategoryFilter) return false;
          if (startDate) {
            const txDate = (tx.date || '').slice(0, 10);
            if (txDate && txDate < startDate) return false;
          }
          if (endDate) {
            const txDate = (tx.date || '').slice(0, 10);
            if (txDate && txDate > endDate) return false;
          }
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const catObj = allCategories.find(c => c.id === tx.category);
            const cat = (catObj?.label || '').toLowerCase();
            const notes = (tx.notes || '').toLowerCase();
            const amt = String(tx.amount || '');
            if (!cat.includes(q) && !notes.includes(q) && !amt.includes(q)) return false;
          }
          return true;
        });
      }, [safeTransactions, filterType, selectedAccountFilter, selectedCategoryFilter, startDate, endDate, searchQuery, allCategories]);

      return (
        <div className="space-y-4 pb-28">
          {/* iOS Profile Header Bar - Compact & Natural without elongated box */}

            <div
              onClick={onOpenSettings}
              className="inline-flex items-center gap-3 cursor-pointer group ios-card-tap py-1 pr-2 rounded-2xl hover:opacity-90 transition-opacity"
              title="Ketuk untuk buka Pengaturan Profil"

              {/* Profile Avatar with clean circular drop shadow so it stands out distinctly from the background */}
              <div className="relative shrink-0 rounded-full shadow-[0_6px_16px_rgba(15,23,42,0.18)] dark:shadow-[0_8px_24px_rgba(0,0,0,0.65)] ring-2 ring-white dark:ring-slate-700">
                <Avatar avatar={userProfile.avatar} name={userProfile.name} size="w-11 h-11" textSize="text-base" />
              </div>
              <div className="min-w-0">
                <div className="flex items-center gap-1.5">
                  <h1 className="text-sm sm:text-base font-bold text-slate-900 dark:text-white leading-tight group-hover:text-brand transition-colors truncate">
                    {userProfile.name || 'Sahabat Voralet'}
                  </h1>
                  <Icon name="chevron-right" className="w-3.5 h-3.5 text-slate-400 group-hover:text-brand transition-colors shrink-0" />
                </div>
                <div className="flex items-center gap-2">
                  <p className="text-[11px] font-mono text-brand dark:text-sky-400 font-semibold truncate">
                    @{userProfile.username || 'voralet_user'}
                  </p>
                  <span className="text-[10px] font-bold px-1.5 py-0.2 rounded-md bg-sky-100 dark:bg-sky-950/60 text-[#0284C7] dark:text-sky-400 border border-sky-200/60 dark:border-sky-800/60">
                    v2.6.0
                  </span>
                </div>
              </div>
            </div>
          </div>

          {/* Hero Balance Card - High Contrast Deep Royal Blue in both Light and Dark Mode */}
          <div
            className="animate-dashboard-card rounded-[22px] p-5 bg-[#0284C7] dark:bg-[#0369A1] text-white border border-[#0369A1] dark:border-sky-600/40 shadow-lg dark:shadow-[0_10px_26px_rgba(3,105,161,0.35)] transition-colors duration-300 ease-in-out"
            style={{ animationDelay: '50ms' }}
          >
            <div className="flex items-center justify-between text-sky-100 mb-1.5">
              <span className="text-[11px] font-bold uppercase tracking-wider text-sky-100">Total Saldo Brankas</span>
              <button
                type="button"
                onClick={onToggleHideBalance}
                className="p-1 text-sky-100 hover:text-white transition-colors ios-btn-tap"
                aria-label="Sensor Saldo"
              >
                <Icon name={hideBalance ? 'eye-off' : 'eye'} className="w-4 h-4 text-sky-100" />
              </button>
            </div>

            <div className="text-2xl whitespace-nowrap truncate font-extrabold tracking-tight mb-4 text-white">
              <span key={hideBalance ? 'hidden' : `bal-${totalBalance}`} className="animate-value-pulse">
                {hideBalance ? 'Rp ••••••••' : formatIDR(totalBalance)}
              </span>
            </div>

            {/* Monthly income and expense summary */}
            <div className="grid grid-cols-2 gap-2 pt-3 border-t border-sky-400/50 dark:border-sky-500/40">
              <div className="flex items-center gap-2.5 p-1.5 rounded-xl bg-white/5 backdrop-blur-[2px]">
                <div className="w-8 h-8 rounded-xl bg-emerald-500/30 text-emerald-100 flex items-center justify-center shrink-0 border border-emerald-300/30">
                  <Icon name="arrow-down-left" className="w-4 h-4 text-emerald-200" strokeWidth={2.5} />
                </div>
                <div className="min-w-0">
                  <span className="text-[10px] text-sky-100 block leading-tight font-medium">Masuk (Bln Ini)</span>
                  <span key={hideBalance ? 'hidden-inc' : `inc-${monthSummary.income}`} className="text-xs whitespace-nowrap truncate font-bold text-white block animate-value-pulse">
                    {hideBalance ? 'Rp ••••••' : formatIDR(monthSummary.income)}
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-2.5 p-1.5 rounded-xl bg-white/5 backdrop-blur-[2px]">
                <div className="w-8 h-8 rounded-xl bg-rose-500/30 text-rose-100 flex items-center justify-center shrink-0 border border-rose-300/30">
                  <Icon name="arrow-up-right" className="w-4 h-4 text-rose-200" strokeWidth={2.5} />
                </div>
                <div className="min-w-0">
                  <span className="text-[10px] text-sky-100 block leading-tight font-medium">Keluar (Bln Ini)</span>
                  <span key={hideBalance ? 'hidden-exp' : `exp-${monthSummary.expense}`} className="text-xs whitespace-nowrap truncate font-bold text-white block animate-value-pulse">
                    {hideBalance ? 'Rp ••••••' : formatIDR(monthSummary.expense)}
                  </span>
                </div>
              </div>
            </div>
          </div>

          {/* Direct Dual Action Bar: Catat Pemasukan (+) & Catat Pengeluaran (-) with Prominent Icons */}
          <div className="grid grid-cols-2 gap-2.5 animate-dashboard-card" style={{ animationDelay: '90ms' }}>
            <button

              onClick={onOpenAddIncome}
              className="py-3 px-3 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white rounded-2xl flex items-center justify-center gap-2 shadow-[0_4px_14px_rgba(5,150,105,0.28)] dark:shadow-[0_6px_20px_rgba(5,150,105,0.35)] transition-all ios-btn-tap"
            >
              <div className="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center shrink-0">
                <Icon name="arrow-down-left" className="w-4 h-4 text-white" strokeWidth={2.5} />
              </div>
              <div className="text-left leading-tight">
                <span className="text-xs font-bold block">Pemasukan</span>
                <span className="text-[10px] text-emerald-100 block font-medium">+ Catat Masuk</span>
              </div>
            </button>

            <button

    /**

    const ThemeCrossfadeOverlay = React.memo(({ transition }) => {
      if (!transition) return null;
      return (
        <div
          key={transition.id}
          className={`ios-theme-crossfade-overlay ${transition.from === 'dark' ? 'from-dark' : 'from-light'}`}
          aria-hidden="true"
        />

    // =========================================================================

    const App = () => {
